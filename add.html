<!doctype html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="google" content="notranslate" />
<title>Hakli — add a word</title>
<!-- social preview (WhatsApp / Open Graph): this is the link people get sent -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hakli — Audio First Dictionary">
<meta property="og:url" content="https://hakli.app/add.html">
<meta property="og:title" content="أضِف كلمة بصوتك · Add a word to Hakli">
<meta property="og:description" content="قُلها، أَرِها، شارِكها — لِنُقوِّ الحَكلي معًا بأصوات أهلها. · Say it, show it, share it — let's strengthen Hakli together, in its own voices.">
<meta property="og:image" content="https://hakli.app/og-hakli-v2.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="ar_OM">
<meta property="og:locale:alternate" content="en_US">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="https://hakli.app/og-hakli-v2.png">
<link rel="icon" href="favicon.svg?v=b1020a" type="image/svg+xml">
<link rel="icon" href="favicon.ico?v=b1020a" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=b1020a">
<link rel="manifest" href="manifest.webmanifest?v=b1020a">
<meta name="theme-color" content="#17241F">
<script src="afd-core.js?v=b1020a"></script>
<script src="afd-words.js?v=b1020a"></script>
<script src="afd-instance.js?v=b1020a"></script>
<style>/* Same khareef tokens as index.html, so this reads as the same app. */
  :root{
    --fog:#EAF0EE; --cloud:#FFFFFF; --mountain:#1F3A34; --mist:#8CA39B; --mist-2:#C4D2CC;
    --resin:#C6873F; --resin-soft:#E7C9A0; --danger:#9E4433; --ink:#17241F;
    --r:22px;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
*{box-sizing:border-box}
html,body{margin:0}
body{background:radial-gradient(120% 80% at 50% -10%, #F3F7F5 0%, var(--fog) 55%, #DFE8E4 100%) fixed;
  color:var(--ink); font-family:var(--sans); -webkit-tap-highlight-color:transparent; min-height:100dvh}
[hidden]{display:none !important}
.hidden{display:none !important}

/* bilingual labels: Arabic leads; the English line shows only in the "auto" tier */
.bi-ar{display:block}
.sub{display:block; font-size:.78em; opacity:.72; margin-top:2px; direction:ltr}
body:not([data-tier="auto"]) .sub{display:none}

header{position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:12px;
  padding:calc(12px + env(safe-area-inset-top)) 16px 12px; background:#F3F7F5;
  box-shadow:0 2px 10px rgba(31,58,52,.05); color:var(--mountain)}
.home{height:30px; display:inline-flex; color:var(--ink)}
.home svg{height:100%; width:auto}
header h1{font-size:17px; margin:0; flex:1; line-height:1.2; text-align:center}
header h1 .sub{font-size:12px}
/* the display button — same control, icons and caption as the dictionary header */
.skin{width:42px; height:42px; flex:0 0 auto; border-radius:50%; border:1px solid var(--mist-2);
  background:var(--cloud); color:var(--mountain); display:grid; place-items:center; cursor:pointer;
  box-shadow:0 2px 8px rgba(31,58,52,.10); margin-bottom:12px}
.skin svg{width:20px; height:20px}
.acct{font:600 17px/1 system-ui,-apple-system,sans-serif}
.acct.in{background:var(--mountain); color:#fff; border-color:var(--mountain)}
.acct:not(.in){color:var(--mist-2); box-shadow:none}
.skin .lbl{font-family:"Iowan Old Style",Palatino,Georgia,serif; font-size:18px; line-height:1}
.capd{position:relative}
.capd::after{content:attr(data-cap); position:absolute; top:calc(100% + 4px); left:50%; transform:translateX(-50%);
  font:500 10.5px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#6F8A81; white-space:nowrap;
  pointer-events:none; direction:rtl}
/* say · show · share — their own row under the header */
.steps{display:flex; justify-content:center; gap:10px; margin:14px 0 0; padding:0; list-style:none}
.steps li{width:40px; height:40px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  font-size:16px; background:var(--cloud); border:1px solid var(--mist-2); opacity:.55}
.steps li.on{opacity:1; border-color:var(--mountain); box-shadow:0 0 0 2px var(--mountain) inset}
.steps li.done{opacity:1; background:var(--mist-2)}

.wrap{max-width:520px; margin:0 auto; padding:16px 16px calc(40px + env(safe-area-inset-bottom))}
section{display:flex; flex-direction:column; align-items:stretch; gap:14px}
h2{font-size:24px; margin:6px 0 0; text-align:center; color:var(--mountain)}
/* a step's title + its spoken prompt (🔈 shows only once that prompt is recorded) */
.titlerow{display:flex; align-items:center; justify-content:center; gap:10px}
.hear{width:40px; height:40px; border-radius:50%; border:1px solid var(--mist-2); background:var(--cloud);
  color:var(--mountain); display:grid; place-items:center; cursor:pointer; margin-top:6px; flex:0 0 auto}
.hear svg{width:20px; height:20px}
h2 .sub{font-size:14px}
.hint{margin:0; text-align:center; font-size:16px; line-height:1.5; color:var(--mountain)}
.note{margin:0; font-size:13px; line-height:1.45; color:#4d6159}
.card{background:var(--cloud); border-radius:var(--r); padding:16px; box-shadow:0 10px 30px rgba(31,58,52,.08)}

.btn{display:block; width:100%; min-height:56px; padding:10px 16px; border-radius:16px; border:0;
  font:inherit; font-size:17px; font-weight:600; cursor:pointer; background:var(--mountain); color:#fff}
.btn.secondary{background:var(--cloud); color:var(--mountain); box-shadow:inset 0 0 0 1.5px var(--mountain)}
.btn.ghost{background:transparent; color:var(--mountain); font-weight:500; min-height:44px}
.btn:disabled{opacity:.5; cursor:default}
.row{display:flex; gap:10px}
.row > *{flex:1}

/* ---- the hold-to-record button (WhatsApp voice-note gesture) ---- */
.stage{display:flex; flex-direction:column; align-items:center; gap:10px; padding:10px 0}
.hold{position:relative; width:148px; height:148px; border-radius:50%; border:0; cursor:pointer;
  background:var(--mountain); color:#fff; display:flex; align-items:center; justify-content:center;
  touch-action:none; -webkit-user-select:none; user-select:none; -webkit-touch-callout:none;
  box-shadow:0 14px 34px rgba(31,58,52,.28); transition:background .15s}
.hold.small{width:104px; height:104px}
.hold svg{width:46%; height:46%; pointer-events:none}
.hold .ring{position:absolute; inset:-10px; border-radius:50%; border:4px solid var(--resin);
  opacity:0; transform:scale(calc(1 + var(--lvl, 0) * .35)); transition:transform .06s linear; pointer-events:none}
.hold.rec{background:var(--resin)}
.hold.rec .ring{opacity:.7}
.hold:disabled{opacity:.5}
.hold-label{margin:0; font-size:15px; text-align:center; color:var(--mountain); min-height:2.6em}
.timer{font-variant-numeric:tabular-nums}

.msg{border-radius:14px; padding:12px 14px; font-size:15px; line-height:1.45; text-align:center}
.msg.ok{background:#DDEEE5; color:#1d4a37}
.msg.warn{background:#F6E7D2; color:#6a4413}
.msg.bad{background:#F3DDD8; color:var(--danger)}

/* ---- the word's face: photo > emoji > identicon, with its play button ---- */
.face{display:flex; align-items:center; justify-content:center; gap:16px}
.face .pic{width:112px; height:112px; border-radius:26px; overflow:hidden; background:var(--cloud);
  display:flex; align-items:center; justify-content:center; font-size:64px; box-shadow:0 10px 30px rgba(31,58,52,.12)}
.face .pic img{width:100%; height:100%; object-fit:cover}
.face .pic svg{width:100%; height:100%}
.play{width:64px; height:64px; border-radius:50%; border:0; background:var(--mountain); color:#fff;
  display:flex; align-items:center; justify-content:center; cursor:pointer}
.play svg{width:28px; height:28px}

/* ---- show it: four big tiles ---- */
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.tile{position:relative; min-height:112px; border-radius:20px; border:0; background:var(--cloud); cursor:pointer;
  font:inherit; color:var(--mountain); padding:12px 8px; display:flex; flex-direction:column; align-items:center;
  justify-content:center; gap:6px; box-shadow:0 8px 22px rgba(31,58,52,.08); font-size:15px; font-weight:600}
.tile .ic{font-size:36px; line-height:1}
.tile.open{box-shadow:inset 0 0 0 2px var(--mountain)}
.tile .tick{position:absolute; top:8px; inset-inline-end:8px; width:24px; height:24px; border-radius:50%;
  background:var(--mountain); color:#fff; font-size:14px; display:none; align-items:center; justify-content:center}
.tile.filled .tick{display:flex}
/* the fifth tile, the word written in letters, runs the full width (10-15) */
.tile.wide{grid-column:1/-1; min-height:84px; flex-direction:row; gap:12px}
.tile.wide .ic{font-size:30px}
#spellIn{font-size:24px}
.panel{display:flex; flex-direction:column; gap:10px}
.emojis{display:grid; grid-template-columns:repeat(auto-fill, minmax(48px, 1fr)); gap:6px}
.emojis button{height:48px; border-radius:12px; border:0; background:#F3F7F5; font-size:28px; cursor:pointer}
.emojis button.on{box-shadow:inset 0 0 0 2px var(--mountain); background:var(--resin-soft)}
input[type=text], input[type=email], input[type=password], input[type=tel]{width:100%; min-height:48px; border-radius:12px;
  border:1.5px solid var(--mist-2); padding:10px 12px; font:inherit; font-size:17px; background:#fff; color:var(--ink)}
input.ar{direction:rtl; font-size:20px}

/* ---- share it ---- */
.check{display:flex; gap:12px; align-items:flex-start; padding:10px 0; cursor:pointer; font-size:15px; line-height:1.4}
.check + .check{border-top:1px solid #edf2ef}
.check input{width:24px; height:24px; flex:0 0 auto; margin:0; accent-color:var(--mountain)}
details summary{cursor:pointer; color:var(--mountain); font-size:14px; padding:6px 0; text-align:center; list-style:none}
details summary::-webkit-details-marker{display:none}
.stack{display:flex; flex-direction:column; gap:10px}
.who{display:flex; align-items:center; justify-content:center; gap:8px; font-size:14px; color:#4d6159; flex-wrap:wrap}
.linkbtn{background:none; border:0; padding:0; font:inherit; color:var(--mountain); text-decoration:underline; cursor:pointer}
.banner{background:var(--resin-soft); color:#5a3a12; border-radius:14px; padding:10px 14px; font-size:14px; text-align:center}
.banner.queue{display:block; width:100%; border:0; font:inherit; font-size:14px; margin:0 0 12px; cursor:default}
.banner.queue.tap{cursor:pointer; text-decoration:underline; text-underline-offset:3px}
.err{color:var(--danger); font-size:14px; text-align:center; margin:0; min-height:1em}
a{color:var(--mountain)}
a.btn.linkish{display:flex; flex-direction:column; align-items:center; justify-content:center; text-decoration:none; text-align:center}
.buildstamp{text-align:center; padding:28px 0 0; font-size:11px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--mist)}
.big-thanks{font-size:56px; text-align:center; line-height:1}
</style>
</head>
<body data-tier="auto">

<header>
  <a class="home" href="index.html" aria-label="Home — the dictionary" title="Home"><svg viewBox="569 239 909 1568" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill-rule="evenodd" d="M585 912 L586 1124 L747 1651 L785 1791 L1260 1791 L1461 1125 L1462 912 L1439 912 L1349 1071 L697 1071 L612 912ZM1042 255 L1034 261 L1010 286 L994 307 L982 326 L972 345 L965 362 L959 383 L957 403 L956 404 L956 429 L957 430 L957 438 L962 463 L974 496 L998 542 L1006 562 L1012 585 L1013 612 L1014 613 L1009 637 L1002 656 L993 674 L972 707 L958 735 L954 747 L950 767 L951 802 L959 832 L972 859 L985 879 L998 896 L1012 912 L1021 920 L1007 880 L1002 861 L998 840 L997 814 L998 813 L998 805 L1000 795 L1006 778 L1016 758 L1033 730 L1045 707 L1056 674 L1057 661 L1058 660 L1057 632 L1053 612 L1045 590 L1046 589 L1061 610 L1077 643 L1085 673 L1086 703 L1087 704 L1085 708 L1083 727 L1074 757 L1061 788 L1050 809 L1056 806 L1064 799 L1087 775 L1100 759 L1115 736 L1115 734 L1117 733 L1128 711 L1137 686 L1141 668 L1142 649 L1143 648 L1142 624 L1141 623 L1140 611 L1134 587 L1129 574 L1119 554 L1103 529 L1069 485 L1051 458 L1037 432 L1027 405 L1021 376 L1021 365 L1020 364 L1021 336 L1022 335 L1024 315 L1029 293 L1035 274 L1042 258Z"/></svg></a>
  <h1 data-k="add.title"></h1>
  <button class="skin capd" id="skin" type="button" data-cap="العرض" title="How words are shown" aria-label="Change how words are shown"></button>
  <!-- who's signed in, at a glance (the dictionary's "حسابي" button) -->
  <button class="skin capd acct" id="acct" type="button" data-cap="حسابي" aria-label="Account"></button>
</header>
<ol class="steps" aria-hidden="true">
  <li data-step="say">🎙️</li><li data-step="show">🖼️</li><li data-step="share">📤</li>
</ol>

<main class="wrap">

  <!-- ============ 1. SAY IT ============ -->
  <!-- words saved on this phone while there was no signal (10-17): how many,
       and — signed out — a tap to sign in so they can go -->
  <button class="banner queue hidden" id="queueNote" type="button"></button>

  <section id="say">
    <div class="titlerow"><h2 data-k="add.step.say"></h2><button class="hear" type="button" hidden aria-label="Hear it" title="Hear it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button></div>
    <p class="hint" data-k="add.say.hint"></p>
    <div class="stage">
      <button class="hold" id="sayBtn" type="button" aria-label="Hold to record">
        <span class="ring"></span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <p class="hold-label" id="sayLabel"></p>
    </div>
    <div class="msg hidden" id="sayMsg" role="status" aria-live="polite"></div>
    <div class="stack hidden" id="sayReview">
      <div class="face"><button class="play" id="sayPlay" type="button" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button></div>
      <div class="row">
        <button class="btn secondary" id="sayAgain" type="button" data-k="add.say.again"></button>
        <button class="btn" id="sayNext" type="button" data-k="add.next"></button>
      </div>
    </div>
  </section>

  <!-- ============ 2. SHOW IT ============ -->
  <section id="show" hidden>
    <div class="face">
      <div class="pic" id="showPic"></div>
      <button class="play" id="showPlay" type="button" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button>
    </div>
    <div class="titlerow"><h2 data-k="add.step.show"></h2><button class="hear" type="button" hidden aria-label="Hear it" title="Hear it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button></div>
    <p class="hint" data-k="add.show.hint"></p>

    <div class="tiles">
      <button class="tile" id="tilePhoto" type="button"><span class="tick">✓</span><span class="ic">📷</span><span data-k="add.show.photo"></span></button>
      <button class="tile" id="tileEmoji" type="button"><span class="tick">✓</span><span class="ic">😀</span><span data-k="add.show.emoji"></span></button>
      <button class="tile" id="tileMeaning" type="button"><span class="tick">✓</span><span class="ic">🗣️</span><span data-k="add.show.meaning"></span></button>
      <button class="tile" id="tileWrite" type="button"><span class="tick">✓</span><span class="ic">✍️</span><span data-k="add.show.write"></span></button>
      <button class="tile wide" id="tileSpell" type="button" hidden><span class="tick">✓</span><span class="ic">✒️</span><span data-k="add.show.spell"></span></button>
    </div>
    <input type="file" id="photoIn" accept="image/*" capture="environment" hidden>

    <div class="card panel" id="panelPhoto" hidden>
      <p class="note" data-k="add.show.photo.note"></p>
      <div class="row">
        <button class="btn secondary" id="photoRetake" type="button" data-k="add.show.photo"></button>
        <button class="btn ghost" id="photoRemove" type="button" data-k="add.show.remove"></button>
      </div>
    </div>

    <div class="card panel" id="panelEmoji" hidden>
      <div class="emojis" id="emojiGrid"></div>
      <label class="note" for="emojiIn" data-k="add.show.emoji.type"></label>
      <input type="text" id="emojiIn" inputmode="text" autocomplete="off" maxlength="16">
      <button class="btn ghost" id="emojiRemove" type="button" data-k="add.show.remove"></button>
    </div>

    <div class="card panel" id="panelMeaning" hidden>
      <p class="note" data-k="add.show.meaning.hint"></p>
      <div class="stage">
        <button class="hold small" id="meanBtn" type="button" aria-label="Hold to record the meaning">
          <span class="ring"></span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        </button>
        <p class="hold-label" id="meanLabel"></p>
      </div>
      <div class="msg hidden" id="meanMsg" role="status" aria-live="polite"></div>
      <div class="row hidden" id="meanReview">
        <button class="btn secondary" id="meanPlay" type="button" aria-label="Play">▶</button>
        <button class="btn ghost" id="meanRemove" type="button" data-k="add.show.remove"></button>
      </div>
    </div>

    <div class="card panel" id="panelWrite" hidden>
      <input type="text" class="ar" id="glossArIn" dir="rtl" maxlength="80" placeholder="…" autocomplete="off">
    </div>

    <!-- the word itself in letters: one person's spelling, never "the" spelling -->
    <div class="card panel" id="panelSpell" hidden>
      <p class="note" data-k="card.spell.hint"></p>
      <input type="text" id="spellIn" maxlength="60" placeholder="…" autocomplete="off" spellcheck="false">
    </div>

    <div class="row">
      <button class="btn ghost" id="showBack" type="button" data-k="add.back"></button>
      <button class="btn" id="showNext" type="button"></button>
    </div>
  </section>

  <!-- ============ 3. SHARE IT ============ -->
  <section id="share" hidden>
    <div class="banner hidden" id="draftBanner">
      <span id="draftText"></span>
      <button class="linkbtn" id="draftDiscard" type="button"></button>
    </div>
    <div class="face">
      <div class="pic" id="sharePic"></div>
      <button class="play" id="sharePlay" type="button" aria-label="Play"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg></button>
    </div>
    <div class="titlerow"><h2 data-k="add.step.share"></h2><button class="hear" type="button" hidden aria-label="Hear it" title="Hear it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button></div>
    <p class="hint" data-k="add.share.hint"></p>

    <div class="card">
      <label class="check"><input type="checkbox" id="cPlay" checked><span data-k="consent.play"></span></label>
      <p class="note hidden" id="hiddenNote" data-k="add.share.hidden" style="margin:-4px 0 6px 36px"></p>
      <label class="check"><input type="checkbox" id="cArchive"><span data-k="consent.archive"></span></label>
      <label class="check"><input type="checkbox" id="cML"><span data-k="consent.ml"></span></label>
    </div>
    <p class="note" style="text-align:center"><a href="recorder.html" id="whoNote"></a></p>

    <div class="stack" id="authOut">
      <p class="note" style="text-align:center" data-k="add.share.signin"></p>
      <!-- Google, a phone number (the code is typed right here, so it works
           inside WhatsApp's own browser), email + password, or an email link:
           built by afd-signin.js, the same on every page. -->
      <div id="signinHost"></div>
    </div>

    <div class="stack hidden" id="authIn">
      <div class="who"><span id="whoAmI"></span><button class="linkbtn" id="notYou" type="button"></button></div>
      <button class="btn" id="shareBtn" type="button" data-k="add.share.go"></button>
    </div>
    <p class="err" id="shareErr" role="status" aria-live="polite"></p>
    <!-- no signal: keep the word and carry on; it goes on its own later -->
    <button class="btn secondary hidden" id="parkBtn" type="button" data-k="add.queue.keep"></button>
    <button class="btn ghost" id="shareBack" type="button" data-k="add.back"></button>
  </section>

  <!-- ============ DONE ============ -->
  <section id="done" hidden>
    <div class="big-thanks">🎉</div>
    <div class="face"><div class="pic" id="donePic"></div></div>
    <div class="titlerow"><h2 data-k="add.done.title"></h2><button class="hear" type="button" hidden aria-label="Hear it" title="Hear it"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg></button></div>

<script type="module">
/* ===============================================================
   Add a word — say it, show it, share it.

   The simple way in for the community (this is the page the WhatsApp link
   opens). One word at a time, three steps:
     1. SAY IT   — hold the button, say the word twice (the corpus protocol).
     2. SHOW IT  — optional: a photo, an emoji, a spoken meaning, or the word
                   in Arabic, so other people can tell what it means.
     3. SHARE IT — the three permissions, then sign in ONCE and it goes up.

   Nothing needs an account until step 3: the take, photo and choices are a
   draft kept in this phone's IndexedDB, so a sign-in popup, a closed tab or no
   signal loses nothing. Sharing is resumable — each piece that lands is noted
   in the draft, so a retry carries on instead of starting over.

   What it writes is exactly what the full recorder writes: the recording doc,
   speaker card and Storage audio all go through afd-upload.js. It always
   records the signed-in person's OWN voice (viaAgent false); recording someone
   else, speaker details and spoken consent stay in recorder.html.
================================================================*/
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp,
         collection, collectionGroup, query, where, limit, getDocs, addDoc, Timestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getMetadata, getDownloadURL }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
import { uploadClip, instanceLang } from "./afd-upload.js?v=b1020a";
import { startAppCheck, appCheckHeaders } from "./afd-appcheck.js?v=b1020a";
import { initCard, withdrawSpeaker, shareEntry, shareFlow, voiceFile, voiceFace, listPlayable } from "./afd-card.js?v=b1020a";
import { mountSignIn, finishEmailLink, signInSheet } from "./afd-signin.js?v=b1020a";

const firebaseConfig = window.AFDInstance.firebase;   // afd-instance.js
const app   = initializeApp(firebaseConfig);
startAppCheck(app);              // App Check (10-19)
const auth  = getAuth(app);
const db    = getFirestore(app);
const store = getStorage(app);
// Storage retries an upload for up to 10 minutes by default; on a dead signal
// that was a 10-minute spinner. Two minutes, then the word is kept for later.
try{ store.maxUploadRetryTime = 120000; store.maxOperationRetryTime = 120000; }catch(_){}
// field error log — AFDCore.report() writes here (afd_client_errors: create-only,
// stewards read, deleted 30 days on by TTL; scripts/client-errors.mjs lists them)
AFDCore.errorSink(rec => addDoc(collection(db, "afd_client_errors"),
  Object.assign({}, rec, { at: serverTimestamp(), expireAt: Timestamp.fromMillis(Date.now() + 30*864e5) })));
// usage counts — AFDCore.track() writes here (afd_events: create-only, no uid,
// stewards read, deleted 90 days on by TTL; the nightly digest keeps day totals)
AFDCore.eventSink(rec => addDoc(collection(db, "afd_events"),
  Object.assign({}, rec, { at: serverTimestamp(), expireAt: Timestamp.fromMillis(Date.now() + 90*864e5) })));
initCard({ db, store, user:()=>{ const u = auth.currentUser; return (u && !u.isAnonymous) ? u : null; },
           mode:()=>"auto", banner:(m)=>console.warn("[AFD add]", m) });

const $ = id => document.getElementById(id);
const C = window.AFDCore;
/* Display tier, shared with every page (AFDCore): auto = Arabic + English,
   script = Arabic, sound = the non-reader view. Labels here are always built
   Arabic + English (bi()); the tier just shows or hides the English line, so
   switching needs no repaint. Sound falls back to Arabic until spoken prompts
   cover this page, as AFDCore.t() does elsewhere. */
let MODE = C.getDisplayMode("sound");      // same default as the dictionary
const SKIN_ICON = {
  auto:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>`,
  sound: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 9v6M8 5v14M12 8v8M16 4v16M20 10v4"/></svg>`,
  script:`<span class="lbl">أ</span>`,
};
function applyMode(){
  document.body.setAttribute("data-tier", MODE);
  $("skin").innerHTML = SKIN_ICON[MODE] || SKIN_ICON.auto;
  // the caption names the mode you're in (disp.auto / disp.script / disp.sound)
  const cap = C.STRINGS["disp." + MODE]; if(cap) $("skin").setAttribute("data-cap", cap.ar);
}
applyMode();
$("skin").addEventListener("click", ()=>{
  MODE = C.DISP_MODES[(C.DISP_MODES.indexOf(MODE)+1) % C.DISP_MODES.length];

});
C.attachQuietToggle($("skin"));               // long-press = quiet, as on the dictionary

/* ---------------- strings ---------------- */
function fill(t, vars){ let o=String(t); for(const k in (vars||{})) o=o.split("{"+k+"}").join(vars[k]); return o; }
function esc(t){ return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function bi(key, vars){
  const x = C.STRINGS[key] || { en:key, ar:key };
  return '<span class="bi-ar" dir="rtl">'+esc(fill(x.ar, vars))+'</span><small class="sub">'+esc(fill(x.en, vars))+'</small>';
}
function plain(key, vars){
  const x = C.STRINGS[key] || { en:key, ar:key };
  return fill(MODE==="auto" ? x.en+" · "+x.ar : x.ar, vars);
}
function paintStrings(root){ (root||document).querySelectorAll("[data-k]").forEach(el=>{ el.innerHTML = bi(el.dataset.k); }); }
paintStrings();
// Build stamp: the ?v= that sync-stamp.sh writes on every publish, read back off
// this page's own afd-core.js tag, so it can never disagree with what's loaded.
try{
  const v = new URL(document.querySelector('script[src*="afd-core.js"]').src).searchParams.get("v");
  if(v) $("buildStamp").textContent = "build " + v;
}catch(_){}
$("whoNote").innerHTML = bi("add.share.who");
$("notYou").innerHTML = bi("add.share.notyou");
$("draftText").innerHTML = bi("add.draft");
$("draftDiscard").innerHTML = bi("add.draft.discard");

/* ---------------- the draft (IndexedDB) ----------------
   One word in progress. Blobs live here too, so a reload — or WhatsApp's
   browser being closed mid-sign-in — comes back to the same word. Every
   access is guarded: with storage blocked the page still works, in memory. */
const DBN = "afd-add", ST = "draft";
function idb(){
  return new Promise((res, rej)=>{
    const r = indexedDB.open(DBN, 1);
    r.onupgradeneeded = ()=> r.result.createObjectStore(ST, { keyPath:"key" });
    r.onsuccess = ()=> res(r.result);
    r.onerror = ()=> rej(r.error);
  });
}
async function idbDo(mode, fn){
  const d = await idb();
  return new Promise((res, rej)=>{
    const t = d.transaction(ST, mode), s = t.objectStore(ST);
    const r = fn(s);
    t.oncomplete = ()=> res(r && r.result);
    t.onerror = ()=> rej(t.error);
  });
}
function freshDraft(){
  return {
    key:"current", entryId:C.mintEntryId(), createdAt:Date.now(),
    word:null, meaning:null, pic:"", photo:null, glossAr:"", spelling:"",
    consent:{ play:true, archive:false, ml:false, touched:false },   // listening in the app is on by default (10-14); archive + ML stay opt-in
    up:{ uid:null, speakerId:null, photo:false, photoPath:"", entry:false,
         wordId:null, word:false, meaningId:null, meaning:false, spelling:false }
  };
}
let draft = freshDraft();
async function saveDraft(d){ try{ const x = d || draft; await idbDo("readwrite", s=>s.put(x)); }catch(e){ console.warn("[AFD add] save draft", e); } }
async function loadDraft(){ try{ return await idbDo("readonly", s=>s.get("current")) || null; }catch(_){ return null; } }
async function clearDraft(){ try{ await idbDo("readwrite", s=>s.delete("current")); }catch(_){} }

/* ---------------- spoken prompts (Hakli, recorded in prompts/) ----------------
   Each step speaks its recorded prompt when it appears (add.say / add.show /
   add.share / add.done — listed in prompts/index.html), and its 🔈 replays it.
   Nothing plays, and no 🔈 shows, until that prompt has been recorded, so the
   page works as text in the meantime. Arriving at a step is NARRATION, which
   quiet mode holds back; a tapped 🔈 or tile label was ASKED for, and plays. */
const STEP_PROMPT = { say:"add.say", show:"add.show", share:"add.share", done:"add.done" };
let _promptPaths = null;
function promptPaths(){
  if(!_promptPaths) _promptPaths = getDocs(collection(db, "afd_ui_prompts")).then(snap=>{
    const m = {};
    snap.forEach(d=>{ const x = d.data()||{}; if(x.status==="recorded") m[d.id] = x.storagePath || ("afd_ui/"+d.id+".webm"); });
    return m;
  }).catch(()=>({}));
  return _promptPaths;
}
const _promptUrls = {};
async function promptUrl(key){
  if(key in _promptUrls) return _promptUrls[key];
  const p = (await promptPaths())[key];
  _promptUrls[key] = p ? await getDownloadURL(ref(store, p)).catch(()=>null) : null;
  return _promptUrls[key];
}
async function speakStep(which){
  const key = STEP_PROMPT[which]; if(!key) return;
  const url = await promptUrl(key);
  const btn = document.querySelector("#"+which+" .hear");
  if(btn){ btn.hidden = !url; btn.onclick = ()=> url && C.playUI(url, "asked"); }
  if(url && !$(which).hidden) C.playUI(url, "narration");
}
// A tile's spoken label, for people who don't read — only in the wordless tier,
// where the label text isn't the point. Readers just get the tile.
async function sayLabel(key){
  if(MODE !== "sound") return;
  const url = await promptUrl(key);
  if(url) C.playUI(url, "asked");
}

/* ---------------- screens ---------------- */
const SCREENS = ["say","show","share","done"];
/* The steps are steps in the browser history too (AFDCore.stepHistory), so the
   phone's Back button walks share → show → say and only then leaves the page —
   it used to leave from any step. Forward (Next / Skip) pushes a step; the
   page's own Back buttons take it off again; "done" takes them all off, so Back
   from the thank-you leaves instead of reopening a word that is already shared.
     show(step,{auto:true})    the page moved by itself (a draft resumed at share)
     show(step,{fromPop:true}) Back / Forward landed here */
const STEP_ORDER = { say:0, show:1, share:2, done:3 };
var addSteps = null, addBase = "say";     // addBase: the screen on the page's own history entry
function currentScreen(){ return SCREENS.find(s=> !$(s).hidden) || "say"; }
function show(which, opt){
  const from = currentScreen();
  // usage counts: how far people get (say → show → share); done is counted in share()
  if(which !== from && which !== "done" && !(opt && opt.fromPop)) C.track("add", which);
  SCREENS.forEach(s=> $(s).hidden = s!==which);
  if(addSteps){
    if(!(opt && (opt.fromPop || opt.auto))){
      if(which==="done" || which==="say") addSteps.back(addSteps.depth());           // finished, or starting over
      else if(STEP_ORDER[which] > STEP_ORDER[from]) addSteps.push(which);
      else if(STEP_ORDER[which] < STEP_ORDER[from])
        addSteps.back(addSteps.path().filter(x=>STEP_ORDER[x] > STEP_ORDER[which]).length);
    }
    if(addSteps.depth()===0) addBase = which;
  }
  const order = ["say","show","share"], at = order.indexOf(which);
  document.querySelectorAll(".steps li").forEach(li=>{
    const i = order.indexOf(li.dataset.step);
    li.classList.toggle("on", i===at);
    li.classList.toggle("done", which==="done" || (at>=0 && i<at));
  });
  if(which==="show") paintShow();
  if(which==="share"){ paintShare(); paintPark(); }
  if(which==="done") paintFace($("donePic"));
  speakStep(which);
  window.scrollTo(0,0);
}

addSteps = C.stepHistory((step)=>{
  let to = step || addBase;
  // a step left over from a word that has since been shared (stay on the
  // thank-you) or discarded (nothing to show or share yet)
  if(addBase==="done") to = "done";
  else if((to==="show" || to==="share") && !(draft && draft.word)) to = "say";
  show(to, {fromPop:true});
});

/* ---------------- playback ---------------- */
let player = null, playerUrl = null;
function play(blob){
  if(!blob) return;
  try{ if(player) player.pause(); }catch(_){}
  if(playerUrl) URL.revokeObjectURL(playerUrl);
  playerUrl = URL.createObjectURL(blob);
  player = new Audio(playerUrl);
  player.play().catch(()=>{});
}
["sayPlay","showPlay","sharePlay"].forEach(id=> $(id).onclick = ()=> play(draft.word && draft.word.blob));

/* ---------------- the word's face: photo > emoji > identicon ---------------- */
let photoUrl = null;
function paintFace(el){
  if(draft.photo){
    if(!photoUrl) photoUrl = URL.createObjectURL(draft.photo);
    el.innerHTML = '<img alt="" src="'+photoUrl+'">';
  }else if(draft.pic){
    el.textContent = draft.pic;
  }else{
    el.innerHTML = C.identicon(draft.entryId);
  }
}

/* ---------------- microphone (shared by the word and the meaning) ----------------
   Same recording protocol as the recorder (AFDCore.openStream: processing off,
   48 kHz mono) and the same gate the rules enforce: 44.1 kHz or better, and no
   Bluetooth headset (telephone quality). */
let mic = null, actx = null;
async function ensureMic(){
  if(mic && mic.stream.getAudioTracks().some(t=>t.readyState==="live")) return mic;
  const r = await C.openStream();
  let sr = r.sampleRate;
  if(!sr){ try{ const a = new (window.AudioContext||window.webkitAudioContext)(); sr = a.sampleRate; a.close(); }catch(_){} }
  if(r.bluetooth || sr < 44100){
    r.stream.getTracks().forEach(t=>t.stop());
    throw Object.assign(new Error("mic quality"), { code: r.bluetooth ? "bt" : "low", sr });
  }
  mic = { stream:r.stream, sampleRate:sr, track:r.track };
  return mic;
}
function micErrHTML(e){
  if(e && e.code==="bt")  return "<b>"+bi("mic.bt.title")+"</b>"+bi("mic.bt.body");
  if(e && e.code==="low") return "<b>"+bi("mic.low.title")+"</b>"+bi("mic.low.body",
      { sr:Number(e.sr).toLocaleString("en-US"), srAr:Number(e.sr).toLocaleString("ar-EG") });
  return "<b>"+bi("mic.err.title")+"</b>"+bi("mic.err.body");
}

/* ---------------- analysis (ported from recorder.html analyse/isClipped) ---------------- */
const CLIP_LEVEL=0.98, CLIP_MIN_SAMPLES=48, CLIP_MIN_FRACTION=0.002;
const isClipped = q => (q.clipped||0) >= Math.max(CLIP_MIN_SAMPLES, CLIP_MIN_FRACTION*(q.samples||0));
function downsampleEnvelope(frames, n){
  if(!frames.length) return [];
  const mx = Math.max.apply(null, frames) || 1e-9, out = [];
  if(frames.length <= n){ for(const f of frames) out.push(+(f/mx).toFixed(2)); return out; }
  const bin = frames.length / n;
  for(let i=0;i<n;i++){
    let peak=0; const s=Math.floor(i*bin), e=Math.floor((i+1)*bin);
    for(let j=s;j<e;j++) if(frames[j]>peak) peak=frames[j];
    out.push(+(peak/mx).toFixed(2));
  }
  return out;
}
async function analyse(blob, sampleRate){
  const out = { sampleRate, durationMs:0, peak:0, clipped:0, samples:0, speechRatio:0, bursts:0, burstBalance:null, envelope:[] };
  try{
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const buf = await ac.decodeAudioData(await blob.arrayBuffer());
    const ch = buf.getChannelData(0);
    out.durationMs = Math.round(buf.duration*1000);
    const fr = Math.floor(buf.sampleRate*0.02), frames = [];
    let peak=0, clipped=0;
    for(let i=0;i<ch.length;i+=fr){
      let e=0, n=0;
      for(let j=i;j<Math.min(i+fr,ch.length);j++){ const a=Math.abs(ch[j]); e+=a*a; if(a>peak)peak=a; if(a>=CLIP_LEVEL)clipped++; n++; }
      frames.push(Math.sqrt(e/Math.max(n,1)));
    }
    out.peak=peak; out.clipped=clipped; out.samples=ch.length;
    out.envelope = downsampleEnvelope(frames, 48);
    const mx = Math.max.apply(null, frames) || 1e-9, thr = mx*0.12;
    const voiced = frames.map(f=>f>thr);
    out.speechRatio = voiced.filter(Boolean).length / Math.max(voiced.length,1);
    const runs=[]; let run=0, gap=0;
    voiced.forEach(v=>{
      if(v){ if(gap>0&&gap<6&&runs.length){ run+=gap; } gap=0; run++; }
      else { gap++; if(run&&gap>=6){ runs.push(run); run=0; } }
    });
    if(run) runs.push(run);
    const real = runs.filter(r=>r>=5);
    out.bursts = real.length;
    if(real.length>=2){ const a=real[0], b=real[1]; out.burstBalance = Math.abs(a-b)/Math.max(a,b); }
    ac.close();
  }catch(e){ console.warn("[AFD add] analyse", e); }
  return out;
}
// The same qc block the recorder stores on a take.
function qcOf(q, type){
  return {
    peak:+q.peak.toFixed(3), clipped:q.clipped||0, speechRatio:+q.speechRatio.toFixed(3),
    bursts:q.bursts, burstBalance:q.burstBalance===null?null:+q.burstBalance.toFixed(3),
    passed: type==="word"
      ? (q.sampleRate>=44100 && q.bursts>=2 && !isClipped(q))
      : (q.sampleRate>=44100 && !isClipped(q) && q.speechRatio>=0.1)
  };
}
// Coach, don't block: only silence and a broken-up take ask for another go.
function verdict(q, type){
  if(q.peak < 0.02 || q.speechRatio < 0.03) return { cls:"bad",  key:"add.say.silent", keep:false };
  if(isClipped(q))                          return { cls:"bad",  key:"add.say.loud",   keep:false };
  if(type==="word" && q.bursts < 2)         return { cls:"warn", key:"qc.saytwice",    keep:true };
  return { cls:"ok", key:"qc.good", keep:true };
}

/* ---------------- hold-to-record ----------------
   Press and hold, like a WhatsApp voice note; let go to stop. The first press
   may only open the microphone (the permission prompt swallows the hold) — then
   the label says to hold again. */
function holdRecorder({ btn, label, maxMs, type, onTake, onError }){
  let pressed=false, rec=null, chunks=[], t0=0, tick=null, raf=null, src=null, an=null, busy=false;
  const idle = ()=>{ label.innerHTML = bi("record.hold"); };
  idle();
  function meter(){
    if(!an) return;
    const a = new Uint8Array(an.fftSize); an.getByteTimeDomainData(a);
    let m=0; for(const v of a){ const d=Math.abs(v-128)/128; if(d>m) m=d; }
    btn.style.setProperty("--lvl", Math.min(1, m*1.6).toFixed(3));
    raf = requestAnimationFrame(meter);
  }
  function start(m){
    let mime="";
    ["audio/webm;codecs=opus","audio/webm","audio/mp4"].forEach(x=>{ if(!mime && window.MediaRecorder && MediaRecorder.isTypeSupported(x)) mime=x; });
    try{ rec = mime ? new MediaRecorder(m.stream, { mimeType:mime }) : new MediaRecorder(m.stream); }
    catch(e){ onError(e); return; }
    chunks=[]; rec.ondataavailable = e=>{ if(e.data.size) chunks.push(e.data); };
    rec.onstop = finish;
    rec.start(); t0 = Date.now();
    btn.classList.add("rec");
    label.innerHTML = bi("record.holding")+'<span class="timer" id="'+btn.id+'T">0.0s</span>';
    tick = setInterval(()=>{
      const ms = Date.now()-t0, el = document.getElementById(btn.id+"T");
      if(el) el.textContent = (ms/1000).toFixed(1)+"s";
      if(ms >= maxMs) stop();
    }, 100);
    try{
      if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      if(actx.state!=="running") actx.resume();
      src = actx.createMediaStreamSource(m.stream); an = actx.createAnalyser(); an.fftSize = 1024;
      src.connect(an); meter();
    }catch(_){}
  }
  function stop(){
    if(!rec || rec.state==="inactive") return;
    clearInterval(tick); tick=null;
    if(raf) cancelAnimationFrame(raf); raf=null;
    try{ src && src.disconnect(); }catch(_){} src=null; an=null;
    btn.style.setProperty("--lvl", 0);
    btn.classList.remove("rec");
    try{ rec.stop(); }catch(_){}
  }
  async function finish(){
    const ms = Date.now()-t0, mime = rec.mimeType || "audio/webm";
    rec = null;
    if(ms < 400){ label.innerHTML = bi("add.say.short"); return; }
    busy = true; btn.disabled = true; label.innerHTML = C.dotsHTML() + bi("status.checking");
    const blob = new Blob(chunks, { type:mime });
    const q = await analyse(blob, mic ? mic.sampleRate : 0);
    busy = false; btn.disabled = false; idle();
    onTake({ blob, mime, q, durationMs:q.durationMs || ms, sampleRate:q.sampleRate, recordedAt:new Date().toISOString() });
  }
  btn.addEventListener("pointerdown", async e=>{
    if(busy || rec) return;
    e.preventDefault();
    pressed = true;
    try{ btn.setPointerCapture(e.pointerId); }catch(_){}
    let m;
    try{ m = await ensureMic(); }catch(err){ pressed=false; onError(err); return; }
    if(!pressed){ label.innerHTML = bi("record.hold"); return; }   // the permission prompt ate this press
    start(m);
  });
  const release = ()=>{ pressed=false; if(rec) stop(); };
  btn.addEventListener("pointerup", release);
  btn.addEventListener("pointercancel", release);
  btn.addEventListener("contextmenu", e=>e.preventDefault());
  // keyboard: hold Space / Enter
  btn.addEventListener("keydown", async e=>{
    if((e.key===" "||e.key==="Enter") && !e.repeat && !rec && !busy){
      e.preventDefault(); pressed=true;
      try{ const m = await ensureMic(); if(pressed) start(m); }catch(err){ pressed=false; onError(err); }
    }
  });
  btn.addEventListener("keyup", e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); release(); } });
}

/* ---------------- 1. SAY IT ---------------- */
function setMsg(el, cls, html){ el.className = "msg "+cls; el.innerHTML = html; el.classList.remove("hidden"); }
holdRecorder({
  btn:$("sayBtn"), label:$("sayLabel"), maxMs:8000, type:"word",
  onError: e=> setMsg($("sayMsg"), "bad", micErrHTML(e)),
  onTake: async take=>{
    const v = verdict(take.q, "word");
    setMsg($("sayMsg"), v.cls, bi(v.key));
    if(!v.keep){ $("sayReview").classList.add("hidden"); return; }
    draft.word = { blob:take.blob, mime:take.mime, durationMs:take.durationMs, sampleRate:take.sampleRate,
                   qc:qcOf(take.q,"word"), envelope:take.q.envelope, recordedAt:take.recordedAt };
    draft.up.word = false; draft.up.wordId = null;   // a new take is a new recording
    delete draft.up.dupAsked; delete draft.joinEntryId; delete draft.joinMeta;   // a new take: ask again if it matches
    await saveDraft();
    startDupCheck(take.blob);                       // is this word already here? (quietly, in the background)
    $("sayReview").classList.remove("hidden");
    $("sayNext").className = "btn" + (v.cls==="ok" ? "" : " secondary");
    $("sayAgain").className = "btn" + (v.cls==="ok" ? " secondary" : "");
    play(take.blob);
  }
});

// One emoji (one grapheme), and it has to BE an emoji — the picture is for
// people who don't read, so letters don't count.
function firstEmoji(s){
  s = String(s||"").trim(); if(!s) return "";
  let g = s;
  try{ g = [...new Intl.Segmenter(undefined,{granularity:"grapheme"}).segment(s)][0].segment; }
  catch(_){ g = Array.from(s)[0]; }

}

// Centre-square, 512px JPEG. Drawing through a canvas also drops the camera's
// EXIF (GPS included) — the photo is public, its location shouldn't be.
function squareJpeg(file, size){
  return new Promise((res, rej)=>{
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = ()=>{
      const s = Math.min(img.width, img.height), c = document.createElement("canvas");
      c.width = c.height = size;
      c.getContext("2d").drawImage(img, (img.width-s)/2, (img.height-s)/2, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      c.toBlob(b=> b ? res(b) : rej(new Error("encode failed")), "image/jpeg", 0.85);
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src = url;
  });
}

/* The speaker this account records as ITSELF — one of its own-voice cards
   (viaAgent false; never one it keeps for someone else it records). A public
   card first, newest first; else a withdrawn one; never an erased one (that
   voice is gone for good). With none, a new code in the account's own
   namespace (spk_<uid6>_…, which the rules require). */
async function findSelfCard(uid){
  const snap = await getDocs(query(collection(db,"afd_speakers"),
    where("stewardUid","==",uid), where("viaAgent","==",false), limit(20)));
  const t = c => (c.updatedAt && c.updatedAt.toMillis) ? c.updatedAt.toMillis() : 0;
  const cards = snap.docs.map(d=>({ id:d.id, ...(d.data()||{}) })).filter(c=>c.consent!=="deleted");
  cards.sort((a,b)=> ((b.consent==="public") - (a.consent==="public")) || (t(b) - t(a)));
  return cards[0] || null;
}
async function selfSpeaker(uid){
  const c = await findSelfCard(uid);
  if(c) return c.id;
  const base = "spk_"+uid.slice(0,6)+"_";
  // _01 may already be a card this account keeps for someone else, or erased.
  return (await getDoc(doc(db,"afd_speakers",base+"01"))).exists() ? base+Date.now().toString(36) : base+"01";
}

// A returning contributor already chose their permissions once (in the
// recorder or here). Start from those rather than blank boxes — sharing writes
// the speaker card, so a blank box here would quietly change their earlier choice.
// Also say so when their voice is currently hidden: ticking "let others listen"
// then means sharing it again, and they should know that before they tap.
let selfCard = null;
async function prefillConsent(){
  const u = realUser();
  $("hiddenNote").classList.add("hidden");
  if(!u) return;
  try{
    selfCard = await findSelfCard(u.uid);
    const c = selfCard;
    $("hiddenNote").classList.toggle("hidden", !(c && c.consent==="withdrawn"));
    if(!c || !c.grant || draft.consent.touched) return;
    draft.consent = { play: c.grant.publicPlayback===true && c.consent==="public",
                      archive: c.grant.archivalDeposit===true, ml: c.grant.mlTraining===true, touched:false };
    $("cPlay").checked = draft.consent.play;
    $("cArchive").checked = draft.consent.archive;
    $("cML").checked = draft.consent.ml;
  }catch(e){ console.warn("[AFD add] prefill", e); }
}

function speakerSnapshot(d, speakerId){

      publicPlayback:  !!d.consent.play,
      attribution:     "pseudonymous",
      grantedAt:       new Date().toISOString()
    }

}
function takeRec(d, t, type, recordingId, speakerId){
  return {
    recordingId, entryId:d.entryId, gloss:"", domain:"",
    speakerId, phase:type, type, promptTier:"self", repetitionIndex:"both",

    qc:t.qc, envelope:t.envelope||[], recordedAt:t.recordedAt, blob:t.blob
  };

const publicUrl = path =>
  "https://firebasestorage.googleapis.com/v0/b/"+firebaseConfig.storageBucket+"/o/"+encodeURIComponent(path)+"?alt=media";

/* ---- is this word already in the dictionary? (10-17) -------------------------
   Supports, never blocks. The take just recorded goes to the matcher in the
   background while they choose a picture; if a card sounds close, Share first
   asks "Is it one of these?" — each with its picture and a ▶ — and "This word"
   puts their voice (and their meaning, and Hakli spelling) on that card instead
   of making a second one. "No — it's a new word" carries on as before.
   A second, text net, only when they typed something: the Arabic gloss or the
   Hakli spelling, compared the same way the dictionary's typed search does
   (spellingKey: no diacritics, alif/ya/ta-marbuta forms folded).
   Never waits on a sleeping matcher (a cold start is a minute): if it hasn't
   answered by Share, the audio half is skipped. Strict on purpose — as close as
   the dictionary's own "Here it is" — because a wrong card is worse than a
   second one, which a steward can still join later. */
const DUP_MAX = 0.15;
let dupCheck = null;            // { p, done, value } for the word take on screen
function startDupCheck(blob){
  dupCheck = null;
  const url = window.AFDInstance && window.AFDInstance.embedUrl;
  if(!url || !blob || navigator.onLine === false) return;
  const ctl = new AbortController(), timer = setTimeout(()=> ctl.abort(), 90000);
  const fd = new FormData(); fd.append("file", blob, "add.webm");
  const p = appCheckHeaders().then(headers => fetch(url + "/search?top_k=3", { method:"POST", body:fd, signal:ctl.signal, headers }))
    .then(r => r.ok ? r.json() : { results:[] })
    .then(j => (j.results || []).filter(r => r && r.entryId && typeof r.distance === "number" && r.distance <= DUP_MAX))
    .catch(()=> [])
    .finally(()=> clearTimeout(timer));
  const me = { p, done:false, value:[] };
  p.then(v => { me.done = true; me.value = v; });
  dupCheck = me;
}
async function textMatches(d){
  const ar = C.spellingKey(d.glossAr || ""), sp = C.spellingKey(d.spelling || "");
  if(!ar && !sp) return [];
  const keys = new Set([ar, sp].filter(Boolean)), out = new Set();
  (window.AFDWords || []).forEach(w => { const k = C.spellingKey(w.ar || ""); if(k && keys.has(k)) out.add(C.entryIdFor(w.id)); });
  try{
    (await getDocs(collection(db, "afd_entries"))).forEach(sn => {
      const x = sn.data() || {}; if(x.removedAt || x.hiddenAt || x.heldAt || sn.id === d.entryId) return;
      const k = C.spellingKey(x.glossAr || (x.glosses && x.glosses.ar) || "");
      if(k && keys.has(k)) out.add(sn.id);
    });
  }catch(_){}
  if(sp){
    try{
      (await getDocs(collectionGroup(db, "spellings"))).forEach(sn => {
        const x = sn.data() || {}, eid = sn.ref.parent.parent && sn.ref.parent.parent.id;
        if(!x.hiddenAt && eid && eid !== d.entryId && x.searchKey === sp) out.add(eid);
      });
    }catch(_){}
  }
  return [...out];
}
async function askDuplicate(d){
  // the matcher's answer if it's in (a short grace if it's nearly there), never a wait
  let heard = [];
  if(dupCheck){ await Promise.race([dupCheck.p, new Promise(r => setTimeout(r, 1500))]); if(dupCheck.done) heard = dupCheck.value; }
  const ids = [...new Set([...heard.map(r => r.entryId), ...(await textMatches(d))])].filter(id => id !== d.entryId).slice(0, 3);
  if(!ids.length) return null;
  const metas = await Promise.all(ids.map(async id => {
    let m = {};
    try{ const sn = await getDoc(doc(db, "afd_entries", id)); if(sn.exists()) m = sn.data() || {}; }catch(_){}
    if(m.removedAt || m.hiddenAt || m.heldAt) return null;
    const w = (window.AFDWords || []).find(x => C.entryIdFor(x.id) === id);
    if(w){ m = { pic: m.pic || w.pic, gloss: m.gloss || w.en, glossAr: m.glossAr || w.ar, ...m }; }
    return { id, m };
  }));
  const rows = metas.filter(Boolean);
  if(!rows.length) return null;
  C.track("add", "dup.asked", { n: rows.length });
  const pick = await C.ask({ mode: MODE, titleKey:"add.dup.title", subKey:"add.dup.sub", noKey:"add.dup.new", noIcon:"none",
    audio: promptUrl("add.dup"),
    choices: rows.map(({ id, m }) => ({
      value: id,
      face: m.image ? `<img src="${C.escHtml(m.image)}" alt="">` : m.pic ? esc(m.pic) : C.identicon(id),
      label: MODE === "sound" ? "" :
        (m.glossAr ? `<span dir="rtl" style="display:block">${esc(m.glossAr)}</span>` : "") +
        (MODE === "auto" && m.gloss ? `<small class="sub">${esc(m.gloss)}</small>` : ""),
      play: async ()=> { const recs = await listPlayable(id); const r = recs.find(x => (x.type || "word") === "word") || recs[0]; return r ? r.url : null; }
    }))
  });
  C.track("add", pick ? "dup.join" : "dup.new");
  if(!pick) return null;
  const chosen = rows.find(r => r.id === pick);
  return { entryId: pick, meta: { pic: chosen.m.pic || "", glossAr: chosen.m.glossAr || "" } };
}

/* ---- sending one word (10-17) -----------------------------------------------
   The upload itself, for any saved word: the one on screen (share()) or one
   parked in the queue while there was no signal (sendQueued()). Each piece is
   write-once and its progress is saved on the word (d.up) as it lands, so a
   send cut off halfway carries on where it stopped next time.
   interactive: someone is looking. Only then can a hidden voice be asked about
   re-opening; a word sent in the background keeps a withdrawn voice hidden —
   a withdrawal reverses only on a clear yes.
   Returns { public }; throws with err.step naming where it stopped. */
async function sendWord(d, u, interactive){
  const at = { step:"start" };
  try{
    const uid = u.uid, up = d.up;
    if(up.uid !== uid){
      // A different account than a half-finished earlier attempt: whatever
      // hasn't landed yet is written under (and owned by) this one.
      if(!up.entry){ up.photo = false; up.photoPath = ""; }
      if(!up.word) up.wordId = null;
      if(!up.meaning) up.meaningId = null;
      up.speakerId = null; up.uid = uid;
      delete up.reopen; delete up.public; delete up.reopened;   // that account's card, that account's answer
    }
    // "This word" on the duplicate question: the voice joins that card instead.
    // No new card is made, so their picture / emoji / Arabic gloss aren't used
    // (only a card's maker sets those); the Hakli spelling still goes on it.
    if(d.joinEntryId && !up.entry){
      d.entryId = d.joinEntryId; up.entry = true; up.joined = true;
      d.photo = null; up.photo = false; up.photoPath = "";
      await saveDraft(d);
    }
    at.step = "speaker";
    if(!up.speakerId) up.speakerId = await selfSpeaker(uid);
    // Withdrawal is the speaker's own act and wins: new takes under a withdrawn
    // card upload hidden. If they ticked "let others listen", ask — the same
    // deliberate "share again" the recorder offers — rather than either
    // overriding the withdrawal or silently ignoring the tick.
    const cardSn = await getDoc(doc(db, "afd_speakers", up.speakerId));
    const cardState = cardSn.exists() ? ((cardSn.data()||{}).consent || "public") : null;
    if(d.consent.play && cardState==="withdrawn" && up.reopen===undefined && interactive){
      // Asked in the page, with their own voice's face and the spoken question
      // (AFDCore.ask) — never the browser's text-only OK/Cancel box. Closing it
      // is "keep hidden": a withdrawal only reverses on a clear yes.
      up.reopen = await C.ask({ mode: MODE, face: await voiceFace(uid, up.speakerId),
        titleKey:"add.share.reopen", subKey:"add.reopen.sub",
        yesKey:"add.reopen.yes", noKey:"add.reopen.no", audio: promptUrl("add.reopen") });
    }
    up.public = !!d.consent.play && (cardState!=="withdrawn" || up.reopen===true);
    await saveDraft(d);

    // photo → entry → word → meaning. Each is write-once on the server, so a
    // retry that finds its earlier attempt already landed just carries on.
    if(d.photo && !up.entry && !up.photo){
      at.step = "photo";
      const path = "afd_pics/"+uid+"/"+d.entryId+".jpg";
      // write-once, so the phone may keep it; private so a photo a steward takes down isn't held in a shared cache
      try{ await uploadBytes(ref(store, path), d.photo, { contentType:"image/jpeg", cacheControl:"private, max-age=31536000, immutable" }); }
      catch(e){
        let landed=false; try{ const m = await getMetadata(ref(store, path)); landed = !!m && m.size===d.photo.size; }catch(_){}
        if(!landed) throw e;
      }
      up.photo = true; up.photoPath = path; await saveDraft(d);
    }
    if(!up.entry){
      at.step = "entry";
      const eref = doc(db, "afd_entries", d.entryId);
      // lang + an empty concepts list on every new word card, so the export
      // manifest and later concept linking never need a second migration.
      const data = { source:"user", createdBy:uid, createdAt:serverTimestamp(),
                     lang: instanceLang(), concepts: [] };
      if(d.pic) data.pic = d.pic;
      if(up.photo && up.photoPath) data.image = publicUrl(up.photoPath);
      const ar = d.glossAr.trim().slice(0,80);
      // glosses is the language-keyed form; glossAr stays until every reader
      // has moved over to glosses.
      if(ar){ data.glossAr = ar; data.glosses = { ar }; }
      try{ await setDoc(eref, data); }
      catch(e){
        let mine=false; try{ const sn = await getDoc(eref); mine = sn.exists() && (sn.data()||{}).createdBy===uid; }catch(_){}
        if(!mine) throw e;
      }
      up.entry = true; await saveDraft(d);
    }
    // the word as its maker wrote it: their own spelling on the new card, one
    // doc per writer (the id is their uid), so a retry just writes it again
    const spelling = C.spellingText(d.spelling||"").slice(0,60);
    if(spelling && window.AFDInstance && window.AFDInstance.spelling && !up.spelling){
      at.step = "spelling";
      await setDoc(doc(db, "afd_entries", d.entryId, "spellings", uid),
        { text: spelling, searchKey: C.spellingKey(spelling).slice(0,60), lang: C.spellingLang(),
          by: uid, at: serverTimestamp() });
      up.spelling = true; await saveDraft(d);
    }
    const ctx = { db, store, uid }, spk = speakerSnapshot(d, up.speakerId);
    const recId = ()=> "rec_"+d.entryId.replace(/^ent_/,"")+"_"+uid.slice(0,6)+"_"+up.speakerId+"_"+Date.now();
    if(d.word && !up.word){
      at.step = "word";
      if(!up.wordId){ up.wordId = recId(); await saveDraft(d); }
      await uploadClip(ctx, takeRec(d, d.word, "word", up.wordId, up.speakerId), spk);
      up.word = true; await saveDraft(d);
    }
    if(d.meaning && !up.meaning){
      at.step = "meaning";
      if(!up.meaningId){ up.meaningId = recId()+"_m"; await saveDraft(d); }
      await uploadClip(ctx, takeRec(d, d.meaning, "definition", up.meaningId, up.speakerId), spk);
      up.meaning = true; await saveDraft(d);
    }

    if(up.reopen===true && !up.reopened){
      at.step = "reshare";
      await withdrawSpeaker(uid, up.speakerId, "public");   // card first, then every take of theirs
      up.reopened = true; await saveDraft(d);
    }
    return { public: !!up.public };
  }catch(err){
    try{ err.step = at.step; }catch(_){}
    throw err;
  }
}

let sharing = false;
async function share(){
  const u = realUser();
  if(sharing || !u || !draft.word) return;
  sharing = true; wantShare = false;
  const btn = $("shareBtn"); btn.disabled = true; btn.innerHTML = C.dotsHTML() + bi("add.share.saving");
  $("shareErr").textContent = "";
  let step = "start";
  try{
    const up = draft.up;
    if(navigator.onLine === false){ const x = new Error("offline"); x.code = "offline"; throw x; }   // don't even try
    if(!up.entry && !up.photo && up.dupAsked !== true){
      step = "duplicate";
      const j = await askDuplicate(draft);
      up.dupAsked = true;
      if(j){ draft.joinEntryId = j.entryId; draft.joinMeta = j.meta; }
      await saveDraft();
    }
    await sendWord(draft, u, true);
    C.track("add", "done", { x: (up.joined ? "joined" : "new") + (up.public ? "" : ".private") });
    // Shared. The done screen still shows this word; the draft itself goes.
    // It says what actually happened — a hidden voice is told it's hidden.
    $("doneMsg").innerHTML = bi(up.joined ? (up.public ? "add.dup.done" : "add.done.private")
                                          : (up.public ? "add.done.public" : "add.done.private"));
    $("doneSee").href = "index.html#"+encodeURIComponent(draft.entryId);
    // Send this very word to family. Only once others can hear it: a hidden
    // word's link would show them nothing. Captured now — the draft goes below.
    const shareArgs = [draft.entryId, up.joined ? (draft.joinMeta || {}) : { pic: draft.pic, glossAr: draft.glossAr.trim() }, true];
    $("doneShare").hidden = !up.public;
    // their own voice, from the phone, ready before the tap (see voiceFile)
    let voiceReady = null;
    if(up.public && draft.word && draft.word.blob) voiceFile(draft.word.blob).then(f => { voiceReady = f; });
    $("doneShare").onclick = shareFlow(...shareArgs, MODE, ()=> voiceReady,
      (state)=>{ $("doneShare").innerHTML = bi(state==="link" ? "card.share.link" : "card.share"); });
    $("doneSee").hidden = false;
    show("done");
    await clearDraft();
    kickQueue(500);                               // anything parked earlier can go too
  }catch(e){
    if(e && e.step) step = e.step;
    console.warn("[AFD add] share failed at", step, e);
    // No signal: keep the word on the phone and let them carry on (10-17).
    // It is sent on its own when there's signal (sendQueued).
    if(isNetErr(e)){ await parkDraft(); return; }
    C.report("add.share." + step, e);             // field error log (afd-core)
    // Only blame the signal when the phone says it's offline. Anything else
    // (a refused write, a rules mismatch) gets the step and error code, so a
    // screenshot from the field is enough to tell what went wrong.
    if(navigator.onLine === false){
      $("shareErr").innerHTML = bi("add.share.err");
    }else{
      const code = (e && (e.code || e.name)) || "error";
      $("shareErr").innerHTML = bi("add.share.failed") +
        '<small style="display:block;opacity:.6;margin-top:6px;direction:ltr">' + esc(step + " · " + code) + '</small>';
    }
  }finally{
    sharing = false; btn.disabled = false; btn.innerHTML = bi("add.share.go");
  }
}
$("shareBtn").onclick = share;

/* ---- words kept on the phone while there's no signal (10-17) ----------------
   A share with no signal used to leave the person on the share screen with one
   word and nowhere to go. Now the word is parked in this browser's storage
   (the same store as the draft, key "q:<entryId>"), the page says so, and they
   can add another. Parked words are sent on their own — on load, when signal
   returns, when the page comes back into view, after a sign-in — retrying with
   a growing wait (3 s → 9 s → … 2 min) while some are left. A word that fails
   for another reason (a refused write) is logged and skipped, so it can't hold
   up the rest. Signed out, the note offers the sign-in. */
const QPRE = "q:";
const isNetErr = (e)=> navigator.onLine === false
  || /offline|unavailable|network|retry-limit|failed to fetch|deadline/i.test(String((e && (e.code || e.message)) || ""));
async function queuedWords(){
  try{ const all = await idbDo("readonly", st=> st.getAll()); return (all||[]).filter(x=> x && String(x.key).indexOf(QPRE)===0); }
  catch(_){ return []; }
}
async function parkDraft(){
  const d = Object.assign({}, draft, { key: QPRE + draft.entryId, parkedAt: Date.now() });
  C.track("add", "parked");
  await saveDraft(d);
  await clearDraft();
  // the thank-you screen, saying what happened instead: kept, not yet shared
  $("doneMsg").innerHTML = bi("add.queue.saved");
  $("doneSee").hidden = true; $("doneShare").hidden = true;
  show("done");
  paintQueue();
}
async function paintQueue(){
  const n = (await queuedWords()).length, b = $("queueNote");
  b.classList.toggle("hidden", !n);
  if(!n) return;
  const signedOut = !realUser();
  b.innerHTML = bi(signedOut ? "add.queue.signin" : "add.queue.n", { n });
  b.classList.toggle("tap", signedOut);
  b.onclick = signedOut ? async ()=>{
    await signInSheet({ auth, label:(k)=> bi(k), titleKey:"setup.signin.title", noteKey:"setup.signin.note" });
    kickQueue(300);
  } : null;
}
let qBusy = false, qTimer = null, qDelay = 0;
async function sendQueued(){
  if(qBusy || navigator.onLine === false) return;
  const u = realUser(); if(!u){ paintQueue(); return; }
  const list = await queuedWords();
  if(!list.length){ qDelay = 0; paintQueue(); return; }
  qBusy = true; let sent = 0, waiting = false;
  try{
    for(const d of list){
      d.consent = Object.assign(freshDraft().consent, d.consent || {});
      d.up = Object.assign(freshDraft().up, d.up || {});
      try{
        await sendWord(d, u, false);
        await idbDo("readwrite", st=> st.delete(d.key));
        sent++;
      }catch(e){
        if(isNetErr(e)){ waiting = true; break; }            // still no signal: try again later
        console.warn("[AFD add] queued word failed at", e && e.step, e);
        C.report("add.queue." + ((e && e.step) || "start"), e);
        d.failures = (d.failures || 0) + 1; await saveDraft(d);   // kept; skipped this round
      }
    }
  }finally{ qBusy = false; }
  await paintQueue();
  if(sent){
    C.notice("add.queue.sent", { mode: MODE, kind:"ok", vars:{ n: sent } });
    C.track("add", "flushed", { n: sent });
  }
  if(waiting){
    qDelay = qDelay ? Math.min(qDelay * 3, 120000) : 3000;
    clearTimeout(qTimer); qTimer = setTimeout(sendQueued, qDelay);
  }else qDelay = 0;
}
function kickQueue(ms){ clearTimeout(qTimer); qDelay = 0; qTimer = setTimeout(sendQueued, ms || 0); }
function paintPark(){ $("parkBtn").classList.toggle("hidden", navigator.onLine !== false); }
$("parkBtn").onclick = ()=> parkDraft();
window.addEventListener("online",  ()=>{ paintPark(); kickQueue(2000); });
window.addEventListener("offline", paintPark);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState === "visible") kickQueue(500); });
// Ask the browser not to clear this site's storage when the phone runs low on
// space: parked words live only here until they're sent.
try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(_){}
$("shareBack").onclick = ()=> show("show");

/* ---- sign-in: only here, at the end, once there's a word worth keeping ----
   The controls are afd-signin.js (shared with the dictionary and the recorder).
   A sign-in that succeeds carries on into sharing (wantShare → onAuthStateChanged). */
const signIn = mountSignIn($("signinHost"), {
  auth, label: (k)=> bi(k), text: (k)=> plain(k),
  showError: (h)=>{ $("shareErr").innerHTML = h; },
  onBegin: ()=>{ wantShare = true; }, onFail: ()=>{ wantShare = false; }
});
$("notYou").onclick = ()=> signOut(auth);
// An email sign-in link that came back here (the draft is in this browser's storage).
finishEmailLink(auth, { label: (k)=> bi(k), text: (k)=> plain(k),
  showError: (h)=>{ $("shareErr").innerHTML = h; },
  onBegin: ()=>{ wantShare = true; }, onFail: ()=>{ wantShare = false; } });

/* ---- the account badge in the header: a filled initial (☎ for a phone-only
   account) when signed in, a faint outline when not. Tap: who, and sign out —
   or, signed out, that sign-in comes at the end. ---- */
const PERSON_SVG = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>';
function whoLabel(u){ return u.displayName || u.email || u.phoneNumber || ""; }
// "Signed in as · مسجَّل الدخول باسم +1…": the account once, after the label in
// both languages — a {who} inside each sentence printed it twice in auto mode
function signedInAs(u){ return plain("add.share.as") + " " + whoLabel(u); }
function paintAcct(){
  const u = realUser(), b = $("acct");
  b.classList.toggle("in", !!u);
  if(u){
    const w = (u.displayName || u.email || "").trim();
    b.textContent = w ? w[0].toUpperCase() : "\u260E";
    b.title = signedInAs(u);
  }else{ b.innerHTML = PERSON_SVG; b.title = plain("add.acct.out"); }
  b.setAttribute("aria-label", b.title);
  // caption: "دخول" signed out, "حسابي" signed in — it said "my account" either way
  const cap = C.STRINGS[u ? "hdr.account" : "hdr.signin"]; if(cap && cap.ar) b.setAttribute("data-cap", cap.ar);
}
$("acct").onclick = async ()=>{
  const u = realUser();
  // in the page (AFDCore.ask), not the browser's alert/confirm boxes
  if(!u){ await C.ask({ mode: MODE, titleKey:"add.acct.out", yesKey:"auth.close", yesIcon:"keep" }); return; }
  if(await C.ask({ mode: MODE, titleKey:"account.signout.confirm",
        yesKey:"account.signout", yesIcon:"signout", noKey:"account.stay", noIcon:"keep" })) signOut(auth);
};
paintAcct();

onAuthStateChanged(auth, ()=>{
  paintAcct();
  paintQueue(); kickQueue(800);                   // parked words go once an account is here
  if($("share").hidden) return;
  paintAuth();
  prefillConsent();
  if(wantShare && realUser()) share();
});

/* ---------------- done ---------------- */
$("doneAnother").onclick = async ()=>{
  draft = freshDraft(); openPanel = null;
  if(photoUrl){ URL.revokeObjectURL(photoUrl); photoUrl = null; }
  $("sayReview").classList.add("hidden"); $("sayMsg").classList.add("hidden"); $("meanMsg").classList.add("hidden");
  $("emojiIn").value = "";
  await saveDraft();
  show("say");
};
$("doneInvite").onclick = async ()=>{
  const url = location.origin + location.pathname;
  const x = C.STRINGS["add.invite.text"];
  const text = x.ar + "\n" + x.en;
  try{ if(navigator.share){ await navigator.share({ text, url }); return; } }catch(e){ if(e && e.name==="AbortError") return; }
  window.open("https://wa.me/?text=" + encodeURIComponent(text + "\n" + url), "_blank", "noopener");   // a new tab, like every other share — this used to navigate the page away
};

/* ---------------- draft banner + start ---------------- */
$("draftDiscard").onclick = async ()=>{
  await clearDraft();
  draft = freshDraft(); openPanel = null;
  if(photoUrl){ URL.revokeObjectURL(photoUrl); photoUrl = null; }
  $("draftBanner").classList.add("hidden");
  show("say");
};

(async ()=>{
  const d = await loadDraft();
  if(d && d.word){
    // A word from last time is still waiting (often: the sign-in sent them away).
    draft = Object.assign(freshDraft(), d);
    draft.consent = Object.assign(freshDraft().consent, d.consent||{});
    draft.up = Object.assign(freshDraft().up, d.up||{});
    $("draftBanner").classList.remove("hidden");
    show("share", {auto:true});
  }else{
    show("say", {auto:true});
  }
})();
</script>
</body>
</html>
