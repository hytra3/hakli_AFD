<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Hakli — speak to find</title>
<link rel="icon" href="favicon.svg?v=b0827a" type="image/svg+xml">
<script src="afd-core.js?v=b0827a"></script>
<script src="afd-words.js?v=b0827a"></script>
<style>
  /* ---------------------------------------------------------------- tokens
     Dhofar khareef: monsoon fog, juniper mountain, frankincense resin.
     Deliberately NOT cream + terracotta. */
  :root{
    --fog:#EAF0EE;         /* cool misty background            */
    --cloud:#FFFFFF;       /* raised surfaces                  */
    --mountain:#1F3A34;    /* deep juniper — primary ink       */
    --mist:#8CA39B;        /* muted sage — secondary           */
    --mist-2:#C4D2CC;      /* faint sage — strips, dividers    */
    --resin:#C6873F;       /* frankincense amber — LIVE only   */
    --resin-soft:#E7C9A0;
    --danger:#9E4433;      /* muted clay — erase confirm only  */
    --ink:#17241F;
    --shadow:24px 24px 60px rgba(31,58,52,.10);
    --r:22px;
    --tap:96px;            /* minimum comfortable touch target */
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:
      radial-gradient(120% 80% at 50% -10%, #F3F7F5 0%, var(--fog) 55%, #DFE8E4 100%) fixed;
    color:var(--ink); font-family:var(--sans);
    -webkit-tap-highlight-color:transparent;
    display:flex; flex-direction:column; min-height:100dvh;
  }
  /* ---------------------------------------------------------------- header */
  header{
    display:flex; align-items:center; gap:10px;
    padding:18px 20px calc(6px + env(safe-area-inset-top));
    color:var(--mountain);
  }
  .mark{width:30px;height:30px;flex:0 0 auto}
  .wordmark{font-family:var(--serif); font-size:20px; letter-spacing:.2px}
  .wordmark small{color:var(--mist); font-family:var(--sans); font-size:12px; letter-spacing:.12em; text-transform:uppercase; margin-inline-start:8px}
  .skin{margin-inline-start:auto; width:42px; height:42px; flex:0 0 auto; border-radius:50%;
        border:1px solid var(--hairline); background:var(--cloud); color:var(--mountain);
        display:grid; place-items:center; cursor:pointer; box-shadow:0 2px 8px rgba(31,58,52,.10)}
  .skin svg{width:20px;height:20px}
  .skin .lbl{font-family:var(--serif); font-size:18px; line-height:1}

  /* ---------------------------------------------------------------- hero */
  main{flex:1; display:flex; flex-direction:column; align-items:center; padding:0 20px 32px}
  /* idle: the mic is a centered hero */
  body:not(.has-results) main{justify-content:center}
  /* results: everything rides up to the top, mic stays put and shrinks */
  body.has-results main{justify-content:flex-start}

  /* the mic + hint live together in a zone that sticks to the top while
     results scroll underneath — so the mic never wanders off-screen and a
     re-tap is always in the same place */
  .control{width:100%; max-width:560px; display:flex; flex-direction:column;
           align-items:center; gap:16px; padding:14px 0 12px;
           position:sticky; top:0; z-index:5;
           background:linear-gradient(var(--fog) 74%, rgba(234,240,238,0))}

  .stage{position:relative; width:min(66vw,248px); aspect-ratio:1;
         transition:width .35s ease}
  body.has-results .stage{width:104px}
  .ring{position:absolute; inset:0; border-radius:50%; border:2px solid var(--mist-2);
        opacity:0; transform:scale(.6)}
  body.rec .ring{animation:ripple 1.8s ease-out infinite}
  .ring:nth-child(2){animation-delay:.6s}
  .ring:nth-child(3){animation-delay:1.2s}
  @keyframes ripple{0%{opacity:.6;transform:scale(.62)}100%{opacity:0;transform:scale(1.25)}}

  .mic{
    position:absolute; inset:0; margin:auto; width:100%; height:100%;
    border:none; border-radius:50%; cursor:pointer; color:var(--cloud);
    background:radial-gradient(120% 120% at 30% 25%, #2C5349 0%, var(--mountain) 70%);
    box-shadow:var(--shadow), inset 0 2px 0 rgba(255,255,255,.14);
    display:grid; place-items:center; transition:transform .18s ease, background .2s ease;
    touch-action:none; user-select:none;
  }
  .mic:active{transform:scale(.97)}
  body:not(.rec):not(.busy) .mic{animation:breathe 4.5s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
  body.rec .mic{background:radial-gradient(120% 120% at 30% 25%, #D89A54 0%, var(--resin) 75%)}
  body.busy .mic{background:radial-gradient(120% 120% at 30% 25%, #8CA39B 0%, #6E877E 75%)}
  .mic svg{width:38%; height:38%}
  /* live level bloom */
  .bloom{position:absolute; inset:0; margin:auto; border-radius:50%;
         background:radial-gradient(circle, rgba(198,135,63,.32), transparent 62%);
         transform:scale(var(--lvl,0)); transition:transform .08s linear; pointer-events:none}

  .hint{font-family:var(--serif); font-size:22px; color:var(--mountain); text-align:center; line-height:1.35}
  .hint .ar{display:block; font-size:16px; color:var(--mist); font-family:var(--sans); margin-top:4px}
  .hint .ar.solo{display:block; font-size:inherit; color:var(--mountain); font-family:var(--sans); direction:rtl; margin-top:0}
  .hint.small{font-size:16px; color:var(--mist)}

  /* ---------------------------------------------------------------- results */
  .results{width:100%; max-width:560px; display:flex; flex-direction:column; gap:14px}
  /* candidate card = one compact row */
  .card{background:var(--cloud); border-radius:var(--r); box-shadow:var(--shadow);
        padding:14px; display:flex; flex-direction:column; align-items:stretch; gap:12px; text-align:left;
        opacity:0; transform:translateY(10px); animation:rise .4s ease forwards}
  @keyframes rise{to{opacity:1;transform:none}}
  /* every card: a head row, then a collapsible detail underneath */
  .card .head{display:flex; align-items:center; gap:14px; cursor:pointer}
  .card.lead{padding:18px; gap:16px; border:1.5px solid var(--resin)}
  .card.lead .thumb{position:relative}
  /* wordless "closest match" pin on the top result's picture */
  .card.lead .thumb::after{content:""; position:absolute; top:-5px; right:-5px;
    width:15px; height:15px; border-radius:50%; background:var(--resin);
    border:2.5px solid var(--cloud); box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .card .detail{display:none; flex-direction:column; gap:16px}
  .card.open .detail{display:flex}
  .card-chev{flex:0 0 auto; margin-left:2px; color:var(--mist); transition:transform .18s}
  .card.open .card-chev{transform:rotate(180deg)}

  .thumb{width:64px; height:64px; flex:0 0 auto; border-radius:14px; overflow:hidden;
         display:grid; place-items:center; color:var(--cloud); font-family:var(--serif);
         font-size:26px; background:var(--tile,#3A5C52)}
  .card.lead .thumb{width:84px;height:84px;font-size:34px;border-radius:18px}
  .thumb img{width:100%;height:100%;object-fit:cover}

  .gloss{flex:1; min-width:0; font-family:var(--serif); font-size:22px; color:var(--ink);
         line-height:1.15; word-break:break-word; text-align:left}
  .card.lead .gloss{font-size:28px}
  .gloss .glossar{display:block; font-family:var(--sans); font-size:15px; color:var(--mist);
                  margin-top:3px; direction:rtl; text-align:right}
  .gloss .glossar.solo{font-size:22px; color:var(--ink); margin-top:0}
  .card.lead .gloss .glossar.solo{font-size:28px}

  .play{flex:0 0 auto; width:52px; height:52px; border-radius:50%; border:none; cursor:pointer;
        background:var(--mountain); color:var(--cloud); display:grid; place-items:center;
        box-shadow:0 6px 16px rgba(31,58,52,.22)}
  .card.lead .play{width:60px; height:60px; background:var(--resin)}
  .play svg{width:42%;height:42%}

  /* the word's own voice, drawn inside its box in place of a letter */
  .thumb-wave{width:78%; height:56%; fill:rgba(255,255,255,.92); display:block}
  .voice-row .vr-wave{flex:1; height:26px; min-width:0; margin:0 6px; display:block}
  .voice-row .vr-wave svg{width:100%; height:100%; display:block; fill:var(--mist-2)}
  .voice-row[aria-pressed="true"] .vr-wave svg{fill:var(--resin)}
  .voice-row.withdrawn .vr-wave svg{fill:var(--mist-2); opacity:.5}

  /* speaker avatars — big enough for an elder to tap confidently */
  .voices{display:flex; align-items:center; gap:10px; flex-wrap:wrap}
  .av{width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;position:relative;
      display:grid;place-items:center;box-shadow:0 2px 8px rgba(31,58,52,.16)}
  .av svg{width:60%;height:60%}
  .av[aria-pressed="true"]{outline:3px solid var(--resin); outline-offset:2px}

  /* collapsed count chip — a language-free "N voices", tap to itemize */
  .voices-chip{display:inline-flex; align-items:center; gap:8px; border:1.5px solid var(--mist-2);
      background:transparent; border-radius:26px; padding:6px 14px 6px 8px; cursor:pointer;
      box-shadow:0 2px 8px rgba(31,58,52,.10)}
  .voices-chip .peeks{display:inline-flex}
  .voices-chip .peek{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
      box-shadow:0 0 0 2px var(--cloud); margin-left:-10px}
  .voices-chip .peek:first-child{margin-left:0}
  .voices-chip .peek svg{width:60%;height:60%}
  .voices-chip .count{font:700 17px/1 var(--sans); color:var(--mountain); margin-left:2px}
  .voices-chip .chev{color:var(--mist); transition:transform .18s}
  .voices-chip.open .chev{transform:rotate(180deg)}

  /* itemized voices — one row per utterance; consent controls slot in on the right later */
  .voices-list{width:100%; display:flex; flex-direction:column; gap:8px; margin-top:4px}
  .voice-row{display:flex; align-items:center; gap:12px; border:1.5px solid var(--mist-2);
      background:var(--cloud); border-radius:16px; padding:10px 14px; cursor:pointer}
  .voice-row .av-sm{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
      box-shadow:0 2px 8px rgba(31,58,52,.14)}
  .voice-row .av-sm svg{width:60%;height:60%}
  .voice-row .pl{color:var(--mountain); flex:0 0 auto; margin-left:auto}
  .voice-row[aria-pressed="true"]{border-color:var(--resin); outline:2px solid var(--resin); outline-offset:0}
  .voice-row .vr-play{flex:1; display:flex; align-items:center; gap:12px; border:none; background:transparent;
      cursor:pointer; padding:0; color:inherit; text-align:left; min-width:0}
  .voice-row .vr-play .pl{margin-left:auto}
  .voice-ctl{border:1.5px solid var(--mist-2); background:transparent; color:var(--mountain); flex:0 0 auto;
      border-radius:12px; padding:9px 13px; font:600 13px/1 var(--sans); cursor:pointer}
  .voice-ctl.restore{border-color:var(--resin); color:var(--resin)}
  .voice-ctl:disabled{opacity:.5; cursor:default}
  .voice-row.withdrawn{opacity:.62}
  .voice-row.withdrawn .av-sm{filter:grayscale(.7)}
  /* own-take management, after the recording is saved: Withdraw/Restore · Erase.
     (Try again lives at recording time in the recorder, not here.) The row wraps
     so the cluster drops to a second line on narrow screens instead of overflowing. */
  .voice-row{flex-wrap:wrap}
  .vr-controls{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-left:auto}
  .voice-ctl.erase{border-color:var(--mist-2); color:var(--mist)}
  .voice-ctl.erase.armed{border-color:var(--danger); color:var(--cloud); background:var(--danger)}

  /* header account button — sign in to manage your own voice */
  .account{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--mist-2);background:var(--cloud);
      color:var(--mountain);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
  .account.in{background:var(--mountain);color:var(--cloud);border-color:var(--mountain)}

  .sayit{border:1.5px solid var(--mist-2); background:transparent; color:var(--mountain);
         border-radius:16px; padding:15px; font:600 16px/1 var(--sans); text-decoration:none;
         display:flex; align-items:center; justify-content:center; gap:10px; cursor:pointer}
  .sayit .ar{color:var(--mist); font-weight:400}

  /* labelled sections inside an open card: "the word" (voices), then the empty
     homes for context & definition audio (the recorder doesn't capture those yet) */
  .slot .slot-head{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px}
  .slot .slot-label{font:600 12px/1.2 var(--sans); color:var(--mountain); letter-spacing:.06em; text-transform:uppercase}
  .slot .slot-label .ar{color:var(--mist); font-weight:400; letter-spacing:0; text-transform:none; margin-inline-start:6px}
  .slot .slot-empty{font:400 12px/1 var(--sans); color:var(--mist)}
  .slot-add{display:inline-flex; align-items:center; gap:6px; color:var(--mist); text-decoration:none;
      border:1.5px dashed var(--mist-2); border-radius:12px; padding:9px 13px; font:600 13px/1 var(--sans); margin-top:10px}
  .slot-body{display:flex; flex-direction:column; gap:8px; align-items:flex-start}
  .slot-body:empty{display:none}

  /* empty / miss — an invitation, not an apology */
  .empty{width:100%; max-width:460px; background:var(--cloud); border-radius:var(--r);
         box-shadow:var(--shadow); padding:26px 22px; text-align:center}
  .empty h2{font-family:var(--serif); font-weight:500; font-size:24px; color:var(--mountain); margin:0 0 6px}
  .empty p{color:var(--mist); margin:0 0 18px; font-size:15px}
  .empty .ar{display:block; direction:rtl; color:var(--mist); font-size:14px; margin-top:4px}
  .cta{display:inline-flex; align-items:center; gap:10px; background:var(--resin); color:var(--cloud);
       border:none; border-radius:16px; padding:16px 22px; font:600 16px/1 var(--sans); cursor:pointer; text-decoration:none}

  .again{align-self:center; background:transparent; border:none; color:var(--mist);
         font:600 14px/1 var(--sans); padding:12px; cursor:pointer; display:inline-flex; gap:8px; align-items:center}

  .banner{max-width:560px; margin:0 auto; background:#FBEFE0; color:#7A5320; border:1px solid var(--resin-soft);
          border-radius:14px; padding:12px 14px; font-size:14px; text-align:center}
  .hidden{display:none !important}
  /* dev distance readout — off by default, tap the wordmark 3× to reveal */
  .dbg{position:fixed; bottom:8px; left:8px; font:11px/1.4 ui-monospace,monospace; color:var(--mist);
       background:rgba(255,255,255,.7); padding:6px 8px; border-radius:8px; pointer-events:none}

  @media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important}
  }
  :focus-visible{outline:3px solid var(--resin); outline-offset:3px}
.head-counts{display:flex;gap:10px;margin-top:5px;font:600 11px/1 var(--sans);color:var(--mist)}
.card.open .head-counts{display:none}
.allbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;width:40px;height:40px;
  border:1.5px solid var(--mist-2);border-radius:50%;background:var(--cloud);color:var(--mountain);
  cursor:pointer;padding:0;margin-bottom:12px}
  /* growable dictionary: an explicit "add a word" tile atop browse, and a quiet
     escape hatch under search candidates for a real new word that looked near one */
  .addword{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:460px;
    margin:0 auto 12px;border:1.5px dashed var(--resin);border-radius:16px;background:transparent;
    color:var(--resin);font:600 15px/1 var(--sans);padding:14px 18px;cursor:pointer}
  .addword:hover{background:var(--resin-soft)}
  .notthese{display:block;margin:14px auto 4px;background:transparent;border:none;color:var(--mist);
    font:600 14px/1.3 var(--sans);padding:10px 12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
</style>
</head>
<body>
  <header>
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <path d="M2 26 L11 9 L17 20 L21 13 L30 26 Z" fill="#1F3A34"/>
      <circle cx="24" cy="7" r="3.2" fill="#C6873F"/>
    </svg>
    <span class="wordmark" id="wordmark">Hakli<small>speak to find</small></span>
    <button class="skin" id="skin" aria-label="Change how words are shown"></button>
    <button class="account" id="account" aria-label="Sign in to manage your voice"></button>
  </header>

  <main>
    <div class="control">
      <div class="stage" id="stage">
        <span class="ring"></span><span class="ring"></span><span class="ring"></span>
        <span class="bloom" id="bloom"></span>
        <button class="mic" id="mic" aria-label="Hold and speak a word">
          <!-- mic glyph -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/>
          </svg>
        </button>
      </div>
      <p class="hint" id="hint"><span class="ar solo">تكلّم</span></p>
    </div>

    <div class="results hidden" id="results"></div>
  </main>

  <div class="dbg hidden" id="dbg"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp, updateDoc, collection, query, where, limit, getDocs }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, getDownloadURL }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
import { getAuth, onAuthStateChanged, signInWithPopup, GoogleAuthProvider, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initCard, entryCard, slotSection, playVoiceInto, setConsent, voiceAvatarBtn, buildVoiceRow, buildVoices, entryCounts, listPlayable, envelopeFor, downsampleEnv, boxBars, paintBox, applyBox, faunaAvatar, domainColor, playInto, hashInt, escapeHtml } from "./afd-card.js?v=b0827a";


/* ================================================================= CONFIG */
/* Same afd-dev project the recorder uses. Web keys identify a project;
   they authorise nothing — security lives in the rules. */
const firebaseConfig = {
  apiKey:            "AIzaSyDsLxppuVNGLdJGcF85irDxepVL36RaqiY",
  authDomain:        "afd-dev.firebaseapp.com",
  projectId:         "afd-dev",
  storageBucket:     "afd-dev.firebasestorage.app",
  messagingSenderId: "454829954488",
  appId:             "1:454829954488:web:c83d6d16ab17e106956b4d"
};

/* >>> PASTE YOUR CLOUD RUN URL (no trailing slash) <<< */
const EMBED_URL = "https://afd-embed-454829954488.europe-west1.run.app";

/* Confidence gates on cosine distance. PLACEHOLDERS — recalibrate once
   real cross-speaker data exists. Within-speaker self-repeats sat at
   0.14–0.25 in testing, so cross-speaker "same word" will be a bit higher. */
const BUILD = "b0827a";      // bump every publish; shown in the wordmark + console

/* Confidence gates. Recalibrated from real measured distances (the old
   0.35/0.60 were placeholders; live queries land ~0.08–0.20). These absolutes
   are first estimates off a tiny corpus — tune as the corpus grows. The MARGIN
   gate is the robust part: it's scale-independent, so a near-tie never autoplays
   as certainty even when the absolute distance looks small (e.g. deer 0.148 vs
   camel 0.149 — a 0.001 gap — should be "did you mean", not "here it is"). */
const AUTOPLAY_MAX = 0.15;   // top hit must be at least this close…
const MAYBE_MAX    = 0.25;   // …and anything past this isn't shown as a candidate
const MARGIN_MIN   = 0.03;   // …AND must beat the runner-up by this much to autoplay
                             // >  this OR no results: nobody has said it → be first
const RECORDER_URL = "index.html";  // where "say it yourself" goes

/* How the box shows a word. Default is chosen for us so a non-reader does nothing;
   the small header control changes it. Stored locally — no account needed. */
const MODES = AFDCore.DISP_MODES;          // shared with the recorder via afd-core
let displayMode = AFDCore.getDisplayMode("sound");   // find defaults to sound (non-reader-first)
let lastResults = null;
let renderToken = 0;   // guards against two async renders racing to append
let deepEntry  = null; // set when the view is a chosen entry (find.html#ent_xxx)
function setDisplayMode(m){ displayMode = m; AFDCore.setDisplayMode(m); }

/* ================================================================= setup */
const app   = initializeApp(firebaseConfig);
const db    = getFirestore(app);
const store = getStorage(app);
const auth  = getAuth(app);
let currentUser = null;   // shared per-origin session — a speaker who signed in on the recorder is recognised here
initCard({ db, store, recorderUrl: RECORDER_URL, mode:()=>displayMode, user:()=>currentUser, banner });

const $ = id => document.getElementById(id);
const mic = $("mic"), hint = $("hint"), resultsEl = $("results"),
      bloom = $("bloom"), dbg = $("dbg");

/* --------- optional spoken hint (plays a recorded Hakli UI prompt if one
   has been captured; silently skipped if not). */
tryPlayPrompt("find_hint");
async function tryPlayPrompt(key){
  try{
    const s = await getDoc(doc(db, "afd_ui_prompts", key));
    if(!s.exists()) return;
    const d = s.data();
    const path = d.storagePath || d.path;
    if(!path) return;
    const url = await getDownloadURL(ref(store, path));
    const a = new Audio(url); a.play().catch(()=>{});   // autoplay may be blocked; that's fine
  }catch(_){/* no prompt yet */}
}

/* ================================================================= capture */
let mediaRec=null, chunks=[], stream=null, ac=null, holding=false, acquiring=false;

// Acquire the mic ONCE and keep it warm for the session. Re-acquiring on every
// hold races the getUserMedia permission/warm-up delay — a quick press-speak-
// release can finish before the recorder is even ready, so the clip is empty
// ("hold a little longer"). Worst in a fresh/incognito session where the mic is
// cold. The stream is released when the tab is hidden or closed.
async function ensureStream(){
  if(stream) return stream;
  if(acquiring) return null;
  acquiring=true;
  try{
    // Query capture and corpus capture now share one protocol (afd-core openStream),
    // so the query can't drift into a different acoustic space than the corpus.
    const r = await AFDCore.openStream();
    stream = r.stream;
  }catch(e){ acquiring=false; return null; }
  acquiring=false;
  return stream;
}
function stopStream(){
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  if(ac){ ac.close().catch(()=>{}); ac=null; }
}

async function startHold(){
  if(holding) return; holding=true;
  resultsEl.classList.add("hidden");
  let s = await ensureStream();
  // A warm stream can go stale — the browser/OS ends the track between holds —
  // and reusing a dead track makes MediaRecorder.start() throw NotSupportedError.
  // Drop a stream with no live track and re-acquire a fresh one.
  if(s && !s.getAudioTracks().some(t=>t.readyState==="live")){ stopStream(); s = await ensureStream(); }
  if(!s){ holding=false; setHint("Let the app use the microphone","اسمح باستخدام الميكروفون"); return; }
  if(!holding) return;                 // released during acquisition — stream stays warm for the next hold
  document.body.classList.add("rec"); setHint("Listening…","أستمع…");
  meter(s);
  chunks=[];
  try{ mediaRec = new MediaRecorder(s); }
  catch(e){ holding=false; stopStream(); setHint("Hold and speak","تكلّم"); return; }
  mediaRec.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
  mediaRec.onstop = onClip;
  try{ mediaRec.start(100); }   // 100ms timeslice: flush data during the hold, not only on stop
  catch(e){
    // Stream became unrecordable — force a fresh one on the next hold rather than
    // leaving an uncaught rejection and a dead-feeling button.
    holding=false; document.body.classList.remove("rec"); stopStream();
    setHint("Hold and speak","تكلّم");
  }
}
function endHold(){
  if(!holding) return; holding=false;
  document.body.classList.remove("rec");
  bloom.style.setProperty("--lvl",0);
  if(mediaRec && mediaRec.state!=="inactive") mediaRec.stop();
  if(ac){ ac.close().catch(()=>{}); ac=null; }
}
function meter(stream){
  try{
    ac = new (window.AudioContext||window.webkitAudioContext)();
    const src=ac.createMediaStreamSource(stream), an=ac.createAnalyser();
    an.fftSize=256; src.connect(an); const buf=new Uint8Array(an.frequencyBinCount);
    (function loop(){
      if(!holding) return;
      an.getByteTimeDomainData(buf);
      let peak=0; for(const v of buf){ const d=Math.abs(v-128)/128; if(d>peak)peak=d; }
      bloom.style.setProperty("--lvl", (0.4+peak*2.2).toFixed(2));
      requestAnimationFrame(loop);
    })();
  }catch(_){}
}

async function onClip(){
  // keep the stream warm for the next hold — do NOT stop it here
  const blob = new Blob(chunks, {type: chunks[0]?.type || "audio/webm"});
  if(blob.size < 800){ setHint("Hold a little longer, then speak","تكلّم أطول قليلاً"); return; }
  await runSearch(blob);
}

// release the mic when the tab is hidden or closed
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) stopStream(); });
window.addEventListener("pagehide", stopStream);

// Pre-warm the mic on load IF permission is already granted, so the first hold
// records immediately instead of losing a cold getUserMedia race (empty clip →
// "hold a little longer"). No prompt when permission isn't granted yet.
(async ()=>{
  try{
    const p = await navigator.permissions.query({name:"microphone"});
    if(p.state === "granted" && !document.hidden) ensureStream();
  }catch(_){}
})();

/* ================================================================= search */
async function runSearch(blob){
  document.body.classList.add("busy"); setHint("Finding…","أبحث…");
  if(EMBED_URL.includes("PASTE-")){
    banner("Set EMBED_URL to your Cloud Run address in find.html.");
    document.body.classList.remove("busy"); setHint("Hold and speak","تكلّم"); return;
  }
  let data;
  try{
    const fd = new FormData(); fd.append("file", blob, "query.webm");
    const r = await fetch(`${EMBED_URL}/search?top_k=6`, {method:"POST", body:fd});
    if(!r.ok) throw new Error("search "+r.status);
    data = await r.json();
  }catch(e){
    document.body.classList.remove("busy");
    setHint("Couldn't reach the matcher — try again","حاول مرة أخرى");
    document.body.classList.add("has-results"); return;
  }
  document.body.classList.remove("busy");
  const results = (data.results||[]);
  console.log("[AFD] corpus", data.corpus_n, "·", results.map(r=>`${r.entryId}:${r.distance}`).join("  "));
  showDbg(results, data.corpus_n);
  await render(results);
}

async function render(results){
  const my = ++renderToken; deepEntry = null;
  lastResults = results;
  resultsEl.innerHTML=""; hint.classList.add("small");
  resultsEl.appendChild(backToAll());
  const best = results[0];

  if(!best || best.distance > MAYBE_MAX){ renderEmpty(best); return; }

  const second = results[1];
  const margin = second ? (second.distance - best.distance) : Infinity;
  const confident = best.distance <= AUTOPLAY_MAX && margin >= MARGIN_MIN;
  console.log("[AFD] best", best.distance, "margin", (margin===Infinity?"∞":margin.toFixed(3)), "→", confident?"confident":"maybe");
  setHint(confident ? "Here it is" : "Did you mean…", confident ? "ها هو" : "هل تقصد…");

  // lead card
  const lead = await entryCard(best, true);
  if(my!==renderToken) return;                 // a newer render/open superseded us
  resultsEl.appendChild(lead.el);
  // the rest
  for(const res of results.slice(1)){
    if(res.distance > MAYBE_MAX) break;
    const c = await entryCard(res, false);
    if(my!==renderToken) return;
    resultsEl.appendChild(c.el);
  }
  // A genuinely new word can look acoustically near an existing entry (e.g. two
  // Hakli words sharing one English gloss), so never force it into a candidate —
  // always offer the way out to mint a new entry instead.
  const alt=document.createElement("button");
  alt.className="notthese";
  alt.textContent=AFDCore.t("entry.notthese", displayMode);
  alt.addEventListener("click", startNewEntry);
  resultsEl.appendChild(alt);
  resultsEl.classList.remove("hidden"); document.body.classList.add("has-results");

  if(confident && lead.firstPlayable){ playInto(lead.playBtn, lead.firstPlayable); }
}

/* Open a specific entry directly — the dictionary links here as find.html#ent_xxx.
   Same card render as a confident search hit, but chosen rather than spoken. No
   autoplay: the user navigated deliberately, so let them pick a voice. */
async function openEntry(entryId){
  const my = ++renderToken; deepEntry = entryId;
  lastResults = [{entryId, distance:0}];
  resultsEl.innerHTML=""; hint.classList.add("small");
  setHint("Here it is","ها هو");
  const lead = await entryCard({entryId, distance:0}, true);
  if(my!==renderToken) return;                 // superseded by a newer render/open
  resultsEl.innerHTML="";                       // clear again in case of a race
  resultsEl.appendChild(backToAll());
  resultsEl.appendChild(lead.el);
  resultsEl.classList.remove("hidden"); document.body.classList.add("has-results");
}
function applyEntryDeepLink(){
  const raw = (location.hash||"").replace(/^#/,"");
  if(!raw) return false;
  let id=""; try{ id=decodeURIComponent(raw).trim(); }catch(_){ id=raw.trim(); }
  if(!id) return false;
  openEntry(id); return true;
}

/* build one entry card: thumbnail, gloss, voice silhouettes, speaker avatars */


/* ---- browse: the dictionary as a scrolling list of the SAME entry cards --------
   Idle state lists every entry as a collapsed card; tapping expands it in place
   (detail loads lazily for that one entry). Same card whether reached by speaking
   or scrolling — one renderer, one behaviour. */
function backToAll(){
  const b=document.createElement("button");
  b.className="allbtn"; b.setAttribute("aria-label","Show all words");
  b.innerHTML=`<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>`;
  b.addEventListener("click", renderBrowse);
  return b;
}
async function renderBrowse(){
  const my = ++renderToken; deepEntry = null; lastResults = null;
  resultsEl.innerHTML=""; hint.classList.remove("small");
  const words = window.AFDWords || [];
  const frag = document.createDocumentFragment();
  // the dictionary is growable — an explicit way in, above the list
  frag.appendChild(addWordButton());
  // headers are cheap (one getDoc each); detail stays lazy
  for(const w of words){
    const c = await entryCard({entryId: AFDCore.entryIdFor(w.id)}, false);
    if(my!==renderToken) return;
    frag.appendChild(c.el);
  }
  // Contributor-created entries live only in Firestore (not the seed list), so
  // pull them in — otherwise a freshly added card would be invisible in browse.
  try{
    const seen = new Set(words.map(w=>AFDCore.entryIdFor(w.id)));
    const snap = await getDocs(query(collection(db,"afd_entries"), where("source","==","user")));
    if(my!==renderToken) return;
    for(const d of snap.docs){
      if(seen.has(d.id)) continue;
      const c = await entryCard({entryId: d.id}, false);
      if(my!==renderToken) return;
      frag.appendChild(c.el);
    }
  }catch(e){ console.warn("[AFD] browse: user entries", e); }
  if(my!==renderToken) return;
  resultsEl.appendChild(frag);
  resultsEl.classList.remove("hidden"); document.body.classList.add("has-results");
}

/* ---- new entry: the dictionary is growable ------------------------------------
   Create-or-add is decided by the search that just ran (the dedup gate): if
   nothing matched, or the contributor rejects the candidates, they mint a NEW
   entry. Audio-first, so no text is required — the identicon is the entry's face,
   and the first spoken form is captured in the recorder (the one place the mic
   opens, so the seed recording lands in the same acoustic space as the corpus).
   Writing needs a real, non-anonymous sign-in, matching the Firestore rules. */
async function startNewEntry(){
  if(!currentUser){
    try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
    catch(e){ console.warn("[AFD] sign-in for new entry", e); return; }
  }
  const uid = auth.currentUser && auth.currentUser.uid;
  if(!uid) return;
  const entryId = AFDCore.mintEntryId();
  try{
    await setDoc(doc(db,"afd_entries",entryId), {
      source:"user", createdBy:uid, createdAt: serverTimestamp()
    });
  }catch(e){
    console.warn("[AFD] create entry", e);
    banner("Couldn't create the entry — please try again.");
    return;
  }
  console.log("[AFD] new entry", entryId, "→ recorder");
  location.href = `${RECORDER_URL}#${encodeURIComponent(entryId)}|word`;
}

function addWordButton(){
  const b=document.createElement("button");
  b.className="addword";
  b.innerHTML=`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>`+
    `<span>${escapeHtml(AFDCore.t("entry.addnew", displayMode))}</span>`;
  b.addEventListener("click", startNewEntry);
  return b;
}



/* Voices: a language-free count chip that opens an itemized list of utterances.
   One voice → a single avatar (no chip). Many → chip, tap to expand. Each row
   plays that utterance and repaints the box. A row that belongs to the signed-in
   viewer also carries a Withdraw / Restore control — the speaker managing their
   own voice, in context. (Agent-mediated withdrawal, which needs the spoken
   artifact, arrives with the switch-speaker flow.) */









function renderEmpty(best){
  hint.classList.add("small"); setHint("", "");
  const div=document.createElement("div");
  div.className="empty";
  div.innerHTML=`
    <h2>Not in the dictionary yet</h2>
    <p>Be the first — add this word.<span class="ar">ليست في القاموس بعد — أضِفها</span></p>
    <button class="cta" id="newEntryBtn">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
      ${escapeHtml(AFDCore.t("entry.addnew", displayMode))}
    </button>`;
  resultsEl.innerHTML=""; resultsEl.appendChild(div);
  const nb=div.querySelector("#newEntryBtn"); if(nb) nb.addEventListener("click", startNewEntry);
  resultsEl.classList.remove("hidden"); document.body.classList.add("has-results");
}

/* ================================================================= visuals */
/* =============================================== the word's voice, in its box */



/* stored envelope if the recording has one, else compute it once from the audio
   (so legacy clips get a shape too) and cache by url. */


/* resample an envelope to n bars and return centered SVG rects for the square box */

   auto   → picture (image, else pictograph) → sound-shape → letter
   sound  → the waveform, always
   script → Arabic / transliteration text */


/* deterministic round fauna avatar — pseudonymous, no profile read needed */




/* ================================================================= plumbing */

function setHint(en, ar){
  // Audio-first tiers (sound / script) speak to non-readers in Arabic; auto keeps
  // English with Arabic beneath, for you and bilingual helpers.
  if(displayMode!=="auto" && ar){ hint.innerHTML = `<span class="ar solo">${escapeHtml(ar)}</span>`; return; }
  hint.innerHTML = escapeHtml(en) + (ar?`<span class="ar">${escapeHtml(ar)}</span>`:"");
}
function banner(msg){
  let b=document.querySelector(".banner");
  if(!b){ b=document.createElement("div"); b.className="banner"; document.querySelector("main").prepend(b); }
  b.textContent=msg;
}


/* press-and-hold on the mic (pointer covers touch + mouse) */
// Visible build stamp — compare laptop vs phone to catch a stale cache.
try{ document.querySelector("#wordmark small").textContent = "speak to find · " + BUILD; }catch(_){}
console.log("[AFD] build", BUILD, "·", location.href);

// deep-link opens one entry; otherwise show the whole dictionary as browsable cards
if(!applyEntryDeepLink()) renderBrowse();
window.addEventListener("hashchange", ()=>{ if(!applyEntryDeepLink()) renderBrowse(); });

mic.addEventListener("pointerdown", e=>{ e.preventDefault(); startHold(); });
mic.addEventListener("pointerup",   e=>{ e.preventDefault(); endHold(); });
mic.addEventListener("pointercancel", endHold);
mic.addEventListener("pointerleave", ()=>{ if(holding) endHold(); });
/* keyboard: space/enter to hold */
mic.addEventListener("keydown", e=>{ if((e.key===" "||e.key==="Enter")&&!e.repeat){ e.preventDefault(); startHold(); }});
mic.addEventListener("keyup",   e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); endHold(); }});

/* the wordless view-changer: cycles picture → sound → script and re-skins */
const SKIN_ICON = {
  auto:  `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.5"/><path d="M4 18l5-5 4 4 3-3 4 4"/></svg>`,
  sound: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 9v6M8 5v14M12 8v8M16 4v16M20 10v4"/></svg>`,
  script:`<span class="lbl">أ</span>`,
};
function updateSkinIcon(){ const b=$("skin"); if(b) b.innerHTML = SKIN_ICON[displayMode] || SKIN_ICON.auto; }
$("skin").addEventListener("click", ()=>{
  const next = MODES[(MODES.indexOf(displayMode)+1) % MODES.length];
  setDisplayMode(next); updateSkinIcon();
  if(deepEntry) openEntry(deepEntry); else if(lastResults) render(lastResults);  // re-skin what's on screen
});
updateSkinIcon();
setHint("Hold and speak","تكلّم");   // idle hint, rendered in the current tier

// Account: shared per-origin session drives owner-only voice controls. A small
// button lets a fresh visitor sign in (Google); a speaker who used the recorder
// is already recognised. On auth change we re-render so controls appear/vanish.
const accountBtn = $("account");
function updateAccountUi(){
  if(!accountBtn) return;
  accountBtn.innerHTML = currentUser
    ? `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>`
    : `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>`;
  accountBtn.classList.toggle("in", !!currentUser);
  accountBtn.setAttribute("aria-label", currentUser ? "Signed in — tap to sign out" : "Sign in to manage your voice");
}
if(accountBtn){
  accountBtn.addEventListener("click", async ()=>{
    try{ if(currentUser){ await signOut(auth); } else { await signInWithPopup(auth, new GoogleAuthProvider()); } }
    catch(e){ console.warn("[AFD] auth", e); }
  });
}
onAuthStateChanged(auth, (u)=>{
  currentUser = u; updateAccountUi();
  if(deepEntry) openEntry(deepEntry); else if(lastResults) render(lastResults);  // refresh owner controls
});
updateAccountUi();

/* dev distance readout: tap the wordmark three times */
let taps=0,tt=0;
$("wordmark").addEventListener("click",()=>{ taps++; clearTimeout(tt); tt=setTimeout(()=>taps=0,600);
  if(taps>=3){ dbg.classList.toggle("hidden"); taps=0; } });
function showDbg(results, n){
  if(dbg.classList.contains("hidden")) return;
  dbg.textContent = `corpus ${n??"?"} · ` + results.map(r=>`${r.entryId}:${r.distance}`).join("  ");
}
