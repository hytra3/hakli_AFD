<!DOCTYPE html>
<!--
  Hakli · Welcome walkthrough — five scenes stitched into one loop
  Scene 1 FIND (green circle) → 2 WORD → 3 SENTENCE → 4 MEANING → 5 ADD A NEW WORD.
  WORDS (10-12): every word comes from afd-core.js STRINGS, so it is in the prompts
  tool and a corrected line reaches this page. Inside the phone: the app's own
  strings (find.*, record.*, slot.*, add.* …), so the phone says what the app says.
  Under the phone: the captions, wt.* (section "Welcome page & walkthrough").
  Faithful to the live speak-to-find (index.html) and recorder (recorder.html) tokens.
  Scenes 3–4 (10-12): no Word / Sentence / Meaning tabs (the recorder dropped them in
  b1010c). The word card's slots choose the type: the finger taps the card's
  "أضف جملة" / "أضف معنى", that slot is ringed in amber, and the kept take lands in it.
  Captions FEATURE ARABIC (large); English is a small reviewer aid — toggle it off,
  or captions off entirely, for the audience cut. Lay the Hakli voiceover on top.
  Record JUST the phone frame; captions + controls sit OUTSIDE it. Arabic = MSA draft.
-->
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hakli · welcome walkthrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --fog:#EAF0EE; --paper:#FFFFFF; --cloud:#FFFFFF; --ink:#17241F; --ink-soft:#5B6E66;
    --hairline:#D7E1DB; --well:#E9EEE7; --mist:#8CA39B; --mist-2:#C4D2CC;
    --amber:#C6873F; --amber-soft:#E7C9A0; --monsoon:#2F6B4F; --mountain:#1F3A34; --alert:#A33B2A;
    --shadow:0 18px 44px rgba(31,58,52,.10); --shadow-sm:0 6px 16px rgba(31,58,52,.10); --r:18px;
    --sans:"IBM Plex Sans Arabic",system-ui,-apple-system,sans-serif;
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    --mono:"IBM Plex Mono",ui-monospace,monospace;
    --amiri:"Amiri",serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans); color:var(--ink); background:#E4EAE7; min-height:100vh;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:22px 14px}

  .phone{position:relative; width:330px; height:668px; border-radius:44px; background:#0f1a17; padding:11px;
    box-shadow:0 30px 70px rgba(20,36,31,.38), 0 3px 0 rgba(255,255,255,.06) inset; flex:0 0 auto}
  .notch{position:absolute; top:11px; left:50%; transform:translateX(-50%); width:128px; height:26px;
    background:#0f1a17; border-radius:0 0 16px 16px; z-index:9}
  .screen{position:relative; width:100%; height:100%; border-radius:34px; overflow:hidden;
    background:radial-gradient(120% 80% at 50% -10%, #F3F7F5 0%, var(--fog) 55%, #DFE8E4 100%)}

  /* scene ribbon */
  .ribbon{position:absolute; top:0; left:0; right:0; z-index:7; display:flex; gap:5px;
    padding:14px 16px 0; justify-content:center}
  .ribbon i{height:3px; flex:1; max-width:52px; border-radius:2px; background:var(--mist-2); opacity:.6;
    transition:background .3s, opacity .3s}
  .ribbon i.on{background:var(--amber); opacity:1}

  .surface{position:absolute; inset:0; opacity:0; pointer-events:none;
    transition:opacity .5s ease; display:flex; flex-direction:column}
  .surface.on{opacity:1}

  /* ---------- FIND surface ---------- */
  .find{padding:34px 20px 30px}
  .find .top{display:flex; align-items:center; gap:9px}
  .find .logo{width:auto;height:26px}
  .find .wordmark{font-family:var(--serif); font-size:18px; color:var(--mountain); line-height:1}
  .find .wordmark small{display:block; font-family:var(--sans); font-size:10px; color:var(--mist); margin-top:2px}
  .find .account{margin-inline-start:auto; width:32px;height:32px;border-radius:50%;border:1.5px solid var(--mist-2);background:var(--cloud)}
  .find .body{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:24px}
  .find.results .body{justify-content:flex-start; padding-top:22px}
  .stage{position:relative; width:176px; height:176px; transition:width .38s, height .38s}
  .find.results .stage{width:92px; height:92px}
  .ring{position:absolute; inset:0; border-radius:50%; border:2px solid var(--mist-2); opacity:0; transform:scale(.6)}
  .find.rec .ring{animation:ripple 1.8s ease-out infinite}
  .ring:nth-child(2){animation-delay:.6s}.ring:nth-child(3){animation-delay:1.2s}
  @keyframes ripple{0%{opacity:.6;transform:scale(.62)}100%{opacity:0;transform:scale(1.26)}}
  .bloom{position:absolute; inset:0; margin:auto; border-radius:50%; transform:scale(0);
    background:radial-gradient(circle, rgba(198,135,63,.34), transparent 62%); transition:transform .12s linear}
  .mic{position:absolute; inset:0; margin:auto; width:100%; height:100%; border:none; border-radius:50%; color:#fff;
    background:radial-gradient(120% 120% at 30% 25%, #2C5349 0%, var(--mountain) 70%);
    box-shadow:var(--shadow), inset 0 2px 0 rgba(255,255,255,.14); display:grid; place-items:center;
    transition:transform .18s, background .25s}
  .mic svg{width:38%;height:38%}
  .find.idle .mic{animation:breathe 4.5s ease-in-out infinite}
  @keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
  .mic.press{transform:scale(.94)}
  .find.rec .mic{background:radial-gradient(120% 120% at 30% 25%, #D89A54 0%, var(--amber) 75%)}
  .find.busy .mic{background:radial-gradient(120% 120% at 30% 25%, #8CA39B 0%, #6E877E 75%)}
  .mic::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid var(--amber);opacity:0}
  .find.busy .mic::after{animation:sonar 1.15s ease-out infinite}
  @keyframes sonar{0%{opacity:.6;transform:scale(1)}100%{opacity:0;transform:scale(1.85)}}
  .fhint{font-family:var(--amiri); font-size:26px; color:var(--mountain); text-align:center; min-height:38px; direction:rtl}
  .find.results .fhint{font-size:16px; color:var(--mist)}
  .rescard{width:100%; max-width:270px; background:var(--cloud); border:1px solid var(--mist-2); border-radius:22px;
    box-shadow:var(--shadow); padding:16px; display:flex; align-items:center; gap:14px; position:relative;
    opacity:0; transform:translateY(14px); transition:opacity .45s, transform .45s}
  .find.results .rescard{opacity:1; transform:none}
  .rc-picto{width:52px;height:52px;border-radius:15px;background:#F3F7F5;display:grid;place-items:center;font-size:28px;flex:0 0 auto}
  .rc-wave{display:block;width:110px;height:20px}
  .rc-sub{font-size:12px;color:var(--mist);margin-top:5px;direction:rtl}
  .rc-play{width:42px;height:42px;border-radius:50%;flex:0 0 auto;border:none;background:var(--mountain);color:#fff;
    display:grid;place-items:center;font-size:14px;padding-left:3px}
  .find.results .rc-play{animation:playpulse 1.4s ease-in-out infinite}
  @keyframes playpulse{0%,100%{box-shadow:0 0 0 0 rgba(31,58,52,.28)}50%{box-shadow:0 0 0 9px rgba(31,58,52,0)}}

  /* ---------- RECORDER surface ---------- */
  .recs{padding:34px 18px 20px}
  .recs .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .stepdots{font-family:var(--sans);font-size:12px;color:var(--ink-soft);letter-spacing:.02em}
  .dispskin{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--hairline);background:var(--paper);
    color:var(--mountain);display:inline-grid;place-items:center}
  .dispskin svg{width:15px;height:15px}
  /* word card with its three slots — the slots choose what you record (no tabs) */
  .wcard{padding:12px 14px 10px;direction:rtl}
  .wc-head{display:flex;align-items:center;gap:11px;padding-bottom:8px;border-bottom:1px solid var(--hairline)}
  .wc-picto{width:44px;height:44px;border-radius:13px;background:#F3F7F5;display:grid;place-items:center;font-size:26px;flex:0 0 auto}
  .wc-name{font-size:19px;font-weight:600;color:var(--ink);line-height:1.1}
  .wc-name small{display:block;font-family:var(--serif);font-size:13px;font-weight:400;color:var(--mist);margin-top:2px;direction:ltr;text-align:right}
  .slot{margin-top:8px;padding:6px 7px;border-radius:12px;box-shadow:0 0 0 0 rgba(198,135,63,0);
    transition:box-shadow .3s}
  .slot.on{box-shadow:0 0 0 2px var(--amber)}
  .slot-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:24px}
  .slot-label{font:600 12px/1.2 var(--sans);color:var(--mountain)}
  .slot-empty{font:400 11px/1 var(--sans);color:var(--mist)}
  .slot-voices{display:flex;gap:5px;align-items:center}
  .slot-voices:empty{display:none}
  .vchip{width:24px;height:24px;border-radius:50%;background:var(--mountain);color:#fff;display:grid;place-items:center;
    font-size:9px;padding-left:2px;animation:chipin .45s ease}
  .vchip.mine{background:var(--amber)}
  @keyframes chipin{from{transform:scale(.3);opacity:0}to{transform:none;opacity:1}}
  .slot-add{display:inline-flex;align-items:center;gap:5px;color:var(--mist);border:1.5px dashed var(--mist-2);
    border-radius:10px;padding:6px 10px;font:600 12px/1 var(--sans);margin-top:6px;transition:color .2s,border-color .2s}
  .slot-add svg{width:12px;height:12px}
  .slot-add.press{color:var(--amber);border-color:var(--amber)}
  .slot.filled .slot-add,.slot.filled .slot-empty{display:none}
  .card{background:var(--cloud);border-radius:var(--r);box-shadow:var(--shadow)}
  .instruction{font-size:15px;color:var(--ink);margin:10px 4px 0;direction:rtl;text-align:center;font-family:var(--amiri);min-height:24px}
  .silhouette{height:56px;background:var(--well);border-radius:16px;margin-top:8px;position:relative;overflow:hidden;
    box-shadow:inset 0 1px 3px rgba(31,58,52,.07);display:flex;align-items:center;justify-content:center;gap:3px;padding:0 14px}
  .sil-label{position:absolute;left:12px;top:8px;font-family:var(--sans);font-size:11px;color:var(--ink-soft);direction:rtl}
  .bar{width:3px;height:6px;border-radius:2px;background:var(--mist-2);transition:height .09s linear}
  .recs.rec .bar{background:var(--amber)}
  .recbtn{width:100%;padding:15px;margin-top:9px;font-size:18px;font-weight:600;color:#fff;background:var(--amber);direction:rtl;
    border:none;border-radius:16px;box-shadow:0 10px 26px rgba(198,135,63,.30);user-select:none;position:relative;
    transition:transform .16s,background .2s}
  .recbtn.press{transform:scale(.97)}
  .recbtn .dot{display:inline-block;width:11px;height:11px;border-radius:50%;background:#fff;margin-inline-end:9px;vertical-align:middle}
  .recbtn .timer{display:block;font-family:var(--mono);font-size:13px;font-weight:400;opacity:.85;margin-top:3px}
  .recs.rec .recbtn{background:var(--alert);box-shadow:0 10px 26px rgba(163,59,42,.30)}
  .recs.rec .recbtn .dot{animation:pulse 1.1s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
  .recs.review .recbtn,.recs.review .silhouette,.recs.review .instruction{display:none}
  .reviewcard{margin-top:10px;padding:14px 16px;display:none}
  .recs.review .reviewcard{display:block;animation:rise .4s ease}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .reviewcard h2{font-family:var(--amiri);font-size:20px;margin:0 0 11px;color:var(--ink);direction:rtl;text-align:right}
  .verdict{border-radius:14px;padding:12px;margin-bottom:12px;border:1px solid;display:flex;align-items:center;gap:11px;
    background:#EAF3ED;border-color:var(--monsoon);color:#1D4633;direction:rtl}
  .verdict .big{font-size:23px;flex:0 0 auto}
  .verdict strong{display:block;font-size:15px;font-family:var(--amiri)}
  .verdict span{font-size:12px;opacity:.8}
  .player{display:flex;align-items:center;gap:10px;background:var(--well);border-radius:12px;padding:8px 11px;margin-bottom:8px}
  .player .pp{width:28px;height:28px;border-radius:50%;background:var(--mountain);color:#fff;display:grid;place-items:center;font-size:11px;flex:0 0 auto;padding-left:2px}
  .player .track{flex:1;height:4px;border-radius:2px;background:var(--mist-2);position:relative}
  .player .track::after{content:"";position:absolute;left:0;top:0;height:100%;width:34%;border-radius:2px;background:var(--ink-soft)}
  .player .dur{font-family:var(--mono);font-size:11px;color:var(--ink-soft)}
  .row{display:flex;gap:10px}
  .btn{display:block;width:100%;padding:13px;font-weight:600;font-size:15px;background:var(--mountain);color:#fff;
    border:1.5px solid var(--mountain);border-radius:14px;box-shadow:var(--shadow-sm);text-align:center;font-family:var(--amiri);
    transition:transform .16s}
  .btn.secondary{background:var(--paper);color:var(--mountain)}
  .btn.press{transform:scale(.97)}

  /* scene 1 results: the back control and the + sit beside the small mic, as on
     the dictionary page (back on the right, + on the left — RTL). */
  .mrow{position:relative;display:flex;justify-content:center;width:100%}
  .fback,.fplus{position:absolute;top:50%;margin-top:-20px;height:40px;opacity:0;transform:scale(.7);
    transition:opacity .35s,transform .35s;background:var(--cloud);box-shadow:var(--shadow-sm)}
  .find.results .fback,.find.results .fplus{opacity:1;transform:none}
  .fback{right:0;border:1.5px solid var(--mist-2);border-radius:20px;padding:0 12px 0 9px;display:flex;align-items:center;gap:5px;color:var(--mountain)}
  .fplus{left:0;width:40px;border:1.5px dashed var(--amber);border-radius:50%;color:var(--amber);display:grid;place-items:center;
    transition:opacity .35s,transform .2s,background .2s}
  .fplus.press{transform:scale(.88);background:#FBF1E4}
  .fback svg,.fplus svg{width:17px;height:17px}
  .cap{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);white-space:nowrap;
    font:500 10px/1 var(--sans);color:var(--mist);direction:rtl}
  .fplus .cap{color:var(--amber)}

  /* ---------- ADD surface (add.html: say it · show it · share it) ---------- */
  .addv{padding:34px 18px 20px;direction:rtl;text-align:center}
  .addv .atop{display:flex;align-items:center;gap:9px;direction:ltr}
  .addv .atop svg{height:24px;width:auto;color:var(--ink)}
  .addv .atop h3{margin:0 auto 0 0;font:600 17px/1 var(--sans);color:var(--mountain);direction:rtl;flex:1;text-align:center;padding-right:24px}
  .asteps{display:flex;justify-content:center;gap:9px;margin:14px 0 10px;direction:ltr}
  .asteps i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:15px;
    background:var(--cloud);border:1.5px solid var(--hairline);opacity:.5;transition:all .3s}
  .asteps i.on{opacity:1;box-shadow:0 0 0 2px var(--mountain) inset;border-color:var(--mountain)}
  .asteps i.done{opacity:1;background:var(--mist-2)}
  .apanel{display:none}
  .apanel.on{display:block;animation:rise .4s ease}
  .apanel h4{font:600 22px/1.2 var(--sans);color:var(--ink);margin:6px 0 4px}
  .apanel .ahint{font:400 13px/1.5 var(--sans);color:var(--ink-soft);margin:0 10px 12px}
  .hold{position:relative;width:132px;height:132px;margin:22px auto 8px;border-radius:50%;display:grid;place-items:center;color:#fff;
    background:var(--mountain);box-shadow:var(--shadow);transition:background .2s,transform .16s}
  .hold svg{width:44px;height:44px}
  .hold.press{transform:scale(.95)}
  .hold.rec{background:var(--amber)}
  .hold::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--amber);opacity:0}
  .hold.rec::before{animation:sonar 1.15s ease-out infinite}
  .aface{display:flex;align-items:center;justify-content:center;gap:12px;margin:2px 0 6px}
  .apic{width:84px;height:84px;border-radius:22px;background:var(--cloud);box-shadow:var(--shadow-sm);display:grid;place-items:center;font-size:46px}
  .apic .pop{animation:chipin .45s ease}
  .aplay{width:40px;height:40px;border-radius:50%;background:var(--mountain);color:#fff;display:grid;place-items:center;font-size:13px;padding-left:2px}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:4px 2px 0}
  .tile{position:relative;min-height:74px;border-radius:16px;background:var(--cloud);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:4px;font:600 12px/1.2 var(--sans);color:var(--mountain);padding:6px;transition:transform .16s,box-shadow .2s}
  .tile .ic{font-size:24px}
  .tile.press{transform:scale(.95)}
  .tile.on{box-shadow:inset 0 0 0 2px var(--mountain),var(--shadow-sm)}
  .abtn{display:block;width:100%;margin-top:14px;padding:14px;border-radius:14px;background:var(--mountain);color:#fff;
    font:600 16px/1 var(--sans);box-shadow:var(--shadow-sm);transition:transform .16s}
  .abtn.press{transform:scale(.97)}
  .thanks{font-size:52px;line-height:1;margin:18px 0 6px}

  /* the finger */
  .touch{position:absolute;left:0;top:0;width:60px;height:60px;border-radius:50%;z-index:8;pointer-events:none;
    opacity:0;transform:translate(250px,560px) scale(.9);
    background:radial-gradient(circle at 38% 34%, rgba(40,55,50,.30), rgba(40,55,50,.42) 60%, rgba(40,55,50,.12) 72%);
    border:1.5px solid rgba(255,255,255,.5);transition:transform .55s cubic-bezier(.5,.05,.3,1),opacity .35s}
  .touch::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:2px solid rgba(198,135,63,0)}
  .touch.contact::after{border-color:rgba(198,135,63,.55);animation:contact .5s ease-out}
  @keyframes contact{0%{transform:scale(1.35);opacity:.9}100%{transform:scale(1);opacity:0}}

  @media (prefers-reduced-motion:reduce){
    .find.idle .mic,.find.rec .ring,.find.busy .mic::after,.recs.rec .recbtn .dot,.find.results .rc-play,.hold.rec::before{animation:none!important}
  }

  /* caption (ARABIC featured) + controls — OUTSIDE the frame */
  .caption{max-width:340px;text-align:center;min-height:60px}
  .caption .ar{font-family:var(--amiri);font-size:22px;color:var(--mountain);direction:rtl;line-height:1.5}
  .caption .en{font-size:12.5px;color:var(--mist);margin-top:3px}
  .caption.ar-only .en{display:none}
  .caption.off{visibility:hidden}
  body.embed{background:transparent;padding:10px}
  body.embed .controls{display:none}
  .controls{display:flex;gap:8px}
  .controls button{font-family:var(--sans);font-size:13px;color:var(--mountain);background:var(--cloud);
    border:1.5px solid var(--mist-2);border-radius:999px;padding:8px 15px;cursor:pointer}
  .controls button:hover{border-color:var(--ink-soft)}
</style>

<body>

  <div class="phone">
    <div class="notch"></div>
    <div class="screen">
      <div class="ribbon"><i id="rb0"></i><i id="rb1"></i><i id="rb2"></i><i id="rb3"></i><i id="rb4"></i></div>

      <!-- FIND -->
      <section class="surface find idle on" id="find">
        <div class="top">
          <svg class="logo" viewBox="569 239 909 1568" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill-rule="evenodd" d="M585 912 L586 1124 L747 1651 L785 1791 L1260 1791 L1461 1125 L1462 912 L1439 912 L1349 1071 L697 1071 L612 912ZM1042 255 L1034 261 L1010 286 L994 307 L982 326 L972 345 L965 362 L959 383 L957 403 L956 404 L956 429 L957 430 L957 438 L962 463 L974 496 L998 542 L1006 562 L1012 585 L1013 612 L1014 613 L1009 637 L1002 656 L993 674 L972 707 L958 735 L954 747 L950 767 L951 802 L959 832 L972 859 L985 879 L998 896 L1012 912 L1021 920 L1007 880 L1002 861 L998 840 L997 814 L998 813 L998 805 L1000 795 L1006 778 L1016 758 L1033 730 L1045 707 L1056 674 L1057 661 L1058 660 L1057 632 L1053 612 L1045 590 L1046 589 L1061 610 L1077 643 L1085 673 L1086 703 L1087 704 L1085 708 L1083 727 L1074 757 L1061 788 L1050 809 L1056 806 L1064 799 L1087 775 L1100 759 L1115 736 L1115 734 L1117 733 L1128 711 L1137 686 L1141 668 L1142 649 L1143 648 L1142 624 L1141 623 L1140 611 L1134 587 L1129 574 L1119 554 L1103 529 L1069 485 L1051 458 L1037 432 L1027 405 L1021 376 L1021 365 L1020 364 L1021 336 L1022 335 L1024 315 L1029 293 L1035 274 L1042 258Z"/></svg>
          <span class="wordmark">الحَكلي<small data-k="mast.find"></small></span>
          <span class="account"></span>
        </div>
        <div class="body">
          <div class="mrow">
            <span class="fback"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 7h14M5 12h14M5 17h14"/></svg><span class="cap" data-k="view.all"></span></span>
            <div class="stage">
              <span class="ring"></span><span class="ring"></span><span class="ring"></span>
              <span class="bloom" id="fbloom"></span>
              <button class="mic" id="fmic" aria-label="Hold and speak">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
              </button>
            </div>
            <span class="fplus" id="fplus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="cap" data-k="add.title"></span></span>
          </div>
          <p class="fhint" id="fhint"></p>
          <div class="rescard">
            <div class="rc-picto">☀️</div>
            <div style="flex:1;min-width:0">
              <svg class="rc-wave" viewBox="0 0 110 20"><g fill="#C6873F"><rect x="2" y="7" width="4" height="6" rx="2"/><rect x="10" y="3" width="4" height="14" rx="2"/><rect x="18" y="8" width="4" height="5" rx="2"/><rect x="26" y="1" width="4" height="18" rx="2"/><rect x="34" y="6" width="4" height="9" rx="2"/><rect x="42" y="4" width="4" height="12" rx="2"/><rect x="50" y="9" width="4" height="4" rx="2"/><rect x="58" y="2" width="4" height="16" rx="2"/><rect x="66" y="7" width="4" height="7" rx="2"/><rect x="74" y="5" width="4" height="11" rx="2"/><rect x="82" y="8" width="4" height="5" rx="2"/><rect x="90" y="3" width="4" height="14" rx="2"/></g></svg>
            </div>
            <button class="rc-play">▶</button>
          </div>
        </div>
      </section>

      <!-- RECORDER (word / sentence / meaning) -->
      <section class="surface recs idle" id="recs">
        <div class="topbar">
          <span class="stepdots" id="stepdots" dir="rtl"></span>
          <span>
            <span class="dispskin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20.5 20.5l-4-4"/></svg></span>
          </span>
        </div>
        <div class="card wcard">
          <div class="wc-head">
            <div class="wc-picto">☀️</div>
            <div class="wc-name">شمس<small>sun</small></div>
          </div>
          <div class="slot slot-word on" id="slotWord">
            <div class="slot-head"><span class="slot-label" data-k="slot.word"></span>
              <span class="slot-voices" id="vWord"><span class="vchip">▶</span><span class="vchip">▶</span><span class="vchip">▶</span></span></div>
          </div>
          <div class="slot slot-context" id="slotSent">
            <div class="slot-head"><span class="slot-label" data-k="slot.sentence"></span><span class="slot-empty" data-k="slot.none"></span>
              <span class="slot-voices" id="vSent"></span></div>
            <span class="slot-add" id="addSent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-k="slot.add.sentence"></span></span>
          </div>
          <div class="slot slot-definition" id="slotMean">
            <div class="slot-head"><span class="slot-label" data-k="slot.meaning"></span><span class="slot-empty" data-k="slot.none"></span>
              <span class="slot-voices" id="vMean"></span></div>
            <span class="slot-add" id="addMean"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span data-k="slot.add.meaning"></span></span>
          </div>
        </div>
        <p class="instruction" id="instruction"></p>
        <div class="silhouette">
          <span class="sil-label" id="silLabel" dir="rtl"></span>
          <span id="bars"></span>
        </div>
        <button class="recbtn" id="rbtn" dir="rtl"></button>
        <div class="card reviewcard">
          <h2 data-k="review.howsound"></h2>
          <div class="verdict"><span class="big">✓</span><div><strong data-k="qc.good"></strong></div></div>
          <div class="player"><span class="pp">▶</span><span class="track"></span><span class="dur">0:01</span></div>
          <div class="row"><span class="btn secondary" data-k="review.redo"></span><span class="btn" id="keep" data-k="review.keep"></span></div>
        </div>
      </section>

      <!-- ADD A NEW WORD (add.html) -->
      <section class="surface addv" id="addv">
        <div class="atop"><svg viewBox="569 239 909 1568" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M585 912 L586 1124 L747 1651 L785 1791 L1260 1791 L1461 1125 L1462 912 L1439 912 L1349 1071 L697 1071 L612 912ZM1042 255 L1034 261 L1010 286 L994 307 L982 326 L972 345 L965 362 L959 383 L957 403 L956 404 L956 429 L957 430 L957 438 L962 463 L974 496 L998 542 L1006 562 L1012 585 L1013 612 L1014 613 L1009 637 L1002 656 L993 674 L972 707 L958 735 L954 747 L950 767 L951 802 L959 832 L972 859 L985 879 L998 896 L1012 912 L1021 920 L1007 880 L1002 861 L998 840 L997 814 L998 813 L998 805 L1000 795 L1006 778 L1016 758 L1033 730 L1045 707 L1056 674 L1057 661 L1058 660 L1057 632 L1053 612 L1045 590 L1046 589 L1061 610 L1077 643 L1085 673 L1086 703 L1087 704 L1085 708 L1083 727 L1074 757 L1061 788 L1050 809 L1056 806 L1064 799 L1087 775 L1100 759 L1115 736 L1115 734 L1117 733 L1128 711 L1137 686 L1141 668 L1142 649 L1143 648 L1142 624 L1141 623 L1140 611 L1134 587 L1129 574 L1119 554 L1103 529 L1069 485 L1051 458 L1037 432 L1027 405 L1021 376 L1021 365 L1020 364 L1021 336 L1022 335 L1024 315 L1029 293 L1035 274 L1042 258Z"/></svg><h3 data-k="add.title"></h3></div>
        <div class="asteps"><i id="as0">🎙️</i><i id="as1">🖼️</i><i id="as2">📤</i></div>
        <div class="apanel" id="apSay">
          <h4 data-k="add.step.say"></h4>
          <p class="ahint" data-k="add.say.hint"></p>
          <div class="hold" id="ahold"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></div>
        </div>
        <div class="apanel" id="apShow">
          <div class="aface"><span class="apic" id="apic1"></span><span class="aplay">▶</span></div>
          <h4 data-k="add.step.show"></h4>
          <div class="tiles">
            <span class="tile"><span class="ic">📷</span><span data-k="add.show.photo"></span></span>
            <span class="tile" id="tPic"><span class="ic">😀</span><span data-k="add.show.emoji"></span></span>
            <span class="tile"><span class="ic">🗣️</span><span data-k="add.show.meaning"></span></span>
            <span class="tile"><span class="ic">✍️</span><span data-k="add.show.write"></span></span>
          </div>
        </div>
        <div class="apanel" id="apShare">
          <div class="aface"><span class="apic">🐐</span><span class="aplay">▶</span></div>
          <h4 data-k="add.step.share"></h4>
          <p class="ahint" data-k="add.share.hint"></p>
          <span class="abtn" id="ashare" data-k="add.share.go"></span>
        </div>
        <div class="apanel" id="apDone">
          <div class="thanks">🎉</div>
          <div class="aface"><span class="apic">🐐</span></div>
          <h4 data-k="add.done.title"></h4>
          <p class="ahint" data-k="add.done.public"></p>
        </div>
      </section>

      <div class="touch" id="touch"></div>
    </div>
  </div>

  <div class="caption" id="caption"></div>
  <div class="controls">
    <button id="pauseBtn">Pause</button>
    <button id="restartBtn">Restart</button>
    <button id="capBtn">Captions: عربي + EN</button>
  </div>

<script src="afd-core.js?v=b1013d"></script>
<script>
  if(/[?&]embed/.test(location.search)) document.body.classList.add("embed");
  const $=(id)=>document.getElementById(id);
  const screen=document.querySelector('.screen');
  const find=$('find'), recs=$('recs'), addv=$('addv'), touch=$('touch'), capEl=$('caption');
  const fplus=$('fplus'), ahold=$('ahold'), tPic=$('tPic'), apic1=$('apic1'), ashare=$('ashare');
  const fmic=$('fmic'), fbloom=$('fbloom'), fhint=$('fhint');
  const rbtn=$('rbtn'), keep=$('keep'), silLabel=$('silLabel'), stepdots=$('stepdots'), instruction=$('instruction');
  const addSent=$('addSent'), addMean=$('addMean');
  const ribbons=[$('rb0'),$('rb1'),$('rb2'),$('rb3'),$('rb4')];

  // Every word comes from the app's string table (afd-core.js), so it is listed
  // in the prompts tool and an approved correction reaches this page.
  const STR=(window.AFDCore&&window.AFDCore.STRINGS)||{};
  const esc=(x)=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const A=(k)=>(STR[k]&&(STR[k].ar||STR[k].en))||k;          // Arabic (the phone, the caption)
  const E=(k)=>(STR[k]&&STR[k].en)||'';                       // English reviewer subtitle
  const AB=(k)=>esc(A(k)).replace(/\*([^*]+)\*/g,'<b>$1</b>'); // *word* → bold, as in the recorder
  document.querySelectorAll('[data-k]').forEach(el=>{el.textContent=A(el.dataset.k);});
  const PROGRESS=A('record.progress.word').replace('{i}','١').replace('{n}','٤٠');

  const bars=[]; for(let i=0;i<38;i++){const b=document.createElement('span');b.className='bar';$('bars').appendChild(b);bars.push(b);}

  const setCap=(k)=>{const en=E(k);capEl.innerHTML=`<div class="ar">${esc(A(k))}</div>`+(en?`<div class="en">${esc(en)}</div>`:'');};
  const setRibbon=(i)=>ribbons.forEach((r,k)=>r.classList.toggle('on',k===i));
  const showOnly=(el)=>[find,recs,addv].forEach(x=>x.classList.toggle('on',x===el));
  const showFind=()=>showOnly(find);
  const showRecs=()=>showOnly(recs);
  const showAdd=()=>showOnly(addv);
  function addStep(i){const P=['apSay','apShow','apShare','apDone'];
    P.forEach((id,k)=>$(id).classList.toggle('on',k===i));
    ['as0','as1','as2'].forEach((id,k)=>{$(id).classList.toggle('on',k===i);$(id).classList.toggle('done',k<i);});}
  function resetAdd(){addStep(0);ahold.classList.remove('rec','press');tPic.classList.remove('on','press');
    apic1.innerHTML='';ashare.classList.remove('press');fplus.classList.remove('press');}
  const setFind=(s)=>find.className='surface find '+s+(find.classList.contains('on')?' on':'');
  const setRecs=(s)=>recs.className='surface recs '+s+(recs.classList.contains('on')?' on':'');

  function moveTouch(el,scale){const r=el.getBoundingClientRect(),s=screen.getBoundingClientRect();
    const cx=r.left-s.left+r.width/2, cy=r.top-s.top+r.height/2;
    touch.style.opacity='1'; touch.style.transform=`translate(${(cx-30).toFixed(1)}px,${(cy-30).toFixed(1)}px) scale(${scale})`;}
  const park=()=>{touch.style.opacity='0';touch.style.transform='translate(250px,560px) scale(.9)';};
  const contact=()=>{touch.classList.remove('contact');void touch.offsetWidth;touch.classList.add('contact');};

  // The card's slots choose the record type, as in the live recorder: the chosen
  // slot is ringed amber, and a kept take adds a voice to it.
  const SLOTS={word:$('slotWord'),context:$('slotSent'),definition:$('slotMean')};
  const VOICES={word:$('vWord'),context:$('vSent'),definition:$('vMean')};
  const INSTR={word:AB('record.instr.word'),context:AB('record.instr.context'),definition:AB('record.instr.definition')};
  let curSlot='word';
  function setSlot(type){curSlot=type;for(const k in SLOTS)SLOTS[k].classList.toggle('on',k===type);instruction.innerHTML=INSTR[type];}
  function addVoice(){const c=document.createElement('span');c.className='vchip mine';c.textContent='▶';
    VOICES[curSlot].appendChild(c);SLOTS[curSlot].classList.add('filled');}
  function resetCard(){VOICES.word.querySelectorAll('.mine').forEach(n=>n.remove());
    for(const k of ['context','definition']){VOICES[k].innerHTML='';SLOTS[k].classList.remove('filled');}
    addSent.classList.remove('press');addMean.classList.remove('press');setSlot('word');}
  function recIdle(){rbtn.innerHTML='<span class="dot"></span>'+esc(A('record.hold'));}
  let timerEl=null;
  function recHold(){rbtn.innerHTML='<span class="dot"></span>'+esc(A('record.holding'))+'<span class="timer">0.0s</span>';timerEl=rbtn.querySelector('.timer');}

  // waveforms
  let bloomT=null;
  function bloomRun(){clearInterval(bloomT);const st=performance.now();
    bloomT=setInterval(()=>{const e=performance.now()-st;if(e>2400||paused){clearInterval(bloomT);fbloom.style.transform='scale(0)';return;}
      const env=Math.max(0,Math.sin(e/2400*Math.PI*2))*(.55+Math.random()*.4);fbloom.style.transform=`scale(${(.35+env*.9).toFixed(3)})`;},70);}
  let waveT=null;
  function waveRun(dur){clearInterval(waveT);const st=performance.now();
    waveT=setInterval(()=>{const e=performance.now()-st;if(e>dur||paused){clearInterval(waveT);bars.forEach(b=>b.style.height='6px');return;}
      const env=Math.max(0,Math.sin(e/dur*Math.PI*2));bars.forEach(b=>{const n=.35+Math.random()*.75;b.style.height=(6+env*n*40).toFixed(0)+'px';});
      if(timerEl)timerEl.textContent=(e/1000).toFixed(1)+'s';},70);}

  // ---- master timeline (ms) ----
  const LOOP=48800;
  const P=[
    // SCENE 1 · FIND
    {t:0,cue:'howto.find',fn(){setRibbon(0);showFind();setFind('idle');fmic.classList.remove('press');park();silLabel.textContent=A('status.ready');
      fhint.textContent=A('find.idle');recIdle();resetCard();resetAdd();setRecs('idle');
      setCap('wt.find.1');}},
    {t:1400,fn(){moveTouch(fmic,1);}},
    {t:2250,fn(){moveTouch(fmic,.84);contact();fmic.classList.add('press');setFind('rec');fhint.textContent=A('find.listening');bloomRun();
      setCap('wt.find.2');}},
    {t:4850,fn(){fmic.classList.remove('press');park();setFind('busy');fhint.textContent=A('find.finding');
      setCap('wt.find.3');}},
    {t:6100,fn(){setFind('results');fhint.textContent=A('find.idle');
      setCap('wt.find.4');}},
    // SCENE 2 · WORD
    {t:8300,cue:'howto.record',fn(){setRibbon(1);showRecs();setRecs('idle');resetCard();recIdle();silLabel.textContent=A('status.ready');park();
      stepdots.textContent=PROGRESS;
      setCap('wt.record.1');}},
    {t:9700,fn(){moveTouch(rbtn,1);setCap('wt.record.2');}},
    {t:10500,fn(){moveTouch(rbtn,.86);contact();rbtn.classList.add('press');setRecs('rec');recHold();silLabel.textContent=A('status.listening');waveRun(2400);}},
    {t:13000,cue:'howto.review',fn(){rbtn.classList.remove('press');park();setRecs('review');silLabel.textContent=A('status.ready');
      setCap('wt.review.1');}},
    {t:14600,fn(){moveTouch(keep,1);setCap('wt.review.2');}},
    {t:15400,fn(){moveTouch(keep,.88);contact();keep.classList.add('press');addVoice();setCap('wt.review.3');}},
    {t:16400,fn(){keep.classList.remove('press');park();setRecs('idle');recIdle();setCap('wt.kept');}},
    // SCENE 3 · SENTENCE
    {t:17400,cue:'howto.sentence',fn(){setRibbon(2);setCap('wt.sentence.1');moveTouch(addSent,1);}},
    {t:18200,fn(){moveTouch(addSent,.9);contact();addSent.classList.add('press');setSlot('context');
      setCap('wt.sentence.tap');}},
    {t:19100,fn(){moveTouch(rbtn,1);setCap('wt.sentence.say');}},
    {t:19900,fn(){moveTouch(rbtn,.86);contact();rbtn.classList.add('press');setRecs('rec');recHold();silLabel.textContent=A('status.listening');waveRun(2800);}},
    {t:22800,fn(){rbtn.classList.remove('press');park();setRecs('review');silLabel.textContent=A('status.ready');setCap('wt.hearkeep');}},
    {t:24200,fn(){moveTouch(keep,1);}},
    {t:24900,fn(){moveTouch(keep,.88);contact();keep.classList.add('press');addVoice();setCap('wt.sentence.kept');}},
    {t:25900,fn(){keep.classList.remove('press');park();setRecs('idle');recIdle();}},
    // SCENE 4 · MEANING
    {t:26800,cue:'howto.meaning',fn(){setRibbon(3);setCap('wt.meaning.1');moveTouch(addMean,1);}},
    {t:27600,fn(){moveTouch(addMean,.9);contact();addMean.classList.add('press');setSlot('definition');
      setCap('wt.meaning.tap');}},
    {t:28500,fn(){moveTouch(rbtn,1);setCap('wt.meaning.say');}},
    {t:29300,fn(){moveTouch(rbtn,.86);contact();rbtn.classList.add('press');setRecs('rec');recHold();silLabel.textContent=A('status.listening');waveRun(2600);}},
    {t:32000,fn(){rbtn.classList.remove('press');park();setRecs('review');silLabel.textContent=A('status.ready');setCap('wt.hearkeep');}},
    {t:33400,fn(){moveTouch(keep,1);}},
    {t:34100,fn(){moveTouch(keep,.88);contact();keep.classList.add('press');addVoice();setCap('wt.meaning.kept');}},
    {t:35100,fn(){keep.classList.remove('press');park();setRecs('idle');recIdle();}},
    // SCENE 5 · ADD A NEW WORD (the + beside the mic → add.html)
    {t:36000,cue:'howto.add',fn(){setRibbon(4);showFind();setFind('results');fhint.textContent=A('find.idle');resetAdd();park();
      setCap('wt.add.1');}},
    {t:37000,fn(){moveTouch(fplus,1);setCap('wt.add.tap');}},
    {t:37800,fn(){moveTouch(fplus,.86);contact();fplus.classList.add('press');}},
    {t:38500,fn(){fplus.classList.remove('press');park();showAdd();addStep(0);}},
    {t:39100,fn(){moveTouch(ahold,1);setCap('wt.add.say');}},
    {t:39800,fn(){moveTouch(ahold,.86);contact();ahold.classList.add('press','rec');}},
    {t:42000,fn(){ahold.classList.remove('press','rec');park();addStep(1);setCap('wt.add.show');}},
    {t:42800,fn(){moveTouch(tPic,1);}},
    {t:43500,fn(){moveTouch(tPic,.88);contact();tPic.classList.add('press','on');apic1.innerHTML='<span class="pop">🐐</span>';}},
    {t:44400,fn(){tPic.classList.remove('press');park();addStep(2);setCap('wt.add.share');}},
    {t:45100,fn(){moveTouch(ashare,1);}},
    {t:45800,fn(){moveTouch(ashare,.9);contact();ashare.classList.add('press');}},
    {t:46600,fn(){ashare.classList.remove('press');park();addStep(3);setCap('wt.add.done');}},
    // CLOSE
    {t:47600,end:true,fn(){setCap('wt.close');}},
  ];

  let base=performance.now(),pausedAt=0,paused=false,last=-1,narrating=false;
  // When embedded, tell the parent (welcome.html) which scene we've reached so it
  // can play the matching howto.* clip, and when the run has finished.
  function postUp(msg){try{if(window.parent&&window.parent!==window)window.parent.postMessage(Object.assign({type:"afd:wt"},msg),"*");}catch(_){}}
  function apply(e){let idx=0;for(let i=0;i<P.length;i++){if(e>=P[i].t)idx=i;}
    if(idx!==last){last=idx;P[idx].fn();
      if(narrating){
        if(P[idx].cue) postUp({ev:"cue",key:P[idx].cue});
        if(P[idx].end){ postUp({ev:"end"}); narrating=false; paused=true; pausedAt=performance.now(); }
      }
    }}
  function frame(now){if(!paused){let e=now-base;if(e>=LOOP){base=now;e=0;last=-1;}apply(e);}requestAnimationFrame(frame);}
  requestAnimationFrame((t)=>{base=t;requestAnimationFrame(frame);});

  const pauseBtn=$('pauseBtn');
  pauseBtn.onclick=()=>{paused=!paused;if(paused){pausedAt=performance.now();pauseBtn.textContent='Play';}else{base+=performance.now()-pausedAt;pauseBtn.textContent='Pause';}};
  $('restartBtn').onclick=()=>{base=performance.now();last=-1;paused=false;pauseBtn.textContent='Pause';clearInterval(waveT);clearInterval(bloomT);bars.forEach(b=>b.style.height='6px');fbloom.style.transform='scale(0)';};
  const capBtn=$('capBtn');
  const capModes=[['','Captions: عربي + EN'],['ar-only','Captions: عربي'],['off','Captions: off']];
  let capIdx=0;
  capBtn.onclick=()=>{capIdx=(capIdx+1)%3;capEl.classList.remove('ar-only','off');if(capModes[capIdx][0])capEl.classList.add(capModes[capIdx][0]);capBtn.textContent=capModes[capIdx][1];};
  if(document.body.classList.contains("embed")){capIdx=1;capEl.classList.add("ar-only");capBtn.textContent=capModes[1][1];}

  // When embedded in welcome.html, the language toggle drives the caption:
  //   en        → Arabic caption + English subtitle beneath  (capModes[0])
  //   ar / hakli → Arabic caption only                        (capModes[1])
  // The in-phone chrome (word card, record button, review card, add page) stays Arabic in
  // every mode, by design — the audience reads Arabic, not English.
  window.addEventListener("message",(e)=>{
    const d = e && e.data;
    if(!d || d.type !== "afd:lang") return;
    capEl.classList.remove("ar-only","off");
    if(d.mode !== "en") capEl.classList.add("ar-only");
    capIdx = (d.mode === "en") ? 0 : 1;
    if(capBtn) capBtn.textContent = capModes[capIdx][1];
  });

  // Parent (welcome.html) drives a single narrated pass:
  //   hold → freeze at the first frame while the intro openers play
  //   run  → play once from the top, emitting a per-scene cue at each scene and
  //          an "end" when the closing frame is reached (then freeze there)
  //   loop → return to the normal silent looping demo
  window.addEventListener("message",(e)=>{
    const d = e && e.data;
    if(!d || d.type !== "afd:wt-cmd") return;
    if(d.cmd === "hold"){ base=performance.now(); last=-1; narrating=false; paused=true; pausedAt=performance.now(); apply(0); }
    else if(d.cmd === "run"){ base=performance.now(); last=-1; narrating=true; paused=false; }
    else if(d.cmd === "loop"){ base=performance.now(); last=-1; narrating=false; paused=false; }
  });
</script>
