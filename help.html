<!DOCTYPE html>
<!--
  الحَكلي — Help (10-16)
  One place for help, reachable from the dictionary's ☰ menu and from the
  account menu (index.html, recorder.html):
    · the six how-to clips (each tile opens howto.html#<id>)
    · the welcome tour (welcome.html)
    · "Who can hear my voice?" — the questions the first speakers asked
    · "Ask a person" — a local Hakli speaker on WhatsApp. HIDDEN until
      afd-instance.js sets help.contact = { name:{ar,en}, whatsapp:"968…" }.
  Words come from afd-core.js (help.*, wt.howto.*; prompts tool A11),
  so a corrected line reaches this page.
-->
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>الحَكلي · مساعدة</title>
<meta property="og:type" content="website">
<meta property="og:site_name" content="Hakli — Audio First Dictionary">
<meta property="og:url" content="https://hakli.app/help.html">
<meta property="og:title" content="الحَكلي · مساعدة · Help">
<meta property="og:image" content="https://hakli.app/og-hakli-v2.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=EB+Garamond:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --fog:#EAF0EE; --cloud:#FFFFFF; --mountain:#1F3A34; --ink:#17241F;
    --mist:#6E8078; --frank:#C6873F; --frank-soft:#E7C9A0; --line:#D8E2DC;
    --ar:"Amiri", serif; --en:"EB Garamond","Palatino Linotype",Palatino,Georgia,serif;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0; overflow-x:hidden; background:var(--fog); color:var(--mountain); font-family:var(--ar); line-height:1.6;
    background-image:radial-gradient(120% 60% at 50% -10%, #F1F5F3 0%, var(--fog) 60%)}
  .wrap{max-width:680px; margin:0 auto; padding:22px 16px 60px}
  header{display:flex; align-items:center; gap:12px}
  header a.home{display:inline-flex; color:var(--ink); border-radius:12px}
  header a.home svg{height:44px; width:auto}
  header a.home:focus-visible{outline:3px solid var(--frank); outline-offset:4px}
  h1{margin:0; font-size:clamp(26px,7vw,34px); font-weight:700; color:var(--ink); flex:1}
  .toggle{display:inline-flex; background:var(--cloud); border:1px solid var(--line); border-radius:999px; padding:4px; gap:3px}
  .toggle button{font-family:var(--ar); font-size:15px; color:var(--mist); background:transparent; border:0; border-radius:999px; padding:6px 13px; cursor:pointer}
  .toggle button.en{font-family:var(--en); font-style:italic}
  .toggle button[aria-pressed="true"]{background:var(--mountain); color:#fff}
  .lead{font-size:18px; color:var(--mist); margin:10px 2px 16px}
  body.en .lead, body.en h1, body.en .tile .t{font-family:var(--en); font-style:italic}
  body.en .lead, body.en h1, body.en h2, body.en .tile .t, body.en .faq, body.en .row, body.en .wa{font-family:var(--en); font-style:italic}
  h2{font-size:20px; color:var(--ink); margin:26px 2px 10px}
  .tiles{display:grid; grid-template-columns:repeat(3,1fr); gap:10px}
  @media (max-width:420px){ .tiles{grid-template-columns:repeat(2,1fr)} }
  .tile{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; min-height:88px;
    padding:10px 6px; border-radius:18px; background:var(--cloud); border:1.5px solid var(--line);
    color:var(--mountain); text-decoration:none; box-shadow:0 6px 16px rgba(31,58,52,.07); transition:transform .12s}
  .tile:active{transform:scale(.97)}
  .tile .ic{font-size:30px; line-height:1}
  .tile .t{font-size:17px; font-weight:700; text-align:center; line-height:1.25}
  .row{display:flex; align-items:center; gap:12px; margin-top:10px; padding:14px 16px; border-radius:18px; background:var(--cloud);
    border:1.5px solid var(--line); color:var(--mountain); text-decoration:none; font-size:18px; box-shadow:0 6px 16px rgba(31,58,52,.07)}
  .row .ic{font-size:26px; line-height:1}
  .row .go{margin-inline-start:auto; color:var(--mist)}
  .faq{background:var(--cloud); border:1.5px solid var(--line); border-radius:18px; overflow:hidden}
  .faq details + details{border-top:1px solid var(--line)}
  .faq summary{cursor:pointer; padding:14px 16px; font-size:18px; font-weight:700; color:var(--ink); list-style:none; display:flex; gap:10px}
  .faq summary::-webkit-details-marker{display:none}
  .faq summary::after{content:"+"; margin-inline-start:auto; color:var(--frank); font-weight:700}
  .faq details[open] summary::after{content:"−"}
  .faq p{margin:0; padding:0 16px 16px; font-size:17px}
  .contact{margin-top:6px}
  .contact p{margin:0 2px 10px; font-size:17px}
  .wa{display:inline-flex; align-items:center; gap:8px; font-size:18px; color:#fff; background:#1F7A4D; border-radius:999px;
    padding:12px 26px; text-decoration:none; box-shadow:0 12px 30px rgba(31,58,52,.18)}
  .enter-wrap{text-align:center; margin-top:28px}
  .enter{display:inline-flex; font-size:19px; color:#fff; background:var(--mountain); border-radius:999px; padding:13px 32px;
    text-decoration:none; box-shadow:0 12px 30px rgba(31,58,52,.18)}
  body.en .enter{font-family:var(--en); font-style:italic}
</style>

<link rel="icon" href="favicon.ico?v=b1017a" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png?v=b1017a">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png?v=b1017a">

<link rel="manifest" href="manifest.webmanifest?v=b1017a">
<meta name="theme-color" content="#17241F">
</head>
<body>
<main class="wrap">
  <header>
    <a class="home" href="index.html" aria-label="Open the dictionary" title="Open the dictionary"><svg viewBox="569 239 909 1568" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path fill-rule="evenodd" d="M585 912 L586 1124 L747 1651 L785 1791 L1260 1791 L1461 1125 L1462 912 L1439 912 L1349 1071 L697 1071 L612 912ZM1042 255 L1034 261 L1010 286 L994 307 L982 326 L972 345 L965 362 L959 383 L957 403 L956 404 L956 429 L957 430 L957 438 L962 463 L974 496 L998 542 L1006 562 L1012 585 L1013 612 L1014 613 L1009 637 L1002 656 L993 674 L972 707 L958 735 L954 747 L950 767 L951 802 L959 832 L972 859 L985 879 L998 896 L1012 912 L1021 920 L1007 880 L1002 861 L998 840 L997 814 L998 813 L998 805 L1000 795 L1006 778 L1016 758 L1033 730 L1045 707 L1056 674 L1057 661 L1058 660 L1057 632 L1053 612 L1045 590 L1046 589 L1061 610 L1077 643 L1085 673 L1086 703 L1087 704 L1085 708 L1083 727 L1074 757 L1061 788 L1050 809 L1056 806 L1064 799 L1087 775 L1100 759 L1115 736 L1115 734 L1117 733 L1128 711 L1137 686 L1141 668 L1142 649 L1143 648 L1142 624 L1141 623 L1140 611 L1134 587 L1129 574 L1119 554 L1103 529 L1069 485 L1051 458 L1037 432 L1027 405 L1021 376 L1021 365 L1020 364 L1021 336 L1022 335 L1024 315 L1029 293 L1035 274 L1042 258Z"/></svg></a>
    <h1 id="title"></h1>
    <div class="toggle" id="toggle" role="group" aria-label="language">
      <button data-m="ar" aria-pressed="true">عربي</button><button data-m="en" class="en" aria-pressed="false">English</button>
    </div>
  </header>
  <p class="lead" id="lead"></p>

  <h2 id="clipsH"></h2>
  <div class="tiles" id="tiles"></div>
  <a class="row" id="tour" href="welcome.html"><span class="ic" aria-hidden="true">🎬</span><span class="t"></span><span class="go" aria-hidden="true"></span></a>

  <h2 id="voiceH"></h2>
  <div class="faq" id="faq"></div>

  <section class="contact" id="contact" hidden>
    <h2 id="contactH"></h2>
    <p id="contactLead"></p>
    <a class="wa" id="wa" target="_blank" rel="noopener"><span aria-hidden="true">💬</span><span class="t"></span></a>
  </section>

  <nav class="enter-wrap"><a class="enter" id="enter" href="index.html"></a></nav>
</main>

<script src="afd-core.js?v=b1017a"></script>
<script src="afd-instance.js?v=b1017a"></script>
<script>
const STR = (window.AFDCore && window.AFDCore.STRINGS) || {};
let mode = /[?&]lang=en\b/.test(location.search) ? "en" : "ar";
const W = (k) => { const x = STR[k] || {}; return (mode==="en" ? x.en : (x.ar || x.en)) || ""; };
const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));
// the six clips, in teaching order (same ids and icons as howto.html)
const CLIPS = [["find","🎙️"],["hear","▶️"],["record","➕"],["sentence","💬"],["meaning","💡"],["add","🆕"]];
const FAQ = [1,2,3,4];

// "Ask a person": shown only once afd-instance.js names someone with a WhatsApp number.
function contact(){
  const c = window.AFDInstance && AFDInstance.help && AFDInstance.help.contact;
  const num = c && String(c.whatsapp || "").replace(/\D/g, "");
  return num ? { num, name: (c.name && (c.name[mode] || c.name.ar || c.name.en)) || "" } : null;
}

function render(){
  document.body.classList.toggle("en", mode==="en");
  document.documentElement.setAttribute("dir", mode==="en" ? "ltr" : "rtl");
  document.documentElement.setAttribute("lang", mode);
  document.querySelectorAll("#toggle button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.m===mode)));
  document.getElementById("title").textContent = W("help.title");
  document.getElementById("lead").textContent = W("help.lead");
  document.getElementById("clipsH").textContent = W("help.clips");
  document.getElementById("tiles").innerHTML = CLIPS.map(([id, ic]) =>
    '<a class="tile" href="howto.html#'+id+'"><span class="ic" aria-hidden="true">'+ic+'</span><span class="t">'+esc(W("wt.howto."+id))+'</span></a>').join("");
  document.querySelector("#tour .t").textContent = W("help.tour");
  document.querySelector("#tour .go").textContent = mode==="en" ? "→" : "←";
  document.getElementById("voiceH").textContent = W("help.voice.title");
  document.getElementById("faq").innerHTML = FAQ.map(n =>
    '<details><summary>'+esc(W("help.voice.q"+n))+'</summary><p>'+esc(W("help.voice.a"+n))+'</p></details>').join("");
  const c = contact(), box = document.getElementById("contact");
  box.hidden = !c;
  if(c){
    document.getElementById("contactH").textContent = W("help.contact.title");
    document.getElementById("contactLead").textContent = W("help.contact.lead").replace("{name}", c.name);
    const wa = document.getElementById("wa");
    wa.href = "https://wa.me/" + c.num + "?text=" + encodeURIComponent(W("help.contact.msg"));
    wa.querySelector(".t").textContent = W("help.contact.btn");
  }
  document.getElementById("enter").textContent = W("welcome.enter") + (mode==="en" ? " →" : " ←");
}
document.querySelectorAll("#toggle button").forEach(b => b.onclick = () => { mode = b.dataset.m; render(); });
render();
</script>
</body>
</html>
