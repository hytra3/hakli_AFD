<style>/* ---------------------------------------------------------------- tokens
     Dhofar khareef: monsoon fog, juniper mountain, frankincense resin.
     Deliberately NOT cream + terracotta. */
  :root{
    --fog:#EAF0EE;         /* cool misty background            */
    --cloud:#FFFFFF;       /* raised surfaces                  */
    --mountain:#1F3A34;    /* deep juniper — primary ink       */
    --mist:#8CA39B;        /* muted sage — secondary           */
    --mist-2:#C4D2CC;      /* faint sage — strips, dividers    */
    --resin:#C6873F;       /* frankincense amber — LIVE only   */
    --resin-soft:#E7C9A0;
    --danger:#9E4433;      /* muted clay — erase confirm only  */
    --ink:#17241F;
    --shadow:24px 24px 60px rgba(31,58,52,.10);
    --r:22px;
    --tap:96px;            /* minimum comfortable touch target */
    --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
*{box-sizing:border-box}
html,body{margin:0}
body{
    background:
      radial-gradient(120% 80% at 50% -10%, #F3F7F5 0%, var(--fog) 55%, #DFE8E4 100%) fixed;
    color:var(--ink); font-family:var(--sans);
    -webkit-tap-highlight-color:transparent;
    display:flex; flex-direction:column; min-height:100dvh;
  }
/* ---------------------------------------------------------------- header */
  header{
    position:sticky; top:0; z-index:40;
    display:flex; align-items:center; gap:10px;
    padding:18px 20px calc(20px + env(safe-area-inset-top));
    color:var(--mountain);
    background:#F3F7F5;
    box-shadow:0 2px 10px rgba(31,58,52,.05);
  }
.glyph{width:auto;height:32px;flex:0 0 auto;display:inline-flex;align-items:center;cursor:pointer;color:var(--ink)}
.glyph:focus-visible{outline:2px solid var(--mountain);outline-offset:3px;border-radius:6px}
.glyph svg{height:100%;width:auto;display:block}
.screen{display:flex; align-items:center; gap:9px; min-width:0}
.screen-wrap{position:relative; min-width:0}
#mastScreen{cursor:pointer}
.view-menu{position:absolute; top:calc(100% + 8px); inset-inline-start:0; z-index:60; min-width:230px;
  background:var(--cloud); border:1px solid var(--mist-2); border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.16); padding:6px; display:none}
.view-menu.open{display:block}
.view-menu button{display:flex; align-items:center; gap:10px; width:100%;
  text-align:start; padding:9px 10px; border:0; background:none; font:inherit; font-size:14px;
  color:var(--mountain); border-radius:8px; cursor:pointer}
.view-menu button:hover{background:var(--mist-2)}
.view-menu button[aria-current="true"]{font-weight:600}
.vm-check{flex:0 0 auto; margin-inline-start:auto}
.view-menu .vm-ic{width:22px; height:22px; flex:0 0 auto; display:inline-flex; align-items:center; justify-content:center; color:var(--mountain)}
.view-menu .vm-ic svg{width:100%; height:100%}
.view-menu .vm-t{display:flex; flex-direction:column; line-height:1.12; min-width:0}
.view-menu .vm-t:empty{display:none}
.view-menu .vm-ar{font-family:var(--serif); font-size:15px; direction:rtl; text-align:start}
.view-menu .vm-en{font-family:var(--sans); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--mist); margin-top:1px}
.coverage{display:none; align-items:center; gap:10px; width:calc(100% - 44px); margin:-6px 0 0; color:var(--mist); font-size:12px}
body.browsing.has-results .coverage{display:flex}
.cov-label{flex:0 0 auto; white-space:nowrap; font-variant-numeric:tabular-nums}
.cov-bar{flex:1; height:6px; background:var(--mist-2); border-radius:3px; overflow:hidden; transition:height .25s ease}
.cov-fill{height:100%; width:0; background:var(--mountain); border-radius:3px; transition:width .5s ease}
.vm-sep{height:1px; background:var(--mist-2); margin:5px 4px}
.view-empty{padding:26px 16px; text-align:center; color:var(--mist); font-size:14px}
.screen-ic{width:24px;height:24px;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center}
.screen-ic svg{width:100%;height:100%}
.screen-t{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.screen-ar{font-family:var(--serif); font-size:19px; letter-spacing:.2px; direction:rtl}
.screen-en{color:var(--mist); font-family:var(--sans); font-size:11px; letter-spacing:.12em; text-transform:uppercase; margin-top:2px}
.skin{margin-inline-start:auto; width:42px; height:42px; flex:0 0 auto; border-radius:50%;
        border:1px solid var(--hairline); background:var(--cloud); color:var(--mountain);
        display:grid; place-items:center; cursor:pointer; box-shadow:0 2px 8px rgba(31,58,52,.10)}
.skin svg{width:20px;height:20px}
/* Small Arabic captions under the round header icons — a first-time visitor
   couldn't tell what the page / waveform / person icons did. Arabic in every
   tier (short, Arabic-primary); English stays in each button's title/aria-label. */
.capd{position:relative}
.capd::after{content:attr(data-cap); position:absolute; top:calc(100% + 4px); left:50%; transform:translateX(-50%);
  font:500 10.5px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:#6F8A81; white-space:nowrap;
  pointer-events:none; letter-spacing:0; direction:rtl}

.skin .lbl{font-family:var(--serif); font-size:18px; line-height:1}
.buildstamp{margin-top:auto; padding:14px 0 calc(12px + env(safe-area-inset-bottom)); text-align:center;
        font-family:var(--sans); font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--mist)}
/* ---------------------------------------------------------------- hero */
  main{flex:1; display:flex; flex-direction:column; align-items:center; padding:0 20px 32px}
/* idle: the mic is a centered hero */
  body:not(.has-results) main{justify-content:center}
/* results: everything rides up to the top, mic stays put and shrinks */
  body.has-results main{justify-content:flex-start}
/* the mic + hint live together in a zone that sticks to the top while
     results scroll underneath — so the mic never wanders off-screen and a
     re-tap is always in the same place */
  .control{width:100%; max-width:560px; display:flex; flex-direction:column;
           align-items:center; gap:16px; padding:14px 0 12px;
           position:sticky; top:calc(66px + env(safe-area-inset-top)); z-index:5;
           background:linear-gradient(var(--fog) 74%, rgba(234,240,238,0))}
.stage{position:relative; width:min(66vw,248px); aspect-ratio:1;
         transition:width .35s ease}
body.has-results .stage{width:104px}
/* (10-14) the sticky mic panel hangs from the header like a drawer: rounded at the
   bottom to match the cards' radius, square where it meets the header */
body.has-results .control{background:#F3F7F5; box-shadow:0 8px 14px -8px rgba(31,58,52,.08);
                          border-radius:0 0 var(--r) var(--r)}
.ring{position:absolute; inset:0; border-radius:50%; border:2px solid var(--mist-2);
        opacity:0; transform:scale(.6)}
body.rec .ring{animation:ripple 1.8s ease-out infinite}
.ring:nth-child(2){animation-delay:.6s}
.ring:nth-child(3){animation-delay:1.2s}
@keyframes ripple{0%{opacity:.6;transform:scale(.62)}100%{opacity:0;transform:scale(1.25)}}
.mic{
    position:absolute; inset:0; margin:auto; width:100%; height:100%;
    border:none; border-radius:50%; cursor:pointer; color:var(--cloud);
    background:radial-gradient(120% 120% at 30% 25%, #2C5349 0%, var(--mountain) 70%);
    box-shadow:var(--shadow), inset 0 2px 0 rgba(255,255,255,.14);
    display:grid; place-items:center; transition:transform .18s ease, background .2s ease;
    touch-action:none; user-select:none;
  }
.mic:active{transform:scale(.97)}
body:not(.rec):not(.busy) .mic{animation:breathe 4.5s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
body.rec .mic{background:radial-gradient(120% 120% at 30% 25%, #D89A54 0%, var(--resin) 75%)}
body.busy .mic{background:radial-gradient(120% 120% at 30% 25%, #8CA39B 0%, #6E877E 75%)}
.mic svg{width:38%; height:38%}
/* searching: an amber "sonar ping" so thinking is unmistakably active. The idle
     mic already breathes, so the busy state needs its OWN, louder motion — and
     amber is the app's reserved "live" colour — or "Finding…" reads as frozen.
     The ring pulses while the matcher works and stops the moment results land. */
  .mic::after{ content:""; position:absolute; inset:0; border-radius:50%;
    border:2px solid var(--resin); pointer-events:none; opacity:0; }
body.busy .mic::after{ animation:sonar 1.15s ease-out infinite; }
@keyframes sonar{ 0%{opacity:.6; transform:scale(1)} 100%{opacity:0; transform:scale(1.9)} }
/* live level bloom */
  .bloom{position:absolute; inset:0; margin:auto; border-radius:50%;
         background:radial-gradient(circle, rgba(198,135,63,.32), transparent 62%);
         transform:scale(var(--lvl,0)); transition:transform .08s linear; pointer-events:none}
.hint{font-family:var(--serif); font-size:22px; color:var(--mountain); text-align:center; line-height:1.35}
.hint .ar{display:block; font-size:16px; color:var(--mist); font-family:var(--sans); margin-top:4px}
.hint .ar.solo{display:block; font-size:inherit; color:var(--mountain); font-family:var(--sans); direction:rtl; margin-top:0}
.hint.small{font-size:16px; color:var(--mist)}
/* which failure a search hit, small enough to ignore and legible in a screenshot */
.hint .code{display:block; margin-top:8px; direction:ltr; font:500 10.5px/1 var(--sans);
  letter-spacing:.12em; text-transform:uppercase; color:var(--mist)}
/* ---------------------------------------------------------------- results */
  .results{width:100%; max-width:560px; display:flex; flex-direction:column; gap:10px; margin-top:10px}
/* header account button — sign in to manage your own voice */
  .account{width:40px;height:40px;border-radius:50%;border:1.5px solid var(--mist-2);background:var(--cloud);
      color:var(--mountain);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.account.in{background:var(--mountain);color:var(--cloud);border-color:var(--mountain)}
.account .acct-initial{font:600 16px/1 system-ui,sans-serif}
.account img.acct-photo{width:100%;height:100%;object-fit:cover;border-radius:inherit;display:block}
/* (10-16) a signed-in photo fills the circle — no padding, dark fill or border ring around it */
.account{padding:0; overflow:hidden}
.account:has(> img.acct-photo){background:transparent; border-color:transparent}
.account-wrap{position:relative;flex:0 0 auto}
.acct-menu{position:absolute;top:48px;right:0;z-index:60;min-width:210px;background:var(--cloud);
  border:1px solid var(--mist-2);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.16);padding:6px;display:none}
.acct-menu.open{display:block}
.acct-menu .who{padding:8px 10px;font-size:12px;color:var(--mountain);opacity:.85;
  border-bottom:1px solid var(--mist-2);margin-bottom:4px;word-break:break-word}
.acct-menu button{display:block;width:100%;text-align:start;padding:9px 10px;border:0;background:none;
  font:inherit;font-size:14px;color:var(--mountain);border-radius:8px;cursor:pointer}
.acct-menu button:hover{background:var(--mist-2)}
/* Arabic on its own line, English small beneath (10-16): tHTML's two spans ran
   together ("تسجيل الخروجSign out") with nothing here to stack them */
.acct-menu button .bi-ar{display:block;font-size:15px;line-height:1.35}
.acct-menu button .sub{display:block;font-size:11px;line-height:1.3;opacity:.7;margin-top:1px;text-align:right}
.acct-menu button{min-height:44px}
/* empty / miss — an invitation, not an apology */
  .empty{width:100%; max-width:460px; background:var(--cloud); border-radius:var(--r);
         box-shadow:var(--shadow); padding:26px 22px; text-align:center}
.empty h2{font-family:var(--serif); font-weight:500; font-size:24px; color:var(--mountain); margin:0 0 6px}
.empty p{color:var(--mist); margin:0 0 18px; font-size:15px}
.empty .ar{display:block; direction:rtl; color:var(--mist); font-size:14px; margin-top:4px}
.cta{display:inline-flex; align-items:center; gap:10px; background:var(--resin); color:var(--cloud);
       border:none; border-radius:16px; padding:16px 22px; font:600 16px/1 var(--sans); cursor:pointer; text-decoration:none}
.again{align-self:center; background:transparent; border:none; color:var(--mist);
         font:600 14px/1 var(--sans); padding:12px; cursor:pointer; display:inline-flex; gap:8px; align-items:center}
.banner{max-width:560px; margin:0 auto; background:#FBEFE0; color:#7A5320; border:1px solid var(--resin-soft);
          border-radius:14px; padding:12px 14px; font-size:14px; text-align:center}
.hidden{display:none !important}
/* dev distance readout — off by default, tap the wordmark 3× to reveal */
  .dbg{position:fixed; bottom:8px; left:8px; font:11px/1.4 ui-monospace,monospace; color:var(--mist);
       background:rgba(255,255,255,.7); padding:6px 8px; border-radius:8px; pointer-events:none}
@media (prefers-reduced-motion:reduce){
    *{animation:none !important; transition:none !important}
  }
:focus-visible{outline:3px solid var(--resin); outline-offset:3px}
/* The way back to the list from a word or from search results. It lives IN the
   mic's zone, beside the small mic, because that zone stays put while the page
   scrolls — as a pill above the card it scrolled away (and slid under the mic).
   Chevron + list glyph, with the list's Arabic name beneath, like the header's
   round buttons (the English is in its title / aria-label). */
.control .allbtn{position:absolute; inset-inline-start:0; top:44px;   /* centred on the 104px mic: 14 + (104-44)/2 */
  display:inline-flex; align-items:center; gap:6px; height:44px; margin:0; padding:0 14px 0 10px;
  border:1.5px solid var(--mist-2); border-radius:22px; background:var(--cloud); color:var(--mountain);
  cursor:pointer; box-shadow:0 2px 8px rgba(31,58,52,.10)}
.control .allbtn svg{flex:0 0 auto}
/* "Add a word", always within reach: the mirror of the back control, on the
   mic's other side. The tile atop the list says the same thing but scrolls
   away with it; this stays. Amber and dashed like that tile, so the two read
   as one invitation. Only beside the SMALL mic (the big idle mic fills the zone). */
.control .addbtn{position:absolute; inset-inline-end:0; top:44px; width:44px; height:44px; display:none;
  align-items:center; justify-content:center; border:1.5px dashed var(--resin); border-radius:50%;
  background:var(--cloud); color:var(--resin); text-decoration:none; box-shadow:0 2px 8px rgba(31,58,52,.10)}
body.has-results .control .addbtn{display:inline-flex}
/* inside the rounded panel, keep the side buttons (and their captions) off its edges */
body.has-results .control .allbtn{inset-inline-start:14px}
body.has-results .control .addbtn{inset-inline-end:22px}
/* (10-14) Scrolling the list folds the mic panel into one slim row — small mic,
   its hint beside it, the + still at hand, the coverage meter a thin line along
   the foot — and it opens again back at the top (body.compact, set on scroll).
   Same mic, same place: a search is always one hold away. */
.control{transition:padding .25s ease}
body.compact .control{flex-direction:row; justify-content:center; gap:14px; padding:20px 0 16px}   /* the top ~14px sits under the header */
body.compact .stage{width:52px}
body.compact .control .allbtn, body.compact .control .addbtn{top:24px}   /* centred on the 52px mic: 20 + (52-44)/2 */
body.compact .control .capd::after{display:none}
body.compact .hint{font-size:17px; text-align:start; max-width:calc(100% - 200px)}
body.compact .hint .ar{display:inline; margin:0 0 0 8px; font-size:14px}
body.compact .hint .ar.solo{display:inline; margin:0}
body.compact .hint .code{display:none}
body.compact .coverage{position:absolute; left:22px; right:22px; bottom:6px; width:auto; margin:0}
body.compact .cov-label{display:none}
body.compact .cov-bar{height:3px}
.control .addbtn.capd::after{color:var(--resin)}
/* Typed search (10-15): ⌨ beside the mic, the mirror of the +. Only over the
   whole list (the back control takes that spot over a word or results), and
   never in sound mode. It opens a box in the hint's place that narrows the list
   as you type. The mic stays the way in; this is its quiet sibling. */
.control .typebtn{position:absolute; inset-inline-start:22px; top:44px; width:44px; height:44px; display:none;
  align-items:center; justify-content:center; border:1.5px solid var(--mist-2); border-radius:50%;
  background:var(--cloud); color:var(--mountain); cursor:pointer; padding:0; box-shadow:0 2px 8px rgba(31,58,52,.10)}
body.browsing.has-results:not([data-mode="sound"]) .control .typebtn{display:inline-flex}
body.typing .control .typebtn{background:var(--mountain); border-color:var(--mountain); color:var(--cloud)}
body.compact .control .typebtn{top:24px}
.typebox{display:none; align-items:center; gap:8px; width:calc(100% - 40px); max-width:460px; margin:6px auto 2px;
  background:var(--cloud); border:1.5px solid var(--resin); border-radius:16px; padding:8px 8px 8px 14px;
  box-shadow:0 2px 8px rgba(31,58,52,.06)}
body.typing .typebox{display:flex}
body.typing .hint{display:none}
.typebox svg{flex:0 0 auto; color:var(--mist)}
.typebox input{flex:1; min-width:0; border:0; outline:0; background:transparent; color:var(--ink); font:20px/1.3 var(--sans)}
.typebox input::placeholder{color:var(--mist); font-size:15px}
.typebox input::-webkit-search-cancel-button{display:none}
.typebox .typex{flex:0 0 auto; width:36px; height:36px; border:0; border-radius:50%; background:transparent; color:var(--mist);
  font-size:22px; line-height:1; cursor:pointer}
.typecount{display:none; margin:2px 0 6px; font:13px/1.3 var(--sans); color:var(--mist); text-align:center}
body.typing .typecount{display:block}
.typecount a{color:var(--resin); font-weight:600}
body.compact .typebox{width:auto; flex:1; max-width:calc(100% - 200px); margin:0}
body.compact .typecount{display:none}
/* growable dictionary: an explicit "add a word" tile atop browse, and a quiet
     escape hatch under search candidates for a real new word that looked near one */
  .addword{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:460px;
    margin:0 auto 12px;border:1.5px dashed var(--resin);border-radius:16px;background:transparent;
    color:var(--resin);font:600 15px/1 var(--sans);padding:14px 18px;cursor:pointer}
.addword:hover{background:var(--resin-soft)}
  .addword.askwords{border:1.5px solid var(--mist-2); color:var(--mountain); font-weight:500}
  .addword.askwords:hover{background:var(--cloud)}
.notthese{display:block;margin:14px auto 4px;background:transparent;border:none;color:var(--mist);
    font:600 14px/1.3 var(--sans);padding:10px 12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

  .loadingdots{display:flex;gap:9px;justify-content:center;padding:48px 0}
  .list-more .loadingdots{padding:20px 0}   /* the foot of a list still filling in (10-19) */
  .loadingdots span{width:11px;height:11px;border-radius:50%;background:var(--resin);animation:ld 1s ease-in-out infinite}
  .loadingdots span:nth-child(2){animation-delay:.15s}
  .loadingdots span:nth-child(3){animation-delay:.3s}
  /* (10-15) the same bouncing dots in the mic panel while a search is on its
     way: through the matcher's answer (body.busy) and on until the first card
     is drawn (body.rendering) — the gap that used to show a hint over nothing */
  .waitdots{display:none; padding:14px 0 4px}
  body.busy .waitdots, body.rendering .waitdots{display:flex}
  body.compact .waitdots{padding:0}
  @keyframes ld{0%,100%{opacity:.35;transform:translateY(0)}50%{opacity:1;transform:translateY(-7px)}}
</style>
</head>

<script type="module">
/* ---- fold the mic panel while the list scrolls (10-14) ----
   Compact past a short scroll, full again at the very top. A pause after each
   switch, and only folding when the page would still scroll afterwards, keeps
   it from flickering at the edge (the panel's height change moves the page). */
{
  let lockUntil = 0;
  const set = (on)=>{ if(document.body.classList.contains("compact") === on) return;
    document.body.classList.toggle("compact", on); lockUntil = Date.now() + 350; };
  const onScroll = ()=>{
    const b = document.body;
    if(!b.classList.contains("has-results")){ set(false); return; }
    if(Date.now() < lockUntil) return;
    const y = window.scrollY || 0;
    if(!b.classList.contains("compact")){
      if(y > 24 && document.documentElement.scrollHeight - innerHeight > 320) set(true);
    } else if(y <= 2) set(false);
  };
  addEventListener("scroll", onScroll, { passive:true });
  addEventListener("resize", onScroll, { passive:true });
}
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { startAppCheck, appCheckHeaders } from "./afd-appcheck.js?v=b1020a";
import { getFirestore, initializeFirestore, persistentLocalCache, persistentMultipleTabManager, doc, getDoc, setDoc, serverTimestamp, updateDoc, collection, query, where, limit, getDocs, addDoc, Timestamp }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getStorage, ref, getDownloadURL }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";
import { getAuth, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { initCard, entryCard, primeCounts, primeAllSpellings, spellingsFor, slotSection, playVoiceInto, setConsent, voiceAvatarBtn, buildVoiceRow, buildVoices, entryCounts, listPlayable, envelopeFor, downsampleEnv, boxBars, paintBox, applyBox, faunaAvatar, domainColor, playInto, hashInt, escapeHtml } from "./afd-card.js?v=b1020a";
import { signInSheet, finishEmailLink } from "./afd-signin.js?v=b1020a";


/* ================================================================= CONFIG */
/* Same afd-dev project the recorder uses. Web keys identify a project;
   they authorise nothing — security lives in the rules. */
const firebaseConfig = window.AFDInstance.firebase;   // afd-instance.js

/* >>> PASTE YOUR CLOUD RUN URL (no trailing slash) <<< */
const EMBED_URL = window.AFDInstance.embedUrl;   // afd-instance.js

/* ---- pre-warm the matcher -------------------------------------------------
   Normally afd-embed runs at min-instances=0 (scripts/set-warm.sh off), so it
   costs nothing while idle but pays a cold start on the first search after it
   scales to zero: container boot + MMS model load + corpus load — measured at
   60–80 s on 2026-10-10, not the few seconds first assumed. For field weeks,
   `set-warm.sh on` keeps one instance up and this warm-up becomes a harmless
   no-op. We soften that by firing ONE throwaway /search the moment the find
   page loads — the instance boots and fully warms (this endpoint loads the
   corpus AND the model on the way through) while the person is still getting
   oriented. It is a head start, not a guarantee: a search spoken inside that
   minute still waits (runSearch says so, and rides it out).

   The clip is a ~0.25s 16 kHz mono WAV synthesised in-browser: valid for the
   container's ffmpeg decode, non-silent so it survives the empty-audio guard,
   and tiny. Fire-and-forget: the result is discarded and any failure is
   swallowed — a warm-up that fails must never surface to the user. Runs once
   per page load. (Note: /healthz can't be used to warm — Cloud Run intercepts
   it before the container; only a real endpoint like /search boots the app.) */
(function prewarmMatcher(){
  if(!EMBED_URL || EMBED_URL.includes("PASTE-")) return;
  try{
    const sr=16000, n=Math.floor(sr*0.25), bytes=44+n*2;
    const view=new DataView(new ArrayBuffer(bytes));
    const put=(o,s)=>{ for(let i=0;i<s.length;i++) view.setUint8(o+i, s.charCodeAt(i)); };
    put(0,"RIFF"); view.setUint32(4,bytes-8,true); put(8,"WAVE"); put(12,"fmt ");
    view.setUint32(16,16,true); view.setUint16(20,1,true); view.setUint16(22,1,true);
    view.setUint32(24,sr,true); view.setUint32(28,sr*2,true);
    view.setUint16(32,2,true); view.setUint16(34,16,true); put(36,"data"); view.setUint32(40,n*2,true);
    for(let i=0;i<n;i++) view.setInt16(44+i*2, Math.round(Math.sin(i/8)*200), true); // faint, non-zero
    const fd=new FormData();
    fd.append("file", new Blob([view.buffer],{type:"audio/wav"}), "warm.wav");
    // with the App Check token too, or every page open counts as "missing" (10-20)
    appCheckHeaders().then(headers=> fetch(`${EMBED_URL}/search?top_k=1`, {method:"POST", body:fd, headers}))
      .then(()=>console.log("[AFD] matcher pre-warmed"))
      .catch(()=>{});   // silent — a failed warm-up is not the user's problem
  }catch(_){}
})();

/* Confidence gates on cosine distance. PLACEHOLDERS — recalibrate once
   real cross-speaker data exists. Within-speaker self-repeats sat at
   0.14–0.25 in testing, so cross-speaker "same word" will be a bit higher. */
const BUILD = "b1020a";      // bump every publish; shown in the wordmark + console

/* Confidence gates. Recalibrated from real measured distances (the old
   0.35/0.60 were placeholders; live queries land ~0.08–0.20). These absolutes
   are first estimates off a tiny corpus — tune as the corpus grows. The MARGIN
   gate is the robust part: it's scale-independent, so a near-tie never autoplays
   as certainty even when the absolute distance looks small (e.g. deer 0.148 vs
   camel 0.149 — a 0.001 gap — should be "did you mean", not "here it is"). */
const AUTOPLAY_MAX = 0.15;   // top hit must be at least this close…
const MAYBE_MAX    = 0.25;   // …and anything past this isn't shown as a candidate
const MARGIN_MIN   = 0.03;   // …AND must beat the runner-up by this much to autoplay
                             // >  this OR no results: nobody has said it → be first
const RECORDER_URL = "recorder.html";  // where "say it yourself" goes

/* How the box shows a word. Default is chosen for us so a non-reader does nothing;
   the small header control changes it. Stored locally — no account needed. */
const MODES = AFDCore.DISP_MODES;          // shared with the recorder via afd-core
let displayMode = AFDCore.getDisplayMode("sound");   // find defaults to sound (non-reader-first)
let lastResults = null;
let renderToken = 0;   // guards against two async renders racing to append
let deepEntry  = null; // set when the view is a chosen entry (index.html#ent_xxx)
function setDisplayMode(m){ displayMode = m; AFDCore.setDisplayMode(m); }

/* ================================================================= setup */
const app   = initializeApp(firebaseConfig);
startAppCheck(app);              // App Check (10-19): tokens on every request; nothing blocked yet
/* Offline word list (10-17): keep what this phone has read on the phone, so the
   dictionary opens from the last visit when there's no signal (Khor Kharfot, the
   jebel) instead of a bare list of the seeded words. Online nothing changes:
   Firestore still asks the server first, and the copy is refreshed as it goes.
   A field error logged offline is also kept, and sent when signal returns.
   Dictionary page ONLY, on purpose: what it reads is public (words, public
   voices, public profiles) plus the viewer's own takes, which it only asks for
   while that account is signed in. The recorder and Add read speaker details
   (town, tribe…) that must not sit in a shared phone's storage after sign-out.
   Private browsing / blocked storage: Firestore falls back to memory by itself;
   the try/catch covers an SDK that can't do it at all. */
let db;
try{ db = initializeFirestore(app, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) }); }
catch(e){ console.warn("[AFD] offline cache unavailable", e); db = getFirestore(app); }
const store = getStorage(app);
const auth  = getAuth(app);
// field error log — AFDCore.report() writes here (afd_client_errors: create-only,
// stewards read, deleted 30 days on by TTL; scripts/client-errors.mjs lists them)
AFDCore.errorSink(rec => addDoc(collection(db, "afd_client_errors"),
  Object.assign({}, rec, { at: serverTimestamp(), expireAt: Timestamp.fromMillis(Date.now() + 30*864e5) })));
// usage counts — AFDCore.track() writes here (afd_events: create-only, no uid,
// stewards read, deleted 90 days on by TTL; the nightly digest keeps day totals)
AFDCore.eventSink(rec => addDoc(collection(db, "afd_events"),
  Object.assign({}, rec, { at: serverTimestamp(), expireAt: Timestamp.fromMillis(Date.now() + 90*864e5) })));
// an email sign-in link that came back to the dictionary (signInSheet → email link)
finishEmailLink(auth, { label: (k)=> AFDCore.tHTML(k, "auto") });
let currentUser = null;   // shared per-origin session — a speaker who signed in on the recorder is recognised here
// A *named* account, not the anonymous key the find flow may already hold.
// This mirrors notAnon() in afd-firestore.rules: anonymous can read (search
// works) but cannot create entries/recordings, so the UI must gate writes on
// this, not on mere presence of a session — otherwise we skip the Google
// sign-in and walk straight into a permission-denied.
const isRealUser = () => !!currentUser && !currentUser.isAnonymous;
initCard({ db, store, recorderUrl: RECORDER_URL, mode:()=>displayMode, user:()=>currentUser, banner });

const $ = id => document.getElementById(id);
const allBtn = $("allBtn");
allBtn.addEventListener("click", ()=>{ cancelSearch(); showAll(); });   // also the way out of a search still in flight
const mic = $("mic"), hint = $("hint"), resultsEl = $("results"),
      bloom = $("bloom"), dbg = $("dbg");

/* --------- optional spoken hint (plays a recorded Hakli UI prompt if one
   has been captured; silently skipped if not). It's volunteered NARRATION, so
   quiet mode holds it back — checked before the fetch, and again at play time
   (playUI) in case quiet was switched on while it loaded. */
tryPlayPrompt("find_hint");
async function tryPlayPrompt(key){
  if(!AFDCore.mayPlayUI("narration")) return;
  try{
    const s = await getDoc(doc(db, "afd_ui_prompts", key));
    if(!s.exists()) return;
    const d = s.data();
    const path = d.storagePath || d.path;
    if(!path) return;
    const url = await getDownloadURL(ref(store, path));
    AFDCore.playUI(url, "narration");                 // autoplay may be blocked; that's fine
  }catch(_){/* no prompt yet */}
}

/* ================================================================= capture */
let mediaRec=null, chunks=[], stream=null, ac=null, holding=false, acquiring=false;

// Acquire the mic ONCE and keep it warm for the session. Re-acquiring on every
// hold races the getUserMedia permission/warm-up delay — a quick press-speak-
// release can finish before the recorder is even ready, so the clip is empty
// ("hold a little longer"). Worst in a fresh/incognito session where the mic is
// cold. The stream is released when the tab is hidden or closed.
async function ensureStream(){
  if(stream) return stream;
  if(acquiring) return null;
  acquiring=true;
  try{
    // Query capture and corpus capture now share one protocol (afd-core openStream),
    // so the query can't drift into a different acoustic space than the corpus.
    const r = await AFDCore.openStream();
    stream = r.stream;
  }catch(e){ acquiring=false; return null; }
  acquiring=false;
  return stream;
}
function stopStream(){
  if(stream){ stream.getTracks().forEach(t=>t.stop()); stream=null; }
  if(ac){ ac.close().catch(()=>{}); ac=null; }
}

async function startHold(){
  if(holding) return; holding=true;
  closeTyping();                       // speaking replaces typing
  cancelSearch();                      // pressing the mic again abandons a search still in flight
  resultsEl.classList.add("hidden");
  let s = await ensureStream();
  // A warm stream can go stale — the browser/OS ends the track between holds —
  // and reusing a dead track makes MediaRecorder.start() throw NotSupportedError.
  // Drop a stream with no live track and re-acquire a fresh one.
  if(s && !s.getAudioTracks().some(t=>t.readyState==="live")){ stopStream(); s = await ensureStream(); }
  // Each early way out below puts the list back (showResults): the hold hid it,
  // and without a search nothing else would — a blank page with no way on.
  if(!s){ holding=false; setHintKey("find.mic"); showResults(); return; }
  if(!holding){ showResults(); return; }   // released during acquisition — stream stays warm for the next hold
  document.body.classList.add("rec"); setHintKey("find.listening");
  setMastView("find");                 // the header follows: this is speak-to-find from the first moment of the hold
  meter(s);
  chunks=[];
  try{ mediaRec = new MediaRecorder(s); }
  catch(e){ holding=false; stopStream(); setHintKey("find.idle"); showResults(); return; }
  mediaRec.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
  mediaRec.onstop = onClip;
  try{ mediaRec.start(100); }   // 100ms timeslice: flush data during the hold, not only on stop
  catch(e){
    // Stream became unrecordable — force a fresh one on the next hold rather than
    // leaving an uncaught rejection and a dead-feeling button.
    holding=false; document.body.classList.remove("rec"); stopStream();
    setHintKey("find.idle"); showResults();
  }
}
function endHold(){
  if(!holding) return; holding=false;
  document.body.classList.remove("rec");
  bloom.style.setProperty("--lvl",0);
  if(mediaRec && mediaRec.state!=="inactive") mediaRec.stop();
  if(ac){ ac.close().catch(()=>{}); ac=null; }
}
function meter(stream){
  try{
    ac = new (window.AudioContext||window.webkitAudioContext)();
    const src=ac.createMediaStreamSource(stream), an=ac.createAnalyser();
    an.fftSize=256; src.connect(an); const buf=new Uint8Array(an.frequencyBinCount);
    (function loop(){
      if(!holding) return;
      an.getByteTimeDomainData(buf);
      let peak=0; for(const v of buf){ const d=Math.abs(v-128)/128; if(d>peak)peak=d; }
      bloom.style.setProperty("--lvl", (0.4+peak*2.2).toFixed(2));
      requestAnimationFrame(loop);
    })();
  }catch(_){}
}

async function onClip(){
  // keep the stream warm for the next hold — do NOT stop it here
  const blob = new Blob(chunks, {type: chunks[0]?.type || "audio/webm"});
  if(blob.size < 800){ setHintKey("find.short"); showResults(); return; }
  await runSearch(blob);
}

// release the mic when the tab is hidden or closed
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) stopStream(); });
window.addEventListener("pagehide", stopStream);

// Pre-warm the mic on load IF permission is already granted, so the first hold
// records immediately instead of losing a cold getUserMedia race (empty clip →
// "hold a little longer"). No prompt when permission isn't granted yet.
(async ()=>{
  try{
    const p = await navigator.permissions.query({name:"microphone"});
    if(p.state === "granted" && !document.hidden) ensureStream();
  }catch(_){}
})();

/* ================================================================= search */
/* A search can fail in different places, and each calls for something different
   from the person holding the phone — so the page says WHICH (and shows a small
   code a screenshot can carry), instead of one catch-all line:
     offline  the phone has no connection                       → no retry
     network  the request never got an answer (dropped signal, or the service
              died before replying — the browser can't tell these apart)
     timeout  no answer within the limit (a cold matcher takes 60–80 s)
     server   the matcher answered with an error (5xx / 429 / anything else)
     audio    it couldn't decode the clip (400)                  → no retry
     toolong  the clip was over the limit (413)                  → no retry
   network / timeout / server are retried ONCE, automatically. The first try is
   given long enough to ride out a cold start; by the retry the matcher is warm,
   so that one is short. */
const SEARCH_TIMEOUT_MS = [120000, 60000];   // per attempt
const SEARCH_SLOW_MS    = 6000;              // past this, say it is still looking
const SEARCH_RETRY_MS   = 1500;              // pause before the one retry
const SEARCH_RETRYABLE  = new Set(["network","timeout","server"]);
const SEARCH_ERR_KEY    = { offline:"find.err.offline", network:"find.err.network", timeout:"find.err.timeout",
                            server:"find.err.server", audio:"find.err.audio", toolong:"find.err.toolong" };
class SearchError extends Error{
  constructor(kind, code){ super(code); this.kind=kind; this.code=code; }
}
let searchSeq = 0, searchAbort = null;   // the search on screen; a newer hold or Home supersedes it

/* Keep the screen on while a search is in flight. A cold matcher takes a minute
   or more; if the phone dims and sleeps during that wait the browser drops the
   request, and the answer — already on its way — never arrives. (That is the
   likeliest cause of the "Couldn't reach the matcher" of 2026-10-10.) Held only
   while searching; released the moment the search ends, is superseded, or the
   page is hidden. Where the browser has no wake lock, nothing changes. */
let wakeLock = null, wantAwake = false, wakeAsking = false;
async function holdScreenAwake(){
  wantAwake = true;
  if(wakeLock || wakeAsking || !("wakeLock" in navigator)) return;   // one lock, one request at a time
  wakeAsking = true;
  try{
    const l = await navigator.wakeLock.request("screen");
    if(!wantAwake){ l.release().catch(()=>{}); return; }       // the search ended while we were asking
    wakeLock = l;
    l.addEventListener("release", ()=>{ if(wakeLock===l) wakeLock=null; });   // the browser lets go when the page is hidden
  }catch(_){ /* refused (battery saver, not visible) — carry on without */ }
  finally{ wakeAsking = false; }
}
function letScreenSleep(){
  wantAwake = false;
  const l = wakeLock; wakeLock = null;
  if(l){ try{ l.release().catch(()=>{}); }catch(_){} }
}
// coming back to the page mid-search: the browser dropped the lock, take it again
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && wantAwake) holdScreenAwake(); });

/* Drop any search still in flight — the mic was pressed again, or the person
   went Home. Its answer, if one ever comes, is ignored. */
function cancelSearch(){
  searchSeq++;
  if(searchAbort){ try{ searchAbort.abort(); }catch(_){} searchAbort=null; }
  document.body.classList.remove("busy");
  letScreenSleep();
}

async function searchOnce(blob, timeoutMs){
  if(navigator.onLine === false) throw new SearchError("offline","offline");
  const ctl = new AbortController(); searchAbort = ctl;
  let timedOut = false;
  const timer = setTimeout(()=>{ timedOut = true; ctl.abort(); }, timeoutMs);
  try{
    const fd = new FormData(); fd.append("file", blob, "query.webm");
    const r = await fetch(`${EMBED_URL}/search?top_k=6`, {method:"POST", body:fd, signal:ctl.signal, headers: await appCheckHeaders()});
    if(!r.ok){
      const kind = r.status===400 ? "audio" : r.status===413 ? "toolong" : "server";
      throw new SearchError(kind, "http "+r.status);
    }
    return await r.json();
  }catch(e){
    if(e instanceof SearchError) throw e;
    if(timedOut) throw new SearchError("timeout","timeout");
    if(navigator.onLine === false) throw new SearchError("offline","offline");
    throw new SearchError("network","network");       // fetch rejected, or the reply wasn't readable
  }finally{
    clearTimeout(timer);
    if(searchAbort === ctl) searchAbort = null;
  }
}

async function runSearch(blob){
  cancelSearch();                                      // only one search at a time
  const my = searchSeq, t0 = Date.now();
  document.body.classList.add("busy"); setHintKey("find.finding");
  if(EMBED_URL.includes("PASTE-")){
    banner("Set EMBED_URL to your Cloud Run address in index.html.");
    document.body.classList.remove("busy"); setHintKey("find.idle"); showResults(); return;
  }
  // A cold matcher can take a minute. Say so, or "Finding…" reads as frozen and
  // the person gives up — or lets the screen sleep, which drops the request.
  holdScreenAwake();
  const slow = setTimeout(()=>{ if(my===searchSeq) setHintKey("find.waking"); }, SEARCH_SLOW_MS);
  let data = null, err = null;
  for(let attempt=0; attempt<2; attempt++){
    try{ data = await searchOnce(blob, SEARCH_TIMEOUT_MS[attempt]); err = null; break; }
    catch(e){
      err = e;
      if(my!==searchSeq) break;                        // superseded — say nothing
      console.warn("[AFD] search attempt "+(attempt+1)+" failed:", e.code);
      if(attempt===0 && SEARCH_RETRYABLE.has(e.kind)){
        setHintKey("find.retrying");
        await new Promise(res=>setTimeout(res, SEARCH_RETRY_MS));
        if(my!==searchSeq) break;
        continue;
      }
      break;
    }
  }
  clearTimeout(slow);
  if(my!==searchSeq) return;                           // a newer hold, or Home, took over
  document.body.classList.remove("busy");
  letScreenSleep();
  if(err){
    // Name the failure, and put back whatever was on screen before the hold
    // (the list, or the last results) — a failed search must not leave a blank
    // page with no way on.
    setHintKey(SEARCH_ERR_KEY[err.kind] || "find.err.network", err.code);
    AFDCore.report("search", err);               // field error log (afd-core)
    AFDCore.track("search", "err." + (err.kind || "network"), { n: Date.now() - t0 });
    showResults(); return;
  }
  const results = (data.results||[]);
  AFDCore.track("search", searchOutcome(results), { n: Date.now() - t0 });   // usage counts: here / pick / none
  console.log("[AFD] corpus", data.corpus_n, "· age", data.corpus_age_s, "s ·", results.map(r=>`${r.entryId}:${r.distance}`).join("  "));
  showDbg(results, data.corpus_n);
  // Results are a step over the list in the browser history, so the phone's Back
  // button returns to the list instead of leaving the app. (A second search from
  // the results replaces them — one step, not a pile.)
  rememberResults(results);
  clearEntryHash();                              // searching from a linked word: the list is what's underneath now
  if(steps.top()!=="results") steps.push("results");
  await render(results);
}

/* The last results, kept for this tab: coming Back from the recorder (a fresh
   page load) or going Forward again can show them without a new search. */
const RESULTS_KEY = "afd_results";
function rememberResults(r){ try{ sessionStorage.setItem(RESULTS_KEY, JSON.stringify(r)); }catch(_){} }
function recallResults(){
  try{ const r = JSON.parse(sessionStorage.getItem(RESULTS_KEY) || "null"); return Array.isArray(r) ? r : null; }
  catch(_){ return null; }
}
const steps = AFDCore.stepHistory((step)=>{
  if(location.hash) return;                      // landed on an #ent_ link — hashchange opens it
  const r = step==="results" ? recallResults() : null;
  if(r){ cancelSearch(); render(r, true); } else showAll();
});

/* How a search came out, by the same thresholds render() uses below:
   "here" (confident — the lead card plays), "pick" ("Is it one of these?"),
   "none" (nothing close enough). Counted, never with the word itself. */
function searchOutcome(results){
  const best = results[0];
  if(!best || best.distance > MAYBE_MAX) return "none";
  const second = results[1];
  const margin = second ? (second.distance - best.distance) : Infinity;
  return (best.distance <= AUTOPLAY_MAX && margin >= MARGIN_MIN) ? "here" : "pick";
}

async function render(results, quiet){   // quiet: a return to old results (Back / Forward) — don't autoplay again
  stopBatches();                                   // a list still filling in, replaced
  const my = ++renderToken; deepEntry = null;
  lastResults = results; setMastView("find");
  resultsEl.innerHTML=""; setBrowsing(false); hint.classList.add("small");
  paintAllBtn(true); reskinPending = false;
  const best = results[0];

  if(!best || best.distance > MAYBE_MAX){ renderEmpty(best); return; }

  const second = results[1];
  const margin = second ? (second.distance - best.distance) : Infinity;
  const confident = best.distance <= AUTOPLAY_MAX && margin >= MARGIN_MIN;
  console.log("[AFD] best", best.distance, "margin", (margin===Infinity?"∞":margin.toFixed(3)), "→", confident?"confident":"maybe");
  setHintKey(confident ? "result.here" : "result.pick");

  // lead card — the wait dots stay up until it is on screen
  document.body.classList.add("rendering");
  let lead;
  try{ lead = await entryCard(best, true); }
  finally{ if(my===renderToken) document.body.classList.remove("rendering"); }
  if(my!==renderToken) return;                 // a newer render/open superseded us
  if(!lead.removed) resultsEl.appendChild(lead.el);   // removed by its creator: search catches up on its next reload
  resultsEl.classList.remove("hidden"); document.body.classList.add("has-results");   // show it now, not after the rest
  // the rest
  for(const res of results.slice(1)){
    if(res.distance > MAYBE_MAX) break;
    const c = await entryCard(res, false);
    if(my!==renderToken) return;
    if(!c.removed) resultsEl.appendChild(c.el);
  }
  // A genuinely new word can look acoustically near an existing entry (e.g. two
  // Hakli words sharing one English gloss), so never force it into a candidate —
  // always offer the way out to mint a new entry instead.
  const alt=document.createElement("button");
  alt.className="notthese";
  alt.textContent=AFDCore.t("entry.notthese", displayMode);
  alt.addEventListener("click", startNewEntry);
  resultsEl.appendChild(alt);
  resultsEl.classList.remove("hidden"); document.body.classList.add("has-results");

  if(confident && lead.firstPlayable && !quiet){ playInto(lead.playBtn, lead.firstPlayable); }
}

/* Open a specific entry directly — the dictionary links here as index.html#ent_xxx.
   Same card render as a confident search hit, but chosen rather than spoken. No
   autoplay: the user navigated deliberately, so let them pick a voice. */
async function openEntry(entryId){
  stopBatches();                                   // a list still filling in, replaced
  const my = ++renderToken; deepEntry = entryId;
  lastResults = [{entryId, distance:0}]; setMastView("dictionary");   // a word opened by link is the dictionary, not a search
  resultsEl.innerHTML=""; setBrowsing(false); hint.classList.add("small");
  setHintKey("result.here");
  document.body.classList.add("rendering");
  let lead;
  try{ lead = await entryCard({entryId, distance:0}, true); }
  finally{ if(my===renderToken) document.body.classList.remove("rendering"); }
  if(my!==renderToken) return;                 // superseded by a newer render/open
  if(lead.missing){
    // A mistyped or cut-off link: there is no such word. Say so over the whole
    // dictionary, rather than a blank card that says "Here it is" and offers to
    // record it.
    clearEntryHash(); await renderBrowse(); if(renderToken===my+1) setHintKey("find.missing");
    return;
  }
  resultsEl.innerHTML="";                       // clear again in case of a race
  paintAllBtn(true); reskinPending = false;
  if(lead.removed){
    // an old link to a word its creator removed: say so, not the stale card
    const g=AFDCore.STRINGS["card.removed.gone"];
    setHint(g.en, g.ar);
  }else resultsEl.appendChild(lead.el);
  resultsEl.classList.remove("hidden"); document.body.classList.add("has-results");
}
function applyEntryDeepLink(){
  const raw = (location.hash||"").replace(/^#/,"");
  if(!raw) return false;
  let id=""; try{ id=decodeURIComponent(raw).trim(); }catch(_){ id=raw.trim(); }
  if(!id) return false;
  openEntry(id); return true;
}

/* build one entry card: thumbnail, gloss, voice silhouettes, speaker avatars */


/* ---- browse: the dictionary as a scrolling list of the SAME entry cards --------
   Idle state lists every entry as a collapsed card; tapping expands it in place
   (detail loads lazily for that one entry). Same card whether reached by speaking
   or scrolling — one renderer, one behaviour. */
/* The back control in the mic's zone (#allBtn). It names the list it returns to
   — the active view — and is shown only when there is a list to go back to:
   over a word or search results, not over the list itself. */
function paintAllBtn(show){
  const v = VIEWS.find(x=>x.id===currentView) || VIEWS[0];
  allBtn.innerHTML=`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>`+
    `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>`;
  allBtn.setAttribute("aria-label", AFDCore.tf("list.back", displayMode, { w: (displayMode!=="auto" && v.ar) || v.en })); allBtn.title = v.en;
  allBtn.setAttribute("data-cap", v.ar);
  allBtn.classList.toggle("hidden", !show);
}
/* Back to the whole list, leaving nothing of the last view behind: the address
   drops its #ent_… (or a reload — or a re-share — would snap back to that word)
   and the hint returns to idle (or "Here it is" sits over the full list). */
function clearEntryHash(){
  if(!location.hash) return;
  try{ history.replaceState(null, "", location.pathname + location.search); }catch(_){}
  steps.sync();
}
function setIdleHint(){ hint.classList.remove("small"); setHintKey("find.idle"); }
function showAll(){
  if(steps.top()==="results") steps.back();     // leaving results by a button: take their history step with them
  clearEntryHash(); setIdleHint(); return renderBrowse();
}
/* coverage meter: how many words already have a spoken recording, as a glanceable
   goal that shrinks the wall of zeros into progress. */
// The coverage meter sits in the mic panel (static markup) and shows only while
// the whole list is on screen: body.browsing, set when renderBrowse paints and
// cleared by anything else that takes over the results (10-14).
function setBrowsing(on){ document.body.classList.toggle("browsing", !!on); if(!on) closeTyping(); }

/* ---- typed search (10-15) ------------------------------------------------
   The ⌨ beside the mic opens a box in the hint's place; each keystroke narrows
   the list on screen. A word matches when what's typed appears in any of its
   spellings, its Arabic or its English, all folded the same forgiving way
   (AFDCore.spellingKey: vowel marks, alef forms, ى/ي, ة/ه … don't matter).
   Nothing leaves the phone: it filters the list already loaded. */
let typing = false, typed = "", browseItems = null;
const typeBtn = $("typeBtn"), typeBox = $("typeBox"), typeIn = $("typeIn"), typeCount = $("typeCount");
function itemKeys(it){
  if(!it._keys) it._keys = spellingsFor(it.entryId).then(list => {
    const K = AFDCore.spellingKey, m = it.meta || {};
    const keys = [K(m.gloss || ""), K(m.glossAr || "")];
    for(const x of list || []) if(!x.hidden) keys.push(K(x.text));
    return keys.filter(Boolean);
  }).catch(() => []);
  return it._keys;
}
let typedLast = null;   // matches for the last thing typed — counted on close, never the text itself
async function applyTyped(){
  if(!browseItems) return;
  const q = AFDCore.spellingKey(typed), mine = typed;
  const ask = resultsEl.querySelector(".askwords"), empty = resultsEl.querySelector(".view-empty");
  if(!q){
    browseItems.forEach(it => { it.card.el.style.display = ""; });
    if(ask) ask.style.display = ""; if(empty) empty.style.display = "";
    typeCount.textContent = "";
    return;
  }
  if(listRest.length) moreCards(true);             // every word on the page, so every match can show
  const keys = await Promise.all(browseItems.map(itemKeys));
  if(mine !== typed || !typing) return;            // a newer keystroke (or a close) won
  let n = 0;
  browseItems.forEach((it, i) => { const hit = keys[i].some(k => k.includes(q)); it.card.el.style.display = hit ? "" : "none"; if(hit) n++; });
  typedLast = n;                                   // counted once, when the typing closes (usage counts)
  if(ask) ask.style.display = "none"; if(empty) empty.style.display = "none";
  typeCount.innerHTML = n ? escapeHtml(AFDCore.tf("find.type.count", displayMode, { n }))
                          : `<a href="add.html">${escapeHtml(AFDCore.t("find.type.none", displayMode))}</a>`;
}
function paintTypeLabels(){
  const L = AFDCore.t("find.type", displayMode);
  typeBtn.title = L; typeBtn.setAttribute("aria-label", L);
  typeIn.placeholder = AFDCore.t("find.type.ph", displayMode); typeIn.setAttribute("aria-label", L);
  $("typeX").setAttribute("aria-label", AFDCore.t("find.type.close", displayMode));
  if(window.afdCap) window.afdCap(typeBtn, "find.type.cap");
}
function openTyping(){
  if(typing){ typeIn.focus(); return; }
  typing = true; document.body.classList.add("typing"); typeBtn.setAttribute("aria-pressed", "true");
  paintTypeLabels(); typeIn.value = typed; typeIn.focus(); applyTyped();
}
function closeTyping(){
  if(!typing) return;
  if(typed && typedLast != null) AFDCore.track("typed", typedLast ? "hits" : "none", { n: typedLast });
  typedLast = null;
  typing = false; typed = ""; typeIn.value = "";
  document.body.classList.remove("typing"); typeBtn.setAttribute("aria-pressed", "false");
  applyTyped();
}
typeBtn.addEventListener("click", () => { if(typing) closeTyping(); else openTyping(); });
$("typeX").addEventListener("click", () => { closeTyping(); typeBtn.focus(); });
typeIn.addEventListener("input", () => { typed = typeIn.value; applyTyped(); });
typeIn.addEventListener("keydown", (e) => {
  if(e.key === "Escape"){ e.stopPropagation(); closeTyping(); typeBtn.focus(); }
  if(e.key === "Enter"){ e.preventDefault(); typeIn.blur(); }      // close the phone keyboard, keep the results
});
function setCoverage(withVoice, total){
  const el=$("coverage"); if(!el) return;
  const pct = total ? Math.round(withVoice/total*100) : 0;
  const lbl=el.querySelector(".cov-label"), fill=el.querySelector(".cov-fill");
  if(lbl) lbl.textContent = withVoice+" / "+total + (displayMode==="auto" ? "  with a voice" : "");
  if(fill) fill.style.width = pct+"%";
}

/* The list in batches (10-19). Past LIST_BATCH_AFTER words, cards go onto the
   page LIST_BATCH at a time as the list scrolls near its end (a marker at the
   foot, watched by an IntersectionObserver), instead of all at once — a phone
   with hundreds of words otherwise lays out and paints every card before the
   list can scroll. The cards themselves are all made up front (cheap: just their
   heads), so everything that works on the list still sees every word; typed
   search puts the rest on the page first, so every match can show. */
const LIST_BATCH = 60, LIST_BATCH_AFTER = 150;
let listRest = [], listIO = null;
function stopBatches(){ if(listIO){ try{ listIO.disconnect(); }catch(_){} listIO = null; } listRest = []; }
function moreCards(all){
  const mark = resultsEl.querySelector(".list-more");
  const take = all ? listRest.splice(0) : listRest.splice(0, LIST_BATCH);
  const frag = document.createDocumentFragment();
  take.forEach(it => frag.appendChild(it.card.el));
  if(mark) resultsEl.insertBefore(frag, mark); else resultsEl.appendChild(frag);
  if(!listRest.length){ if(mark) mark.remove(); stopBatches(); }
}

async function renderBrowse(){
  stopBatches();
  const my = ++renderToken; deepEntry = null; lastResults = null; setMastView("dictionary");
  document.body.classList.remove("rendering");   // a search's card build this list superseded
  paintAllBtn(false); reskinPending = false;
  hint.classList.remove("small");
  // A cold Firestore connection makes the header reads slow, so show a loading
  // pulse immediately (a blank landing reads as broken) and fetch the headers in
  // PARALLEL — firing them together turns dozens of round-trips into roughly one.
  resultsEl.innerHTML = '<div class="loadingdots" role="status" aria-label="Loading the dictionary"><span></span><span></span><span></span></div>';
  resultsEl.classList.remove("hidden"); document.body.classList.add("has-results");

  const words = window.AFDWords || [];
  const seedIds = words.map(w=>AFDCore.entryIdFor(w.id));
  const seen = new Set(seedIds);
  // ONE read of every word card (10-15). Each card then builds from the doc it's
  // handed, and its 🔊💬📖 counts come from the doc's `voices` (kept by the
  // afd-voice-counts function) — no per-word read or count query. Was ~91
  // round-trips a page load. A word without `voices` yet still counts itself.
  // No answer at all (offline) → each card falls back to its own read, as before.
  let all = null;
  primeAllSpellings();     // every card's spellings in one read, alongside the entries (10-15)
  try{ all = await getDocs(collection(db,"afd_entries")); }catch(e){ console.warn("[AFD] browse: entries", e); }
  if(my!==renderToken) return;
  const byId = new Map(all ? all.docs.map(d=>[d.id, d.data()||{}]) : []);
  const seedCards = await Promise.all(seedIds.map(id =>
    entryCard(byId.has(id) ? {entryId: id, meta: byId.get(id)} : {entryId: id}, false).catch(()=>null)));
  if(my!==renderToken) return;

  let userDocs = [];
  try{
    if(!all) throw new Error("no entries read");
    const snap = { docs: all.docs.filter(d=>(d.data()||{}).source==="user") };
    // a word its creator removed leaves the list at once (the purge deletes it
    // later); one a steward hid (steward.html) stays out until shown again
    userDocs = snap.docs.filter(d=>{ const x=d.data()||{};
      return !seen.has(d.id) && !x.removedAt && !x.hiddenAt; });
    // A contributed word is listed for everyone only once it has a voice they
    // can hear — otherwise it's a blank tile nobody else can say (no meaning to
    // go on) or a word whose only voice is private. Its creator always sees it,
    // so they can share or remove it. Seeded words always show: anyone can be
    // the first to say "moon". (Counts are memoised, so the card header reuses
    // this read.)
    const me = currentUser && currentUser.uid;
    const heard = await Promise.all(userDocs.map(d =>
      ((d.data()||{}).createdBy===me && me) ? true :
      (primeCounts(d.id, (d.data()||{}).voices), entryCounts(d.id)).then(c => (c.word + c.context + c.definition) > 0).catch(()=>false)));
    if(my!==renderToken) return;
    userDocs = userDocs.filter((d,i) => heard[i]);
  }catch(e){ console.warn("[AFD] browse: user entries", e); }
  const userCards = await Promise.all(userDocs.map(d =>
    entryCard({entryId: d.id, meta: d.data()||{}}, false).catch(()=>null)));
  if(my!==renderToken) return;

  // Unified list carrying the metadata the views need (creation date; entryId for counts).
  let items = [];
  seedCards.forEach((c,i)=>{ if(c) items.push({ card:c, entryId:seedIds[i], createdAt:0,
    meta:{ pic:words[i].pic, gloss:words[i].en, glossAr:words[i].ar, ...(byId.get(seedIds[i])||{}) } }); });
  userCards.forEach((c,i)=>{ if(c){ const x=userDocs[i].data()||{}, t=x.createdAt; items.push({ card:c, entryId:userDocs[i].id, createdAt:(t&&t.toMillis?t.toMillis():0), meta:x }); } });

  const allItems = items;
  let displayItems = allItems, withVoice = 0, coverageKnown = false;

  if(currentView==="needs"){
    // coverage worklist: only entries whose word has no spoken recording yet
    const counts = await Promise.all(allItems.map(it=>entryCounts(it.entryId).catch(()=>({word:0}))));
    if(my!==renderToken) return;
    withVoice = counts.filter(c=>(c.word||0)>0).length; coverageKnown = true;
    displayItems = allItems.filter((it,i)=> (counts[i].word||0)===0);
  }else if(currentView==="newest"){
    displayItems = allItems.slice().sort((a,b)=> (b.createdAt||0)-(a.createdAt||0));   // recent additions first
  }

  const frag = document.createDocumentFragment();
  if(currentView==="needs" && displayItems.length) frag.appendChild(askWordsButton(displayItems));
  const batched = displayItems.length > LIST_BATCH_AFTER;
  for(const it of (batched ? displayItems.slice(0, LIST_BATCH) : displayItems)) frag.appendChild(it.card.el);
  if(batched){
    const mark = document.createElement("div"); mark.className = "list-more"; mark.setAttribute("aria-hidden", "true");
    mark.innerHTML = '<span class="loadingdots"><span></span><span></span><span></span></span>';
    frag.appendChild(mark);
  }
  if(!displayItems.length){
    const e=document.createElement("div"); e.className="view-empty";
    e.textContent = currentView==="needs"
      ? AFDCore.t("list.allvoiced", displayMode)
      : AFDCore.t("list.empty", displayMode);
    frag.appendChild(e);
  }
  if(my!==renderToken) return;
  resultsEl.replaceChildren(frag);
  if(batched){
    listRest = displayItems.slice(LIST_BATCH);
    // the next batch goes on well before the marker is in view (rootMargin)
    listIO = new IntersectionObserver(es => { if(es.some(e => e.isIntersecting)) moreCards(false); }, { rootMargin: "1200px 0px" });
    listIO.observe(resultsEl.querySelector(".list-more"));
  }
  setBrowsing(true);
  browseItems = displayItems;
  if(typing){ if(displayMode==="sound") closeTyping(); else applyTyped(); }

  // Fill the meter: known already for the needs view; otherwise count in the
  // background so the plain list isn't held up waiting on it.
  if(coverageKnown){ setCoverage(withVoice, allItems.length); }
  else{ (async()=>{
    const cs = await Promise.all(allItems.map(it=>entryCounts(it.entryId).catch(()=>({word:0}))));
    if(my!==renderToken) return;
    setCoverage(cs.filter(c=>(c.word||0)>0).length, allItems.length);
  })(); }
}

/* ---- new entry: the dictionary is growable ------------------------------------
   Adding a word is its own small page now (add.html): say it, show it (photo /
   emoji / spoken meaning / Arabic), share it — with sign-in asked only at the
   end, once there's something worth keeping. It mints the entry itself when the
   word is shared, so nothing empty is created if someone backs out halfway.
   Both ways in — the "add a word" tile and "none of these" under search
   results — land there. */
function startNewEntry(){
  location.href = "add.html";
}

// (10-14) The "Add a word" tile atop the list is gone: the amber + in the mic
// panel says the same, and it stays on screen while the list scrolls.


/* "Needs a voice" → ask someone for them. A specific ask ("can you say one of
   these 5?") gets more voices than an open one. Five picked at random, so
   different shares spread the asks across the list; each with its own link,
   in the reader's tier (auto: English · Arabic; script/sound: Arabic). Share
   sheet, else WhatsApp — the same pattern as sharing one word. */
function askWordsButton(items){
  const b=document.createElement("button");
  b.className="addword askwords";
  b.innerHTML=`<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>`+
    `<span>${escapeHtml(AFDCore.t("needs.ask", displayMode))}</span>`;
  b.addEventListener("click", async ()=>{
    const pick = items.filter(it => it.meta && (it.meta.gloss || it.meta.glossAr))
      .map(it => [Math.random(), it]).sort((a,c)=>a[0]-c[0]).slice(0,5).map(x=>x[1]);
    const head = AFDCore.STRINGS["needs.ask.text"];
    const lines = pick.map(it=>{
      const m = it.meta, name = displayMode==="auto"
        ? [m.gloss, m.glossAr].filter(Boolean).join(" · ") : (m.glossAr || m.gloss);
      return (m.pic ? m.pic+" " : "") + name + "\n" + new URL("index.html#"+encodeURIComponent(it.entryId), location.href).href;
    });
    const text = (displayMode==="auto" ? head.ar+"\n"+head.en : head.ar) + "\n\n" + lines.join("\n\n");
    try{ if(navigator.share){ await navigator.share({ text }); return; } }
    catch(e){ if(e && e.name==="AbortError") return; }
    window.open("https://wa.me/?text="+encodeURIComponent(text), "_blank", "noopener");
  });
  return b;
}

/* Voices: a language-free count chip that opens an itemized list of utterances.
   One voice → a single avatar (no chip). Many → chip, tap to expand. Each row
   plays that utterance and repaints the box. A row that belongs to the signed-in

/* The hint remembers WHAT it says (hintNow), not just the HTML it drew, so a
   change of display mode can say the same thing again in the new mode. It used
   to stay as first drawn: switch from the bilingual mode during "Still
   looking…" and the English stayed on screen in the Arabic-only modes. */
let hintNow = null;        // { en, ar }  or  { key, code }
let reskinPending = false; // the display mode changed while a hold or search had the screen
function paintHint(){
  const h = hintNow; if(!h) return;
  const s = h.key ? (AFDCore.STRINGS[h.key] || { en:h.key, ar:"" }) : h;
  // Audio-first tiers (sound / script) speak to non-readers in Arabic; auto keeps
  // English with Arabic beneath, for you and bilingual helpers.
  if(displayMode!=="auto" && s.ar) hint.innerHTML = `<span class="ar solo">${escapeHtml(s.ar)}</span>`;
  else hint.innerHTML = escapeHtml(s.en||"") + (s.ar?`<span class="ar">${escapeHtml(s.ar)}</span>`:"");
  if(h.code){ const c=document.createElement("span"); c.className="code"; c.textContent=h.code; hint.appendChild(c); }
}
function setHint(en, ar){ hintNow = { en, ar }; paintHint(); }
/* A hint from the shared string table (afd-core STRINGS), with an optional small
   code beneath it — used by search, which names the failure it hit. */
function setHintKey(key, code){ hintNow = { key, code }; paintHint(); }
/* Draw again whatever view is current (after a change of display mode). */
function reskinView(){
  if(deepEntry) openEntry(deepEntry); else if(lastResults) render(lastResults); else renderBrowse();
}
/* A hold hides whatever is listed so the mic has the screen. Anything that ends
   without new results puts it back. */
function showResults(){
  if(reskinPending){
    // the display mode changed meanwhile: draw what is underneath in the new mode,
    // and keep the hint this hold or search just set (the redraw sets its own)
    const keep = hintNow; reskinView(); hintNow = keep; paintHint();
  }
  if(resultsEl.childElementCount){ resultsEl.classList.remove("hidden"); document.body.classList.add("has-results"); }
  setMastView(lastResults && !deepEntry ? "find" : "dictionary");   // the header names what is back on screen
}

}

const viewMenu=$("viewMenu"), mastScreen=$("mastScreen");
function viewMenuClose(){ if(viewMenu){ viewMenu.classList.remove("open"); viewMenu.setAttribute("aria-hidden","true"); } if(mastScreen) mastScreen.setAttribute("aria-expanded","false"); }
function viewMenuOpen(){ if(viewMenu){ viewMenu.classList.add("open"); viewMenu.setAttribute("aria-hidden","false"); } if(mastScreen) mastScreen.setAttribute("aria-expanded","true"); }
function viewLabel(v){ if(displayMode==="sound") return ""; return '<span class="vm-ar" dir="rtl">'+v.ar+'</span>'+(displayMode==="auto"?'<span class="vm-en">'+v.en+'</span>':''); }

// Account: shared per-origin session drives owner-only voice controls. A small
// button lets a fresh visitor sign in (Google); a speaker who used the recorder

const accountBtn = $("account");
const acctMenu=$("acctMenu"), acctWho=$("acctWho"), acctEdit=$("acctEdit"), acctHelp=$("acctHelp"), acctOut=$("acctOut");
function closeAcctMenu(){ if(acctMenu){ acctMenu.classList.remove("open"); acctMenu.setAttribute("aria-hidden","true"); } }

// Arabic-primary + English subtitle in auto, Arabic-only in script/sound.
// The self-facing indicator prefers the steward's KNOWN public identity when

// back to the plain account name. stewardKnownName is filled async below.
let stewardKnownName = "";
function acctWhoName(){
  return stewardKnownName || ((currentUser && (currentUser.displayName || currentUser.email || currentUser.phoneNumber)) || "").trim();
}
function syncAcctLabels(){
  const who = acctWhoName();
  if(acctWho)  acctWho.textContent = who || AFDCore.t("setup.signedin", displayMode);
  if(acctEdit) acctEdit.innerHTML  = AFDCore.tHTML("account.edit", displayMode);

}

function updateAccountUi(){
  if(!accountBtn) return;
  // A real account shows its initial — the KNOWN profile name's initial if one is
  // set, else the account's — upgraded to the profile photo when there is one. An
  // anonymous or signed-out session shows the person glyph, so it still reads as
  // "sign in" rather than looking set up (and hitting the create wall).
  const real = isRealUser();
  stewardKnownName = "";                     // reset; the async fetch below refills it
  const paint = ()=>{
    const who = acctWhoName();
    // signed in by phone: the "name" is a number, and its first character "+"
    // read as an add button — show the phone mark add.html uses instead
    const initial = /^[+\d]/.test(who) ? "\u260E" : (who[0]||"?").toUpperCase();
    accountBtn.innerHTML = `<span class="acct-initial">${escapeHtml(initial)}</span>`;
    accountBtn.setAttribute("aria-label", who ? AFDCore.tf("acct.signedin.as", displayMode, { who }) : AFDCore.t("acct.menu", displayMode));
    accountBtn.title = who || AFDCore.t("setup.signedin", displayMode);
  };
  if(real){
    paint();
    syncAcctLabels();
    const uid = currentUser.uid;
    (async()=>{
      // Prefer the steward's own KNOWN identity in their private indicator.
      let stewardHasAvatar=false;
      try{
        const sn = await getDoc(doc(db,"afd_stewards",uid));
        stewardKnownName = (sn.exists() && (sn.data()||{}).visibility==="known")
          ? (((sn.data()||{}).displayName)||"").trim() : "";
        stewardHasAvatar = (sn.exists() && (sn.data()||{}).hasAvatar===true);
      }catch(_){ stewardKnownName = ""; }
      if(!(isRealUser() && currentUser && currentUser.uid===uid)) return;   // auth changed mid-fetch
      paint(); syncAcctLabels();
      // A set photo wins over the initial — but only fetch when one exists, so
      // an obscure or no-photo steward never 404s the console.
      if(stewardHasAvatar){
        try{
          const url = await getDownloadURL(ref(store, "afd_avatars/"+uid+"/avatar"));
          if(isRealUser() && currentUser && currentUser.uid===uid)
            accountBtn.innerHTML = `<img class="acct-photo" src="${url}" alt="">`;
        }catch(_){ /* no photo — keep the initial */ }
      }
    })();
  } else {
    closeAcctMenu();
    accountBtn.innerHTML = `<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>`;
    accountBtn.setAttribute("aria-label", AFDCore.t("acct.signin.manage", displayMode));
    accountBtn.removeAttribute("title");
  }
  accountBtn.classList.toggle("in", real);
  const aw=$("acctWrap"); if(aw && window.afdCap) window.afdCap(aw, real ? "hdr.account" : "hdr.signin");
}
if(accountBtn){
  accountBtn.addEventListener("click", async (e)=>{
    e.stopPropagation();
    if(isRealUser()){                                   // signed in → open the account menu
      (acctMenu && acctMenu.classList.contains("open")) ? closeAcctMenu() : openAcctMenu();
      return;
    }
    // otherwise get a named account: the shared sign-in (afd-signin.js) in a
    // sheet — Google, a texted code (works inside WhatsApp's own browser), or email
    await signInSheet({ auth, label: (k)=> AFDCore.tHTML(k, displayMode === "sound" ? "script" : displayMode),
                        titleKey: "setup.signin.title", noteKey: "setup.signin.note" });

}

/* The incense-burner glyph is HOME: tap it to return to the whole dictionary

function goHome(){

}

<script>
/* Offline app shell (sw.js): lets this page open with no signal once it has been
   visited online. Network-first, so it never serves stale code to anyone online.
   Add ?nosw to the URL to switch it off on this phone (debugging). */
(function(){
  if(!("serviceWorker" in navigator)) return;
  if(/[?&]nosw\b/.test(location.search)){
    navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});
    return;
  }
  window.addEventListener("load",()=>{ navigator.serviceWorker.register("sw.js").catch(e=>console.warn("[AFD] sw", e)); });
})();
</script>
<script>
/* Header-icon captions come from the shared string table (afd-core STRINGS
   hdr.*) so they're one inventory with everything else — suggestible from the
   prompts tool, and edited in one place. data-cap is the pre-JS fallback. */
(function(){ try{
  document.querySelectorAll("[data-cap-key]").forEach(el=>{
    const s=(AFDCore.STRINGS||{})[el.getAttribute("data-cap-key")];
    if(s && s.ar) el.setAttribute("data-cap", s.ar);
  });
}catch(_){ } })();
window.afdCap = (el, key)=>{ try{ const s=(AFDCore.STRINGS||{})[key]; if(el && s && s.ar){ el.setAttribute("data-cap", s.ar); el.setAttribute("data-cap-key", key); } }catch(_){ } };
</script>
